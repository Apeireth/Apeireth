SPECIFICATION Spec

\* 三记录模型: 并发交错下同一组守恒命题 (REC 扩到 {"a","b","c"})。
CONSTANT REC = {"a", "b", "c"}
CONSTANT MAX_REV = 2

INVARIANT
    TypeOK
    InvProtectedNeverForgotten
    InvSweepKeepsProtected
    InvForgetIdempotent
    InvNoResurrection

