name: 问题反馈 · Bug
description: 遇到了错误、异常或与预期不符的行为？请告诉我们发生了什么。
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        谢谢你帮助改进 Apeireth。用自己的话描述即可，不需要了解内部架构或编译命令。
        可以先[搜索已有反馈](https://github.com/Apeireth/Apeireth/issues)；不确定如何使用时，欢迎到 [Q&A 提问](https://github.com/Apeireth/Apeireth/discussions/categories/q-a)。

        **这里的内容会公开。** 请勿提交 API Key、密码、令牌、完整配置、私人对话或他人的个人信息；截图和日志请先遮盖或删除敏感内容。
        疑似安全漏洞请改用[私密漏洞报告](https://github.com/Apeireth/Apeireth/security/advisories/new)。社区举报或申诉请查看[行为准则](https://github.com/Apeireth/Apeireth/blob/main/CODE_OF_CONDUCT.md)。

  - type: input
    id: version
    attributes:
      label: Apeireth 版本
      description: 填写你看到的版本号；找不到可写“不清楚”，并说明从哪里获取。自行构建可附提交号（选填）。
      placeholder: 版本号 / 下载来源或运行方式
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 设备与使用环境
      description: 系统及版本、使用入口（如命令行、API 或界面）；涉及浏览器时可补充浏览器名称。不需要设备序列号。
      placeholder: 例如：Windows 11，命令行；或 macOS，API 调用
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 问题是怎样出现的？
      description: 尽量列出最少的操作步骤。偶发或无法再次复现也可以提交，请说明发生前做了什么，不必猜测原因。
      placeholder: |
        1. 我正在做……
        2. 执行了……
        3. 出现了……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你原本希望发生什么？
      description: 简单描述你期待的结果。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么？
      description: 描述看到的结果或错误提示；如果方便，也请说明发生频率，以及是否阻止你继续操作。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误信息或日志（选填）
      description: 仅粘贴与问题相关且已去除敏感信息的片段，不需要开启调试模式或提交完整日志。没有日志可以留空。
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 截图与其他补充（选填）
      description: 可补充已遮盖敏感信息的截图、相关反馈链接、你尝试过的办法；不需要上传完整配置或私人对话。
    validations:
      required: false
