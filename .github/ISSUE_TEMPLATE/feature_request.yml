name: 功能建议 · Feature
description: 描述你想解决的问题，以及希望 Apeireth 帮你做到的事。
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        你的使用场景比技术方案更重要：不需要了解内部模块，也不需要指定实现方式或发布时间。
        已有具体需求，可以填写下面的表单；想先交流灵感，欢迎到 [Ideas 讨论](https://github.com/Apeireth/Apeireth/discussions/categories/ideas)。提交前可以[搜索已有建议](https://github.com/Apeireth/Apeireth/issues?q=is%3Aissue%20label%3Aenhancement)。

        **这里的内容会公开。** 请勿提交 API Key、密码、令牌、完整配置、私人对话或他人的个人信息；示例与截图请先去除敏感内容。
        疑似安全漏洞请使用[私密漏洞报告](https://github.com/Apeireth/Apeireth/security/advisories/new)。社区举报或申诉请查看[行为准则](https://github.com/Apeireth/Apeireth/blob/main/CODE_OF_CONDUCT.md)。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述一个具体场景：你想做什么、哪里不方便、它对你有什么影响。
      placeholder: |
        当我……时，需要……
        目前遇到的困难是……
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: 你希望 Apeireth 怎样帮助你？
      description: 描述你期待的使用体验或结果即可，不必提供技术方案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你目前怎样处理？（选填）
      description: 是否有暂时可用的办法？它还有什么不方便的地方？没有也可以留空。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 示例与其他补充（选填）
      description: 可提供去除敏感信息后的示例、草图、相关讨论链接；若与特定版本或设备有关，也可在这里说明。
    validations:
      required: false
