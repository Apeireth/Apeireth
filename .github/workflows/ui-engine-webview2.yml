name: ui-engine WebView2 验证

# ⚠️ **独立 workflow**（2026-11-01）：`workflow_dispatch` 要求 workflow 在
# **默认分支**存在才能被触发 ⇒ 而 `ui-engine-ci.yml` 只在特性分支上（main 的
# crates-ui 尚未合入）⇒ ⇒ 故拆成**只含手动触发**的独立文件。
#
# ## 为什么只有 `workflow_dispatch`
#
# ① push 到 main **不会**触发它 ⇒ ⇒ **不会**给 owner 发邮件
#    （owner 2026-10-31 明确抱怨过 CI 邮件洪水）；
# ② Windows runner 比 Linux 慢 ⇒ ⇒ 不进常规路径；
# ③ 常规门禁的**结论**不依赖它 ⇒ ⇒ 它是**补充**而非前置。
#
# ## 它验证什么
#
# 在 **Windows + WebView2 引擎**（= Edge 的渲染内核）里跑**同一套**浏览器能力探针
# （`drive_l1.py` 的五段：DOM 能力 / 纹理上传 / 产品宿主 / 双向绑定 / 组合集成）
# ⇒ ⇒ 证明「引擎能力不只在 Linux 桌面 Chromium 上成立」。
#
# ⚠️ **口径（0 装诚实真账）**：
# - 这是 **Edge/WebView2 引擎 headless**，**不是**「Tauri 应用内嵌 WebView2」的
#   端到端运行 ⇒ ⇒ 它覆盖**引擎兼容性**，不覆盖**宿主集成**；
# - Windows runner **无 GPU** ⇒ ⇒ 走软件渲染
#   ⇒ ⇒ 它**不**覆盖 GPU 路径（GPU 路径由 Linux 真实 GPU 的对比证据覆盖）。
on:
  workflow_dispatch:

concurrency:
  group: ui-engine-webview2-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  webview2:
    name: WebView2 能力探针（Windows / C2）
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli（与 crates-ui 硬钉版本一致）
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build harness wasm（wasm32）
        run: cargo build --release --target wasm32-unknown-unknown -p p5b-harness --locked
        working-directory: crates-ui/evidence/p5-b/harness

      # ⭐⚠️ 产物路径：`harness` 是**独立 workspace**（自带 `[workspace]` 表）
      #   ⇒ ⇒ 它的 target 目录是 **`harness/target/`**，**不是** `crates-ui/target/`
      #   ⇒ ⇒ 2026-11-01 首次运行就栽在这里（`The system cannot find the path specified`）。
      #   ⇒ ⇒ 这里先**断言存在**并在失败时**列出**所有 .wasm ⇒ ⇒ 下次一眼看出。
      - name: wasm-bindgen（产物直接落到 web/engine/pkg ⇒ 无需 node/vite）
        shell: pwsh
        run: |
          $wasm = "${{ github.workspace }}/crates-ui/evidence/p5-b/harness/target/wasm32-unknown-unknown/release/p5b_harness.wasm"
          if (-not (Test-Path $wasm)) {
            Write-Error "找不到 wasm 产物：$wasm"
            Write-Output "—— 实际找到的 .wasm ——"
            Get-ChildItem -Path "${{ github.workspace }}/crates-ui" -Recurse -Filter "*.wasm" -ErrorAction SilentlyContinue |
              Select-Object -First 10 -ExpandProperty FullName
            exit 1
          }
          wasm-bindgen --target web --out-dir web/engine/pkg --out-name p5b_harness $wasm
        working-directory: crates-ui/evidence/p5-b

      - name: 跑五段能力探针（WebView2 引擎）
        env:
          # ⭐ Edge（= WebView2 同一渲染内核）；runner 上无 GPU ⇒ 软件渲染。
          CHROME: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          APEIRETH_CHROME_SWIFTSHADER: '1'
          # ⭐ 直接伺服 web/ 根（**零 node 依赖** ⇒ 绕开「node_modules 符号链接」问题）。
          APEIRETH_L1_SERVE_ROOT: ${{ github.workspace }}\crates-ui\evidence\p5-b\web
        run: python crates-ui/evidence/p5-b/drive_l1.py

      - name: 上传证据（探针报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview2-l1-report
          path: crates-ui/evidence/p5-b/evidence/l1/report.json
          if-no-files-found: warn
