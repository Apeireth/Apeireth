name: Benchmark tracking (perf regression detection)

# R20 阶段 6 — 性能回归检测
# 主人 2026-08-05 21:09 拍板"BC 都派"
# 蓝图: docs/stage4/v09021-rust-translation-blueprint-2026-08-05.md §3.5 #7 perf
# 触发: PR + push to master/main
# 守门:
#   - 0 触碰 24 LOCKED crate src/ (per m3-hallucination-defense §6.1 项 8)
#   - 0 改 workspace version (per APEIRETH-VERSIONING §1)
#   - >10% slowdown 报 warning, >25% 报 error
#   - 0 改 benchmark 测试代码 (per APEIRETH-CONVENTIONS §2 路径系统 LOCKED 文档)

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

# === 防止多次 push 跑多次 bench ===
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: cargo bench vs 1.0.0 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # keyring → dbus-secret-service → libdbus-sys 需要系统库 (cargo bench --workspace 全编译)
      - name: "Install system deps (Linux: libdbus)"
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # === 守门 1: PR 没改 LOCKED crate src/ ===
      - name: Verify no LOCKED crate changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^crates/apeireth-[a-z-]+/src/.*\.rs$'; then
              echo "::error::PR touches LOCKED crate src/ (24 LOCKED 守门, per m3-hallucination-defense §6.1 项 8)"
              exit 1
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^Cargo\.toml$'; then
              echo "::error::PR touches root Cargo.toml — verify workspace version 严守 1.0.0 (per APEIRETH-VERSIONING §1)"
              exit 1
            fi
          fi
          echo "✅ 0 触碰 LOCKED crate, 0 改 workspace version"

      # === 守门 2: PR 没改 benchmark 测试代码 (LOCKED) ===
      - name: Verify no bench source changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -E '/benches/.*\.rs$'; then
            echo "::warning::PR touches benchmark source files — verify 这是 perf 改进而非 noise"
          fi

      # === 跑 cargo bench, 跟 1.0.0 baseline 对比 ===
      - name: cargo bench (--baseline main)
        # push 模式: 跟自己上次 main 对比
        # PR 模式: 跟 base ref 对比
        # 只跑 criterion (harness=false) bench 的 crate:
        #   cargo bench --workspace 会给无 [[bench]] 的 crate 生成默认 libtest harness bench,
        #   它不认 --save-baseline → "Unrecognized option: 'save-baseline'"
        #   (apeireth-acp 等 77 个纯库 crate 都中招, 故显式枚举, 不用 --workspace)
        run: |
          echo ">>> cargo bench (criterion crates) -- --save-baseline pr-${{ github.event.pull_request.number || github.run_number }}"
          cargo bench -p apeireth-bench -p apeireth-graph -p apeireth-i18n -p apeireth-lark -p apeireth-memory -p apeireth-team-lead -p apeireth-tui -p apeireth-voice -- --save-baseline "pr-${{ github.event.pull_request.number || github.run_number }}"

      # === 拉 1.0.0 baseline (从上次 release artifact) ===
      - name: Download 1.0.0 baseline (if exists)
        uses: actions/download-artifact@v4
        with:
          name: bench-baseline-1.0.0
          path: target/criterion/baseline-1.0.0
          if-no-files-found: ignore
        continue-on-error: true

      # === 性能回归检测 (>10% warning, >25% error) ===
      - name: Detect perf regression vs 1.0.0 baseline
        if: hashFiles('target/criterion/baseline-1.0.0/**/*') != ''
        run: |
          set -uo pipefail
          echo "=== 性能回归检测 (基准 1.0.0) ==="
          REGRESSION_FOUND=0
          CRITICAL_REGRESSION=0

          # criterion estimate JSON: target/criterion/<bench_name>/base/estimates.json
          for bench_dir in target/criterion/*/; do
            bench_name=$(basename "$bench_dir")
            # 跳过基线自身
            if [[ "$bench_name" == "baseline-1.0.0" ]]; then continue; fi
            # 跳过无 base 对比的
            if [[ ! -f "$bench_dir/base/estimates.json" ]]; then continue; fi

            # 提取基准 (1.0.0) 和当前 (新) 的 mean ns/iter
            BASE_MEAN=$(jq -r '.mean.point_estimate // 0' "$bench_dir/base/estimates.json" 2>/dev/null || echo "0")
            NEW_MEAN=$(jq -r '.mean.point_estimate // 0' "$bench_dir/new/estimates.json" 2>/dev/null || echo "0")

            if [[ "$BASE_MEAN" == "0" || "$NEW_MEAN" == "0" ]]; then
              echo "  [SKIP] $bench_name: 缺 baseline 或 new 数据"
              continue
            fi

            # 计算 slowdown 百分比 (new - base) / base * 100
            SLOWDOWN_PCT=$(echo "scale=2; ($NEW_MEAN - $BASE_MEAN) * 100 / $BASE_MEAN" | bc -l 2>/dev/null || echo "0")

            # 数值比较
            SLOWDOWN_ABS=$(echo "$SLOWDOWN_PCT" | tr -d '-')
            THRESHOLD_WARN=10.0
            THRESHOLD_ERROR=25.0

            if (( $(echo "$SLOWDOWN_ABS > $THRESHOLD_ERROR" | bc -l) )); then
              echo "::error::严重性能回归: $bench_name +${SLOWDOWN_PCT}% (>25% 阻塞)"
              CRITICAL_REGRESSION=1
              REGRESSION_FOUND=1
            elif (( $(echo "$SLOWDOWN_ABS > $THRESHOLD_WARN" | bc -l) )); then
              echo "::warning::性能回归: $bench_name +${SLOWDOWN_PCT}% (>10% 警告)"
              REGRESSION_FOUND=1
            else
              echo "  [OK] $bench_name: ${SLOWDOWN_PCT}% (基线 1.0.0)"
            fi
          done

          if [[ "$CRITICAL_REGRESSION" == "1" ]]; then
            echo "::error::存在严重性能回归 (>25%), PR 阻塞"
            exit 1
          fi
          if [[ "$REGRESSION_FOUND" == "1" ]]; then
            echo "::notice::存在性能警告 (>10%), 不阻塞但需 owner 复核"
          else
            echo "✅ 0 性能回归"
          fi
        shell: bash

      # === 上传本次 bench 报告 ===
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-${{ github.event.pull_request.number || github.run_number }}
          path: target/criterion/
          if-no-files-found: warn
          retention-days: 30

  # === 注释: PR 上贴性能对比 ===
  bench-comment:
    name: comment perf delta on PR
    runs-on: ubuntu-latest
    needs: bench
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Download bench report
        uses: actions/download-artifact@v4
        with:
          name: bench-report-${{ github.event.pull_request.number }}
          path: target/criterion/
          if-no-files-found: ignore
        continue-on-error: true

      - name: Comment perf delta
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench-delta
          message: |
            ## 📊 性能对比 (vs 1.0.0 baseline)

            | Bench | Δ% | 状态 |
            |-------|---:|------|
            <!-- BENCHMARK_TABLE -->

            > 守门: >10% 报 warning, >25% 报 error (本 job 仅报告, 不阻塞)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
