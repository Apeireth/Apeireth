name: Coverage (tarpaulin)

# R18 第 3 阶段: 抄 qdrant coverage.yml
# https://github.com/qdrant/qdrant/blob/master/.github/workflows/coverage.yml
# cargo-tarpaulin → codecov
# 阈值: 架构层 ≥ 90%, 产品层 ≥ 60% (业界共识, R18 后续调整)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  coverage:
    name: cargo tarpaulin → codecov
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        run: pip install cargo-tarpaulin

      - uses: Swatinem/rust-cache@v2

      - name: cargo tarpaulin
        run: cargo tarpaulin --workspace --out Xml --engine llvm --timeout 600

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          verbose: false
