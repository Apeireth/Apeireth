name: Coverage (tarpaulin)

on:
  push:
    branches: [master, main]
  pull_request:
    # ⭐ **paths 过滤**（2026-11-04 加）：CI 积压的根因是**PR 侧无过滤**
    # ⇒ ⇒ 每个 push 都触发全部 34 个 workflow（含 Kani / Miri / Coverage / OS matrix）
    # ⇒ ⇒ GitHub runner 排队 ⇒ ⇒ 积压 32 个。
    # ⇒ ⇒ 纯文档/台账改动**不触发**本 workflow（它守的是代码）
    # ⇒ ⇒ 代码 / 依赖 / 工具链 / 本 workflow 自身的改动**照跑**。
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'fuzz/**'
      - 'frontend/**/src-tauri/**'
      - 'frontend/**/package.json'
      - 'frontend/**/pnpm-lock.yaml'
      - '.github/workflows/coverage.yml'
    branches: ['**']

  workflow_dispatch:
permissions:
  contents: read

jobs:
  coverage:
    name: cargo tarpaulin (current workspace)
    runs-on: ubuntu-latest
    # 时限按实测重定（2026-11-11）：同一覆盖率范围三次实测 22m39s / 30m18s / 超限 30 分钟
    # ⇒ 是墙钟预算贴边 + runner 抖动，不是测试内容变慢 ⇒ 预算上调，采集范围与棘轮判定一字不动
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Run coverage for canonical crates
        run: >-
          cargo tarpaulin
          -p apeireth-core
          -p apeireth-runtime
          -p apeireth-tools-canonical
          -p apeireth-gateway
          -p apeireth-cli
          --out Xml --engine llvm --timeout 600

      - name: 覆盖率棘轮（只减不增）
        # 此前覆盖率只上报、不判定 —— 下滑无人拦。基线未记录时脚本会明确
        # 打印「ratchet INACTIVE」，不假装绿灯（见 scripts/check_coverage_ratchet.py 头注释）。
        run: python3 scripts/check_coverage_ratchet.py --check

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          verbose: false
