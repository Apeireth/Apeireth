#      - (release-build 待决)  → 候选: release.yml 已含
#      - (battle-1-2 待决)     → 候选: 等 R26 主人拍板挪到独立战役 workflow 或并入 rust.yml
#      - (ci-summary 待决)     → 候选: 删 (qdrant 模式无对应 job)
