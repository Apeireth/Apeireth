name: Dead code ratchet (死代码棘轮)

# 「字段/函数存了不用」的**机检守卫**（D-1，owner 2026-10-25 裁定）。
#
# 背景：`[workspace.lints.rust] dead_code` 长期是 `'allow'`（2026-08 为绕开
# 「别的协作者正在改的 src 文件」整体压掉）。压掉的代价是：这类缺陷
# ——「能力齐全但没接电」最常见的形态之一 —— **只能靠人搜**。
# 本仓实测已因此找到 4 个真实例（字段存了不用、函数永不调用）。
#
# 现在改成 `'warn'`，两道闸：
#   ① **真守卫（编译期）**：没有局部豁免的死代码 ⇒ clippy 报 warning ⇒
#      本 workflow 的 `cargo clippy -- -D warnings` 直接失败；
#   ② **棘轮（本 workflow 的检查步）**：既有豁免（`#[allow(dead_code)]` /
#      `#![allow(dead_code)]`）**只减不增** —— 没有这条，任何人加一个
#      `#[allow(dead_code)]` 就能把新债悄悄藏起来。
#
# 豁免清单与理由在 `scripts/dead-code-baseline.txt`；
# 判据与盲区写在 `scripts/check_dead_code.py` 的模块 docstring 里（读它再用）。

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'scripts/check_dead_code.py'
      - 'scripts/dead-code-baseline.txt'
      - '.github/workflows/dead-code-ratchet.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'scripts/check_dead_code.py'
      - 'scripts/dead-code-baseline.txt'
      - '.github/workflows/dead-code-ratchet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dead-code-ratchet:
    name: 死代码棘轮（豁免只减不增 + 编译期零死代码）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: 编译期守卫（dead_code = warn ⇒ 任何未豁免的死代码都红）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 棘轮（豁免清单只减不增）
        run: python3 scripts/check_dead_code.py
