name: Claims verify (verify_cmd 真跑)

# **H2 修复**（2026-10-28 审计认定）：
# `docs/status/claims.yaml` 里每条状态声明都写了 `verify_cmd`，
# 但 `docs_truth.py --verify` **只用 git grep/git diff**，**从不执行它**
# ⇒ ⇒ `verify_cmd` 曾是**装饰品** ⇒ 一条声明可以标 `PRODUCTION WIRED`，
# 而它声称的验证命令**早已失败或被删**，无人发现。
#
# 本 workflow 把「要么真跑，要么显式说明为什么不能跑」变成**强制**：
#   · 能跑的命令 ⇒ 真跑，要求退出码 0 且（cargo test 系）`0 failed`；
#   · 跑不了的（`<占位符>` / 本机缺工具）⇒ 必须在该 claim 写 `verify_skip_reason`，否则红。
#
# 为什么独立成 job 而不塞进 docs-truth：
#   它会**编译并跑测试**（分钟级），而 docs-truth 是秒级的纯文档检查
#   ⇒ ⇒ 混在一起会让文档检查失去"快反馈"的价值。
on:
  push:
    branches: [master, main]
  pull_request:
    # ⭐ **paths 过滤**（2026-11-04 加）：CI 积压的根因是**PR 侧无过滤**
    # ⇒ ⇒ 每个 push 都触发全部 34 个 workflow（含 Kani / Miri / Coverage / OS matrix）
    # ⇒ ⇒ GitHub runner 排队 ⇒ ⇒ 积压 32 个。
    # ⇒ ⇒ 纯文档/台账改动**不触发**本 workflow（它守的是代码）
    # ⇒ ⇒ 代码 / 依赖 / 工具链 / 本 workflow 自身的改动**照跑**。
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'fuzz/**'
      - 'frontend/**/src-tauri/**'
      - 'frontend/**/package.json'
      - 'frontend/**/pnpm-lock.yaml'
      - '.github/workflows/claims-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims-verify:
    name: 状态声明 verify_cmd 真跑
    runs-on: ubuntu-latest
    # ⚠️ **2026-11-11 调（PR #78 第二/三轮实测；PR #117 合并后沿用）**：45 分钟**从来不够** ——
    #   这份 job 的真实工作量 = 编译声明要用的测试产物（~160 个二进制）+ 跑 52 条声明
    #   ⇒ ⇒ 45 分钟下**它连预构建都跑不完**（历史 60 次运行 0 次成功，见提交正文）。
    #   ⇒ ⇒ 本机实测（debug=0，单个 runtime-assembly 测试目标 199s、产物 95MB）：
    #   ⇒ ⇒ 161 个测试目标 × 链接 ~15-20s ≈ 50 分钟 + 依赖编译 ~10 分钟
    #   ⇒ ⇒   + Tauri 桌面壳 ~10 分钟 + 三条整包声明重跑全部测试目标 ~15 分钟
    #   ⇒ ⇒   ⇒ 单 runner 4 核上**总墙钟 ≈ 85 分钟** ⇒ 90 分钟**卡在边缘**
    #   ⇒ ⇒ ⇒ 给足 150 分钟：这是**给足时间**，不是**放松验证**（判定条件一条没改）。
    timeout-minutes: 150
    # ⚠️ **2026-11-11 修（PR #78 第二轮实测 · 真因 = runner 磁盘爆）**：
    #   实测证据（job 130246639737 的 check-run annotation）：
    #     `Unhandled exception. System.IO.IOException: No space left on device :
    #      '/home/runner/actions-runner/cached/2.338.2/_diag/Worker_20261111-011632-utc.log'`
    #   ⇒ runner 连**自己的诊断日志**都写不下去 ⇒ job log blob 直接 404（BlobNotFound）
    #   ⇒ ⇒ **不是「声明内容红」，是磁盘红**（同款签名在 main tip 7d0a8111 上也有
    #   ⇒ ⇒ ⇒ 属仓级既有红，不是本 PR 引入的）。
    #   ⇒ ⇒ 磁盘大头 = cargo 产物的**调试信息**（Linux 上一个测试二进制含调试信息 ~300MB；
    #   ⇒ ⇒ 本机实测：system_one_knob 的 .pdb 279.6MB / system_one_execution 252MB
    #   ⇒ ⇒ ⇒ libapeireth_image_algo 的 .rlib 388MB —— 全是调试信息撑起来的）。
    #   ⇒ ⇒ 关掉调试信息 ⇒ 产物体积 ~10× 变小 ⇒ **验证强度一点不变**
    #   ⇒ ⇒ ⇒ （debuginfo 不改测试集合 / 断言 / 编译目标；`debug_assertions` 是另一条
    #   ⇒ ⇒ ⇒   独立开关，不受影响 —— 仓里 image/algo 那几条 `run with --release`
    #   ⇒ ⇒ ⇒   断言的语义保持原样）。
    # ⭐ **合并说明（2026-11-11 · PR #117 并入 main 时）**：PR #117 分支曾独立加过同款
    #   磁盘减负（`CARGO_PROFILE_DEV_DEBUG/TEST_DEBUG=0` + `CARGO_INCREMENTAL=0`，
    #   见下方 job 级 `env`）与 `timeout-minutes: 45` ⇒ ⇒ 两者指向**同一个真因**
    #   （runner 磁盘被 cargo 产物的调试信息撑爆），⇒ ⇒ 此处**取 main 侧**（150 分钟
    #   = 给足时间，不是放松验证；判定条件一条没改），**不保留 45 分钟**。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap Ubuntu DNS for system dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/provision_ci_dns.py

      - name: 安装系统依赖（dbus / wayland / pipewire / egl / **Tauri 桌面壳**）
        # ⚠️ Tauri 那几条声明（`sec.sql_readonly_gate` / `sec.provider_proxy_ssrf` /
        # `sec.desktop_file_roots`）要跑 `cd frontend/companion-desktop/src-tauri && cargo test --locked`
        # ⇒ 需要 webkit2gtk / gtk3 / cairo / soup ⇒ 不装就会**红**
        # （2026-10-28 实测：装齐后本地 `11 passed / 0 failed`）。
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libpipewire-0.3-dev \
            libspa-0.2-dev libegl1-mesa-dev libgbm-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libcairo2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Tauri 桌面壳要一个 **sidecar 占位**才能通过构建期校验
      # （与 `companion-desktop-ci.yml` 同一口径）。
      - name: 准备 Tauri sidecar 占位
        run: |
          mkdir -p frontend/companion-desktop/src-tauri/binaries
          touch frontend/companion-desktop/src-tauri/binaries/apeireth-x86_64-unknown-linux-gnu
          chmod +x frontend/companion-desktop/src-tauri/binaries/apeireth-x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@1.97.1

      # ⚠️ **合并说明（2026-11-11 · PR #117 并入 main 时）**：PR #117 分支曾在此处
      #   **独立加过同一个步骤**（「Install cargo-nextest」+ 同款注释）⇒ ⇒ 自动合并后
      #   会出现两条同源步骤 ⇒ ⇒ **只保留下方 rust-cache 之后的那一条**
      #   （注释更完整）⇒ ⇒ **不删功能**：安装 nextest 仍然做，且它是两条 nextest
      #   声明（rt.system_one_internal / mem.failure_learning_bridge）成立的前提。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: claims-verify

      # ⚠️ **2026-11-11 补（PR #78 首跑实测）**：`docs/status/claims.yaml` 有 **2 条**声明的
      # `verify_cmd` 用的是 `cargo nextest run`（`rt.system_one_internal` /
      # `mem.failure_learning_bridge`）⇒ ⇒ 而本 job 原先**没装 nextest**
      # ⇒ ⇒ 那 2 条会因「no such command: nextest」**假红**（不是声明内容问题）。
      # ⇒ ⇒ 与 `rust.yml`（:99-100）**同口径**装：`taiki-e/install-action` 取预编译二进制
      #      （不重编译 ⇒ 不吃 runner 磁盘 ⇒ 不撞 claims-verify 已知的磁盘爆问题）。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # ⭐ **磁盘减负**（2026-11-05 · CI runner 曾因磁盘爆而 exit 101）：
      # 预构建两个 workspace 会吃掉 runner 的全部空间 ⇒ ⇒ `rustls`/`reqwest` 编译期
      # archive 写失败 ⇒ ⇒ claims-verify 假红（**不是** claim 内容问题）。
      # ⇒ ⇒ 清 apt 缓存与 rustup 旧组件 ⇒ ⇒ 把空间还给编译。
      - name: 腾空间（apt 缓存 + rustup 旧组件 + runner 镜像大件）
        run: |
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb || true
          rustup self update --no-self-update 2>/dev/null || true
          rustup component remove rustfmt clippy 2>/dev/null || true
          # ⚠️ **2026-11-11 补（PR #78 第二轮实测）**：GitHub 托管 runner 镜像预装了
          # dotnet / android SDK / ghc / boost / ghcup / CodeQL / miniconda / swift，
          # 它们**本 job 一个都用不到** ⇒ ⇒ 删掉换磁盘（每个都是 GB 级）。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/miniconda /usr/share/swift || true
          df -h / | tail -1

      # ⚠️ **2026-11-11 修（PR #78 第二轮实测 · 磁盘爆的直接原因）**：
      #   初版是 `cargo build --workspace --tests --locked` ⇒ ⇒ 一次把**全 workspace**
      #   的测试产物都编出来（31 个 crate ⇒ 数百个测试二进制；Linux 上每个含调试信息
      #   ~300MB）⇒ ⇒ 单 runner 的空间根本装不下 ⇒ ⇒ 磁盘爆（上面那条 annotation）。
      #   ⇒ ⇒ 改为：**只预编译「声明实际用到」的那几个 crate 的库**
      #   ⇒ ⇒ ⇒ 测试产物（真正的大头）由各条 claim 的 verify_cmd **按需**生成
      #   ⇒ ⇒ ⇒ ⇒ 只生成**用得到**的那几十个 ⇒ ⇒ 磁盘降到 1/5 以下。
      #   ⇒ ⇒ ⇒ ⇒ **不降低任何验证强度**：声明要跑什么测试，仍然原样跑什么测试。
      - name: 预构建（只编声明真正用到的测试产物）
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/claim_prebuild.txt
          import json, re, pathlib, subprocess
          txt = pathlib.Path('docs/status/claims.yaml').read_text(encoding='utf-8')
          meta = json.loads(subprocess.check_output(
              ['cargo', 'metadata', '--no-deps', '--format-version', '1'],
              text=True, encoding='utf-8'))
          names = {p['name'] for p in meta['packages']}
          cmds = re.findall(r'verify_cmd:\s*"([^"]+)"', txt)
          seen = []
          for c in cmds:
              for part in c.split('&&'):
                  if 'cargo test' not in part:
                      continue
                  if 'src-tauri' in part:
                      continue          # 独立 workspace ⇒ 另有专门的预构建步
                  m = re.search(r'-p\s+([A-Za-z0-9_-]+)', part)
                  if not m:
                      continue          # 无 -p ⇒ 不是根 workspace 的 crate
                  pkg = m.group(1)
                  if pkg not in names:
                      continue          # 非根 workspace 的包（另有预构建步）
                  tests = re.findall(r'--test\s+([A-Za-z0-9_-]+)', part)
                  if tests:
                      sel = ' '.join('--test ' + t for t in tests)
                  elif '--lib' in part:
                      sel = '--lib'
                  else:
                      sel = ''         # 过滤器式 ⇒ cargo 会编该包的**全部**测试目标
                  key = (pkg, sel)
                  if key not in seen:
                      seen.append(key)
          if not seen:
              print('::error::claims.yaml 里没解析出任何可预构建的测试目标', file=__import__('sys').stderr)
              raise SystemExit(1)
          # 整包预构建已覆盖该包的具体测试目标 ⇒ 去重（少跑几轮 cargo，快）
          whole = {pkg for pkg, sel in seen if sel == ''}
          for pkg, sel in seen:
              if pkg in whole and sel != '':
                  continue
              print(f'cargo test -p {pkg} {sel} --no-run --locked'.rstrip())
          PY
          echo "--- 预构建命令（$(wc -l < /tmp/claim_prebuild.txt) 条）---"
          cat /tmp/claim_prebuild.txt
          while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::group::预构建 $line"
              eval "$line"
              echo "::endgroup::"
          done < /tmp/claim_prebuild.txt

      # `src-tauri` 是**独立 [workspace]**（不能落到根 workspace）⇒ 单独预构建。
      # ⚠️ **不用 `--all-targets`**（2026-11-05 修正）：它会额外构建 bench / example
      # ⇒ ⇒ 而 Tauri 侧那两条 claim 的 verify_cmd 只跑 `cargo test --locked <filter>`
      # ⇒ ⇒ ⇒ `--tests` 足够 ⇒ ⇒ **不降低任何验证** ⇒ ⇒ 只省磁盘。
      - name: 预构建 Tauri 桌面壳（独立 workspace）
        working-directory: frontend/companion-desktop/src-tauri
        run: cargo build --workspace --tests --locked

      # ── 前端侧声明的真跑环境（2026-11-06 补）────────────────────────────
      # `sec.terminal_permission_surfaces` 的 verify_cmd 是
      #   `cd frontend/companion-desktop && pnpm test`
      # ⇒ ⇒ 本 job 原先**既没装 pnpm、也没装 Node、也没装前端依赖**
      #    ⇒ ⇒ 该声明在 CI 上是**假红**（不是声明内容问题）：
      #      ① runner 默认 Node < 22.6 ⇒ `--experimental-strip-types` 不可用
      #         （runner 对 66/83 个套件用该 flag 直跑 .mjs 引 .ts）
      #         ⇒ `ERR_NO_TYPESCRIPT` ⇒ 66 个套件灭 ⇒ pnpm `ELIFECYCLE` exit 1；
      #      ② 没跑 `pnpm install` ⇒ 被测模块 import 的第三方包
      #         （dompurify / highlight.js / katex / marked）不存在。
      # 口径与 `companion-desktop-ci.yml` 的 svelte-ui job 同源（那边 node-version: 22）。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node (22 —— 须 >= 22.6 才有 --experimental-strip-types)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/companion-desktop/pnpm-lock.yaml'

      - name: pnpm install (前端工作区)
        working-directory: frontend/companion-desktop
        run: pnpm install --frozen-lockfile

      # ⭐ **预热 cargo 索引缓存**（2026-11-11 · PR #117 红项 13 续）：
      # 两条声明的 verify_cmd 直接调 `cargo nextest ... --offline`
      #   （`rt.system_one_internal` / `mem.failure_learning_bridge`）
      # ⇒ ⇒ nextest 每次先跑一次 **cargo metadata --all-features**
      #    （实测命令：`cargo --color=always metadata --format-version=1
      #      --all-features --filter-platform=<target> --offline`）
      # ⇒ ⇒ `--offline` 下它要求 runner 的 cargo 索引里**有 optional-only 依赖的条目**
      #    （本仓：`napi` / `napi-derive` / `pyo3` / `cbindgen` —— 都是 `apeireth-sdk`
      #    的 optional 依赖，默认 feature 构建**不会**下载它们）
      # ⇒ ⇒ runner 缓存里没有 ⇒ metadata 解析失败 ⇒ nextest 直接退出 **102**
      #    ⇒ ⇒ 那两条声明在 CI 上**恒红**（不是声明内容问题）。
      # ⇒ ⇒ 解法：**先在线解析一次全 feature 图**，把索引条目 + 依赖清单补进
      #    cargo 缓存 ⇒ 之后 nextest 的 `--offline` metadata 才解析得动。
      # ⇒ ⇒ **不降低任何验证强度**：两条声明的 verify_cmd 一字未改，测试照跑照判。
      # ⇒ ⇒ 顺带说明：为什么不用「改成 cargo test」绕开？
      #    `scripts/check_claims_verify.py` 的 `TEST_COMMANDS` 明确含 `cargo nextest`
      #    ⇒ ⇒ 门禁**设计上就支持** nextest 声明 ⇒ ⇒ 该修的是**环境**，不是声明。
      - name: 预热 cargo 索引缓存（nextest 的 cargo metadata --all-features --offline 依赖它）
        run: cargo metadata --format-version=1 --all-features --locked > /dev/null

      # **H5 真值闸**：口径为 PRODUCTION WIRED / DEFAULT ENABLED / HARDWARE VALIDATED
      # 的声明**不许**靠「豁免 / 延后」成立 ⇒ 否则「已接线」只是个词。
      - name: 高口径声明必须真验（H5）
        run: python3 scripts/check_claims_verify.py --wired-gate

      # ⚠️ **合并说明（2026-11-11 · PR #117 并入 main 时）**：main 侧在同一 job 内另有一条
      #   作用等价的预热步骤（`cargo metadata --format-version 1 --all-features --locked`，
      #   注释同样指向 nextest 的 102 退出码）⇒ ⇒ 自动合并后变成**两条同源步骤**
      #   ⇒ ⇒ **只保留上方那一条**（注释更完整、位置更靠前 ⇒ H5 真值闸之前索引已就绪）
      #   ⇒ ⇒ **不删功能**：联网预热全特性依赖图这一步仍然做，且两条 nextest 声明
      #   离线解析依赖图的前提仍然成立。

      - name: 跑每条 claim 的 verify_cmd
        run: python3 scripts/check_claims_verify.py --check --timeout 600
