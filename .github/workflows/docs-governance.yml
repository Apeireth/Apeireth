name: Docs governance (链接/索引/豁免棘轮)

# 文档治理门禁（2026-10-23 文档治理批）。
#
# 为什么单独一条：docs-truth 管的是"**内容真源**"（claims/STATUS/徽章是否与源码一致），
# 本条管的是"**文档体系自身**"——链接是否可达、目录是否有索引、层与题材是否合法、
# 豁免表有没有腐化。两者不可互相替代。
#
# 阻塞范围：
#   - 链接断链（live 口径；archive 内部的历史链接不算，那是"历史事实"不是缺陷）
#   - 链接语法断裂（`[x]target` 缺括号）——这类损坏不是链接，普通链接检查看不见
#   - 目录缺 README 索引 / INDEX.csv 未覆盖 / 层与题材非法
#   - 豁免表腐化：字段不全、分类非法、目标已恢复（可清理）、复查日期过期
#
# 豁免表棘轮：**只减不增**。豁免是唯一能让门禁放过失效链接的机制，
# 若它能无限增长，门禁迟早变成"全场豁免"。

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'reports/**'
      - 'scripts/docs_links.py'
      - 'scripts/docs_index.py'
      - '.github/workflows/docs-governance.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'reports/**'
      - 'scripts/docs_links.py'
      - 'scripts/docs_index.py'
      - '.github/workflows/docs-governance.yml'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 链接完整性（含语法断裂 + 豁免表棘轮）
        run: python3 scripts/docs_links.py --check

      - name: 索引分层一致性（目录索引 / 覆盖 / 层 / 题材 / 重定向表）
        run: python3 scripts/docs_index.py --check

      # 文档**分类**守卫（owner 2026-10-28 指令：AI 落下的文档都要有分类，
      # 不论是否接生产都要被严格约束）。口径见脚本头注释。
      - name: 文档分类（九类 + 每类强制结构 + 存量棘轮）
        run: python3 scripts/check_doc_class.py --check

      - name: 文档分类分布（供人工看；不阻塞）
        if: always()
        run: python3 scripts/check_doc_class.py --report

      # 批次进度页的**自动事实块**（H7）：页面上的关键事实必须等于代码事实
      # ⇒ 手写的散文无法覆盖它（漂移即红）。口径见脚本头注释。
      - name: 批次进度页事实块（进度页不许手写漂移）
        run: python3 scripts/check_batch_status.py --check

      - name: 题材与层的分布（供人工看体系是否失衡；不阻塞）
        if: always()
        run: python3 scripts/docs_index.py --report

      # **门禁清单的漂移守卫**（P0 · 2026-10-30）：
      # 人读副本（PR 模板等）里的锁定清单 / 版本 / crate 数必须**等于契约**
      # ⇒ ⇒ 手写副本从此不可能默默过期（实测：PR 模板曾写「24 LOCKED crate」「1.2.0」，
      #      而契约早已是 2.0.0-rc.4 / 30 members ⇒ CI 守的与模板写的**不一致**）。
      - name: 门禁清单一致性（PR 模板等人读副本 vs 契约 [ci_gates]）
        run: python3 scripts/gen_gate_manifest.py --check

      # **守卫清单同步**（2026-10-30）：全仓守卫的机读清单须与实际一致
      # ⇒ 漏登记的守卫 ⇒ 合并裁决层会**漏掉**它（假绿）。
      - name: 守卫清单同步（机读清单 vs 仓库实际）
        run: python3 scripts/check_guard_inventory.py
