name: Docs truth (P1c blocking)

# 文档事实体系（第三线）：claims.yaml = 唯一状态真源；STATUS.md/README 徽章 = 生成物。
# P0 期间两步 report-only 观察误报；P1c 起改为阻塞：
#   - FAIL（证据缺失/开关不存在）= 红；
#   - STALE（源码动过而 verified_at 未更新）= 红（changed-claim 阻塞）；
#   - REVIEW_DUE 只提示不阻塞；生成物/徽章 drift = 红。

# **无 paths filter —— 每次 push/PR 都跑**。
#
# 原因（2026-10-23 修）：本 workflow 是 **required check**，而 GitHub 的规则是
# 「required check 必须永远有结论」。带 paths filter 时，改动落在 filter 之外
# （例如只改 `scripts/*.sh`）的 PR 上，这个 check **根本不会触发**，
# PR 会永远停在 "Expected — Waiting for status to be reported"，无法合并。
#
# 代价很小：脚本体是 `python3 scripts/docs_truth.py --verify --block-stale`
# （git diff + 文件检查，秒级），远小于其它 required check。
# 语义也更对：claims 是唯一真源，**任何**改动都该验一次它与现实是否一致。
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-truth:
    name: docs truth gate (P1c blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify claims (evidence + staleness)
        run: |
          python3 scripts/docs_truth.py --verify --block-stale

      - name: Check generated STATUS.md + README badges drift
        run: |
          python3 scripts/docs_truth.py --check

      - name: R3a wiring ledger + env registry (ADR-0004)
        run: |
          python3 scripts/wiring_report.py --check-env-registry
          python3 scripts/wiring_report.py --verify

      - name: Setup Python (R6-C ledger verifier)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verification ledger (R6-C, read-only)
        run: |
          python -m pip install --quiet pyyaml
          python scripts/verify_ledger.py --quiet
