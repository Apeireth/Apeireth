name: 4 协议 e2e (R17 战役 4-4 升级)

# 战役 4-4: 后端部署升级
# 4 协议 e2e 真接 minimaxi (主人 apikey env), 验证 200 OK
# - OpenAI Chat Completions (/v1/chat/completions)
# - OpenAI Responses API (/v1/responses)
# - Anthropic Messages (/v1/messages)
# - Google Gemini (generateContent)
#
# 条件: APEIRETH_API_KEY secret 存在时跑, 不存在时 skip (with notice)
# 不假装: 4 协议全真接, 任何失败都让 CI fail

on:
  push:
    branches: [master, main, rebase/d7d8-into-integration]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ==============================================================
  # 4 协议 e2e 真接 minimaxi
  # ==============================================================
  protocol-e2e:
    name: 4 协议 e2e (minimaxi)
    runs-on: ubuntu-latest
    # 主人 apikey 存在时跑, 缺失时跳过 (fork PR 不会暴露 secret)
    if: ${{ env.APEIRETH_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      # === 步骤 1: 编译 apeireth-api (含 4 协议 e2e examples) ===
      - name: cargo build --release -p apeireth-api --examples
        run: cargo build --release -p apeireth-api --examples --verbose

      # === 步骤 2: OpenAI Chat Completions 真接 minimaxi ===
      - name: "协议 1/4 - OpenAI Chat Completions (/v1/chat/completions)"
        run: cargo run --release -p apeireth-api --example openai_chat
        env:
          APEIRETH_API_KEY: ${{ secrets.APEIRETH_API_KEY }}
          APEIRETH_API_URL: ${{ vars.APEIRETH_API_URL || 'https://api.minimaxi.com' }}

      # === 步骤 3: OpenAI Responses API 真接 minimaxi ===
      - name: "协议 2/4 - OpenAI Responses API (/v1/responses)"
        run: cargo run --release -p apeireth-api --example openai_responses
        env:
          APEIRETH_API_KEY: ${{ secrets.APEIRETH_API_KEY }}
          APEIRETH_API_URL: ${{ vars.APEIRETH_API_URL || 'https://api.minimaxi.com' }}

      # === 步骤 4: Anthropic Messages 真接 minimaxi ===
      - name: "协议 3/4 - Anthropic Messages (/v1/messages)"
        run: cargo run --release -p apeireth-api --example anthropic
        env:
          APEIRETH_API_KEY: ${{ secrets.APEIRETH_API_KEY }}
          APEIRETH_API_URL: ${{ vars.APEIRETH_API_URL || 'https://api.minimaxi.com' }}

      # === 步骤 5: Google Gemini GenerateContent 真接 minimaxi ===
      - name: "协议 4/4 - Google Gemini (generateContent)"
        run: cargo run --release -p apeireth-api --example gemini
        env:
          APEIRETH_API_KEY: ${{ secrets.APEIRETH_API_KEY }}
          APEIRETH_API_URL: ${{ vars.APEIRETH_API_URL || 'https://api.minimaxi.com' }}

  # ==============================================================
  # 4 协议 e2e 跳过提示 (无 apikey 时)
  # ==============================================================
  skipped-notice:
    name: 4 协议 e2e (skipped - 无 APEIRETH_API_KEY)
    runs-on: ubuntu-latest
    # 主人 apikey 不存在时跑 (提示性 job)
    if: ${{ env.APEIRETH_API_KEY == '' }}
    steps:
      - name: Notice
        run: |
          echo "⚠️ APEIRETH_API_KEY secret 未配置, 4 协议 e2e 跳过."
          echo "   在 Settings → Secrets → Actions 配置 APEIRETH_API_KEY 后重跑."
          echo "   单元测试 + integration test (wiremock 4 协议 fake server) 见 rust-ci.yml workspace job."
