name: Protocol integration tests

on:
  push:
    branches: [master, main]
  pull_request:
    # ⭐ **paths 过滤**（2026-11-04 加）：CI 积压的根因是**PR 侧无过滤**
    # ⇒ ⇒ 每个 push 都触发全部 34 个 workflow（含 Kani / Miri / Coverage / OS matrix）
    # ⇒ ⇒ GitHub runner 排队 ⇒ ⇒ 积压 32 个。
    # ⇒ ⇒ 纯文档/台账改动**不触发**本 workflow（它守的是代码）
    # ⇒ ⇒ 代码 / 依赖 / 工具链 / 本 workflow 自身的改动**照跑**。
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'fuzz/**'
      - 'frontend/**/src-tauri/**'
      - 'frontend/**/package.json'
      - 'frontend/**/pnpm-lock.yaml'
      - '.github/workflows/protocol-e2e.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  protocol-tests:
    name: protocol and gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Protocol tests
        run: cargo test -p apeireth-protocol --tests --locked

      - name: Gateway contract tests
        run: cargo test -p apeireth-gateway --tests --locked
