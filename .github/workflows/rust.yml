name: Rust tests (OS matrix + cargo-nextest)

# R25 Stage 1: 独立 rust tests workflow (qdrant 模式)
# 对齐: qdrant/.github/workflows/rust.yml
# 模板: https://github.com/qdrant/qdrant/blob/master/.github/workflows/rust.yml
# 结构对齐: tokio ci.yml [test-tokio-full] / [test-workspace-all-features] job
# 结构对齐: wasmtime main.yml [ci] job
#
# 跟 rust-ci.yml 的关系 (R25 Agent D 2026-08-10):
#   - rust-ci.yml = 旧"一锅炖"R18 升级版 (OS matrix + nextest + release-build + battle-1-2 + ci-summary)
#   - rust.yml = 新 qdrant 风格"仅测试"workflow (本文件)
#   - 两者临时并存 1 周 (per R25 硬约束 #6: 保留 fallback)
#   - R26+ 续: 主人拍板后从 rust-ci.yml 删 rust-tests job, 单一来源
#
# 验收 (按 qdrant rust.yml 1:1):
#   - 3 OS matrix (ubuntu-latest + windows-latest + macos-latest) × stable
#   - cargo build --workspace --tests --locked exit 0
#   - cargo nextest run --workspace --profile ci --locked exit 0
#   - JUnit XML 上传 artifact (target/nextest/ci/junit.xml)

on:
  push:
    branches: [main, feature/cognitive-infrastructure-vnext, feature/memory-v2.2-production-completion]
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  rust-tests:
    name: cargo nextest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Verify current workspace does not reach legacy/
        run: python scripts/check_no_legacy_deps.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # keyring/dbus/wayland/pipewire/egl 需要系统库 (仅 Linux)
      - name: "Install system deps (Linux: libdbus + libwayland + libpipewire + libegl)"
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libwayland-dev libpipewire-0.3-dev libspa-0.2-dev libegl1-mesa-dev libgbm-dev pkg-config
          pkg-config --exists libpipewire-0.3
          pkg-config --modversion libpipewire-0.3
          pkg-config --exists egl
          pkg-config --modversion egl

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          # FIXME: macOS cache bin 临时关 (Swatinem/rust-cache#341)
          cache-bin: ${{ matrix.os != 'macos-latest' }}

      - name: cargo build --workspace --tests --locked
        run: cargo build --workspace --tests --locked

      - name: cargo nextest run --workspace --profile ci --locked
        # profile "ci" 在 .config/nextest.toml 定义 (fail-fast + retries 2)
        run: cargo nextest run --workspace --profile ci --locked

      - name: Canonical process isolation integration tests
        run: cargo test -p apeireth-tools-canonical --test process_executor --locked -- --nocapture

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.os }}.xml
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # === 8 硬墙守门 (per CONTRIBUTING.md §0 触碰实查) ===
  # 跟 companion-desktop-ci.yml 平行, 但只盯根 workspace
  hard-walls:
    name: 8 硬墙守门 (LOCKED / version / baseline / 14 键 / V1136)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # push event: 取上一次 commit (排除自身)
            BASE=$(git rev-parse HEAD~1)
            # 若首次 commit, fallback 到空
            if [ -z "$BASE" ] || [ "$BASE" = "HEAD" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD)
            fi
            echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: "守门 1: 0 触碰契约 [locked] 源码 (pure fmt diff 放行)"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::warning::base_sha 空, 跳过守门 1"
            exit 0
          fi
          # ADR-0011 D5：24 LOCKED crate 口径已形式撤销（R148），改为契约唯一真源
          # docs/architecture/contract.toml [locked] 的源码文件（9 锚 / 键集 / 脊柱）。
          # workspace.version 由守门 2 治理、R11 baseline 由守门 3 治理（同一契约的三项）；
          # 禁止在本 workflow 手抄路径清单（D5：禁硬编码）。
          LOCKED_FILES=$(python3 - <<'PY'
          import tomllib
          with open("docs/architecture/contract.toml", "rb") as f:
              contract = tomllib.load(f)
          for _key, path in contract.get("locked", {}).items():
              if isinstance(path, str) and path.endswith(".rs"):
                  print(path)
          PY
          )
          if [ -z "$LOCKED_FILES" ]; then
            echo "::error::无法从 contract.toml [locked] 读到受锁源码文件"
            exit 1
          fi
          EXISTING=""
          for f in $LOCKED_FILES; do
            if [ -f "$f" ]; then
              EXISTING="$EXISTING $f"
            else
              echo "::error::契约登记的受锁文件不存在: $f"
              exit 1
            fi
          done
          HITS=$(git diff --name-only "$BASE"...HEAD -- $EXISTING 2>/dev/null || true)
          if [ -z "$HITS" ]; then
            echo "✅ 0 触碰契约 [locked] 源码 ($EXISTING)"
            exit 0
          fi
          # 守门宽限: pure fmt diff (whitespace-only 重排) 放行 —— S-2 实事求是 + O-5 不假装。
          # 检测: git diff --word-diff=porcelain 的 +/- word 行；全 ~ = 纯空白重排。
          HARD_HIT=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            WORD_DIFF=$(git diff --word-diff=porcelain "$BASE"...HEAD -- "$f" 2>/dev/null | grep -E '^[+-][^-+~ ]' || true)
            if [ -z "$WORD_DIFF" ]; then
              echo "  pure fmt: $f (无 word-level 增删, 放行)"
            else
              echo "  logic 改: $f (word-level 增删, 必须人工 review):"
              echo "$WORD_DIFF" | head -5
              HARD_HIT="$HARD_HIT$f\n"
            fi
          done <<< "$HITS"
          if [ -n "$HARD_HIT" ]; then
            echo "::error::契约 [locked] 源码 logic 触碰 (非 fmt):"
            echo -e "$HARD_HIT" | grep -v '^$'
            exit 1
          fi
          echo "✅ 契约 [locked] 源码仅纯 fmt 改 (logic 0 触碰)"

      - name: "守门 2: workspace.version matches release authority"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          CUR=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep -E '^version\s*=' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PREV=$(git show "$BASE:Cargo.toml" 2>/dev/null | sed -n '/^\[workspace\.package\]/,/^\[/p' | grep -E '^version\s*=' | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "")
          echo "workspace.version: prev=$PREV cur=$CUR"
          if [ -z "$CUR" ]; then
            echo "::error::workspace.version is missing"
            exit 1
          fi
          # 语义修正 2026-10-03 (对齐仓内 release authority 本义):
          #   - o6-anchor #4: "The workspace package version is the active release
          #     authority" —— version 本身就是权威, 守的是它存在且合法;
          #   - release-prep.sh A1: "matches release authority" = 等于本次 release
          #     期望值 (允许随 release 递进), 不是"相对 base 一律不许变"。
          # 旧实现 (PREV != CUR 即 fail) 与仓内版本轴递进流程 (rc.1→rc.2→rc.3,
          # 见 CHANGELOG "版本轴递进" 系列提交) 自相矛盾: 每个 release 提交必假红。
          # 现规则: ① 必须合法 semver; ② 变动时必须有 release 拍板证据 ——
          # CHANGELOG.md 含新版本号条目。零变动照旧放行。
          if ! echo "$CUR" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::workspace.version 非法 semver: $CUR"
            exit 1
          fi
          if [ -n "$PREV" ] && [ "$CUR" != "$PREV" ]; then
            # 拍板证据 (仓内惯例): ① `release:` 提交携带新版本号 (如 "release: 版本轴
            # 递进 2.0.0-rc.3"); 或 ② CHANGELOG.md 含新版本号条目。二者皆无 = 拍板
            # 证据缺失, 挡下。注: CHANGELOG 不强制跟版本轴记账 (rc.2/rc.3 起采
            # "断言已编译期派生, 零同步负担" 约定), 故 ① 是主通道。
            HIT=$(git log --format='%s' "$BASE"..HEAD | grep -E '^release[:：]' | grep -F "$CUR" | head -1 || true)
            if [ -z "$HIT" ] && grep -qF "$CUR" CHANGELOG.md; then
              HIT="CHANGELOG.md 含 $CUR 条目"
            fi
            if [ -z "$HIT" ]; then
              echo "::error::workspace.version 改动 $PREV → $CUR 但无 release 拍板证据 (release: 提交含 $CUR / CHANGELOG 条目)"
              exit 1
            fi
            echo "✅ workspace.version $PREV → $CUR (release authority 递进, 拍板证据: $HIT)"
          else
            echo "✅ workspace.version $CUR 不变"
          fi

      - name: "守门 3: LOCKED R11 baseline 3 值 0.8682/0.8532/0.9063 不变"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          # LOCKED 5 项之一（ADR-0001）：R11 三值为 0 装诚实锚，任何改动都必须 owner 批准。
          # 值本身是受保护常量（允许硬编码）；路径缺失按违规处理，不静默跳过。
          TARGET="legacy/donor/apeireth-asi/tests/integration_r_measure.rs"
          if [ ! -f "$TARGET" ]; then
            echo "::error::LOCKED R11 baseline 目标文件不存在: $TARGET"
            exit 1
          fi
          for VAL in 0.8682 0.8532 0.9063; do
            if ! grep -q "$VAL" "$TARGET"; then
              echo "::error::R11 baseline $VAL 在 $TARGET 缺失"
              exit 1
            fi
          done
          echo "✅ R11 baseline 3 值在 $TARGET 完整"

      - name: "守门 4: 14 键 守门 (verdict cache)"
        run: |
          # ADR-0006 正式化：现行键集 = 14 键（PHL-01..08；历史「13 键」为 PHL-07 时代口径）。
          # ADR-0011 D5：键集真源 = 契约 [locked].keys_file 指向的源码，禁在本 workflow 手抄键清单。
          TARGET=$(python3 - <<'PY'
          import tomllib
          with open("docs/architecture/contract.toml", "rb") as f:
              contract = tomllib.load(f)
          print(contract.get("locked", {}).get("keys_file", ""))
          PY
          )
          if [ -z "$TARGET" ] || [ ! -f "$TARGET" ]; then
            echo "::error::契约 [locked].keys_file 缺失或文件不存在: '$TARGET'"
            exit 1
          fi
          # 1) 编译期 hardcode 数组长度必须为 14（增删键会编译失败，是真实锁）
          LEN=$(grep -oE 'ALL_THIRTEEN_KEYS: \[PhilosophyKey; [0-9]+\]' "$TARGET" | head -1 | grep -oE '[0-9]+' | head -1)
          if [ "$LEN" != "14" ]; then
            echo "::error::键集数组长度不是 14 (实际='$LEN') in $TARGET"
            exit 1
          fi
          # 2) 编译期断言常量仍在
          if ! grep -q 'THIRTEEN_KEYS_HARDCODE' "$TARGET"; then
            echo "::error::THIRTEEN_KEYS_HARDCODE 编译期断言缺失 in $TARGET"
            exit 1
          fi
          # 3) PHL-08 键（2026-10-11 新增第 14 键）必须在场
          if ! grep -q 'PHL-08' "$TARGET"; then
            echo "::error::PHL-08 (第 14 键) 不在 $TARGET"
            exit 1
          fi
          echo "✅ 14 键 verdict 守门: 数组长度 14 + 编译期断言 + PHL-08 in $TARGET"

      - name: "守门 5: 0 触碰 V0.5 V1136 哲学守门"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          # V1136 是 apeireth-asi/src/lib.rs 里的常量名
          TARGET="legacy/donor/apeireth-asi/src/lib.rs"
          if [ ! -f "$TARGET" ]; then exit 0; fi
          HITS=$(git diff "$BASE"...HEAD -- "$TARGET" 2>/dev/null | grep -E '^\+.*V1136|^\-.*V1136' || true)
          if [ -n "$HITS" ]; then
            # 但允许新增使用, 只阻止 V0.5 移除
            if git diff "$BASE"...HEAD -- "$TARGET" 2>/dev/null | grep -E '^-.*V1136\b' | grep -v '^-.*//' > /dev/null; then
              echo "::error::V1136 哲学常量被删:"
              git diff "$BASE"...HEAD -- "$TARGET" | grep '^-.*V1136' | head -5
              exit 1
            fi
          fi
          echo "✅ V0.5 V1136 哲学守门完整"

      - name: "守门 6: companion-desktop 不污染 root workspace"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          # root Cargo.toml members 不能含 frontend/companion-desktop/src-tauri
          if grep -q 'frontend/companion-desktop' Cargo.toml; then
            echo "::error::root Cargo.toml members 包含 frontend/companion-desktop (污染)"
            exit 1
          fi
          # 若 src-tauri/Cargo.toml 改动了, 顶层 [workspace] 必须仍在
          if git diff --name-only "$BASE"...HEAD -- 'frontend/companion-desktop/src-tauri/Cargo.toml' | grep -q Cargo.toml; then
            if ! head -3 frontend/companion-desktop/src-tauri/Cargo.toml | grep -q '^\[workspace\]'; then
              echo "::error::companion-desktop/src-tauri/Cargo.toml 缺顶层 [workspace]"
              exit 1
            fi
          fi

  # === R215 防御层: Secret 扫描 (per docs/04-internal/secret-management-policy.md) ===
  # 4 层防御: pre-commit hook (本地) + CI gate (本 workflow) + GitHub Secret Scanning (平台, 主人启用) + .gitleaks.toml (gitleaks binary 装上时升级)
  # 当前用本地 PowerShell 扫描器 (gitleaks binary 因 release-assets DNS 阻塞装不上, 0 装 PASS 标注)
  # 扫描模式: scan-all (working tree) + scan-history (force-push 偷渡防御)
  secret-scan:
    name: Secret scan (R215 防御层, 高置信凭证 pattern)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan-history 需要全历史

      - name: Install PowerShell
        shell: pwsh
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: "Secret scan: working tree (scan-all)"
        shell: pwsh
        run: pwsh scripts/secret-scan.ps1 -Mode scan-all

      - name: "Secret scan: git history (scan-history, 防御 force-push 偷渡)"
        shell: pwsh
        run: pwsh scripts/secret-scan.ps1 -Mode scan-history
