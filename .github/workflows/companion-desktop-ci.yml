name: companion-desktop CI

# frontend/companion-desktop/ 是独立 pnpm workspace + 独立 [workspace] 的 Tauri 2 crate,
# 不在根 cargo workspace, 故 rust.yml / release-1.0.0.yml 不覆盖.
# 此 workflow 是 companion-desktop 唯一 CI gate, 防 Svelte 5 UI / Tauri shell 退化.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/companion-desktop/**'
      - '.github/workflows/companion-desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/companion-desktop/**'
      - '.github/workflows/companion-desktop-ci.yml'
  workflow_dispatch:

# 复用 rust.yml 的 cache group, 避免 cargo 缓存碎片化
concurrency:
  group: companion-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # =========================================================================
  # 1. Tauri shell (Rust) 编译 + 静态检查
  # =========================================================================
  tauri-shell:
    name: cargo check (Tauri shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # WebKitGTK-4.1 + librsvg + libdbus 系统库 (Tauri 2 链接)
      - name: "Install system deps (Tauri: webkit/gtk/dbus)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            curl wget file

      - name: Cache cargo (Tauri shell)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/companion-desktop/src-tauri -> target'

      - name: Prepare Tauri sidecar placeholder (Linux check)
        run: |
          mkdir -p frontend/companion-desktop/src-tauri/binaries
          touch frontend/companion-desktop/src-tauri/binaries/apeireth-x86_64-unknown-linux-gnu
          chmod +x frontend/companion-desktop/src-tauri/binaries/apeireth-x86_64-unknown-linux-gnu

      - name: cargo check (Tauri shell)
        working-directory: frontend/companion-desktop/src-tauri
        run: cargo check --workspace --all-targets

  # =========================================================================
  # 2. Svelte 5 UI 类型/语法检查 (pnpm + svelte-check)
  # =========================================================================
  svelte-ui:
    name: pnpm svelte-check (Svelte 5 UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/companion-desktop/pnpm-lock.yaml'

      - name: pnpm install
        working-directory: frontend/companion-desktop
        run: pnpm install --frozen-lockfile

      - name: pnpm check (svelte-check)
        working-directory: frontend/companion-desktop
        run: pnpm check

      # 素材许可门禁（avatar-pack-admission.md §1b）：发布物素材必须全在
      # asset-licenses.json 台账、第三方许可必须白名单内——无行即红。
      # （最小改动接入，报备：本步只读台账与素材，无其它副作用。）
      - name: pnpm check:assets (素材许可门禁)
        working-directory: frontend/companion-desktop
        run: pnpm check:assets

  # =========================================================================
  # 3. 8 硬墙守门 — 确认 companion-desktop 没有偷偷碰 LOCKED crate
  # =========================================================================
  hard-walls:
    name: 8 硬墙守门 (无 LOCKED 触碰 / version  不变)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # push: 取上一次成功的 master commit (排除自身)
            BASE=$(git rev-parse HEAD~1)
            echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: "守门: 契约 [locked] 源码 0 触碰 + R11 baseline"
        run: |
          BASE="${{ steps.base.outputs.base_sha }}"
          if [ -z "$BASE" ]; then
            echo "::warning::base_sha 空, 跳过守门"
            exit 0
          fi
          # ADR-0011 D5：LOCKED 口径唯一真源 = docs/architecture/contract.toml [locked]；
          # 禁止手抄 crate 清单（历史 24 LOCKED 口径已形式撤销，R148）。
          LOCKED_FILES=$(python3 - <<'PY'
          import tomllib
          with open("docs/architecture/contract.toml", "rb") as f:
              contract = tomllib.load(f)
          for _key, path in contract.get("locked", {}).items():
              if isinstance(path, str) and path.endswith(".rs"):
                  print(path)
          PY
          )
          if [ -z "$LOCKED_FILES" ]; then
            echo "::error::无法从 contract.toml [locked] 读取受锁源码"
            exit 1
          fi
          EXISTING=""
          for f in $LOCKED_FILES; do
            if [ -f "$f" ]; then
              EXISTING="$EXISTING $f"
            else
              echo "::error::契约登记的受锁文件不存在: $f"
              exit 1
            fi
          done
          HITS=$(git diff --name-only "$BASE"...HEAD -- $EXISTING 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::契约 [locked] 源码被触碰: $HITS"
            exit 1
          fi
          echo "✅ 0 触碰契约 [locked] 源码 ($EXISTING)"

          # R11 baseline 3 值 (per APEIRETH-CONVENTIONS §11)
          R11_FILE="legacy/donor/apeireth-asi/tests/integration_r_measure.rs"
          if [ ! -f "$R11_FILE" ]; then
            echo "::error::$R11_FILE 不存在 (R11 baseline 编译期 hardcode 必有)"
            exit 1
          fi
          R11_MISS=""
          for VAL in 0.8682 0.8532 0.9063; do
            if ! grep -q "$VAL" "$R11_FILE"; then
              R11_MISS="$R11_MISS $VAL"
            fi
          done
          if [ -n "$R11_MISS" ]; then
            echo "::error::R11 baseline 缺失: $R11_MISS"
            exit 1
          fi
          echo "✅ R11 baseline 3 值 (0.8682/0.8532/0.9063) 在 $R11_FILE 完整"

      - name: "守门: workspace.version 不变"
        run: |
          BASE="${{ steps.base.outputs.base_sha }}"
          if [ -z "$BASE" ]; then exit 0; fi
          # The workspace package version is the active release authority.
          CUR=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep -E '^version\s*=' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          EXPECTED="${APEIRETH_VERSION:-2.0.0-rc.4}"
          echo "workspace.version = $CUR"
          if [ "$CUR" != "$EXPECTED" ]; then
            echo "::error::workspace.version 改动: $CUR (期望 $EXPECTED)"
            exit 1
          fi
          echo "✅ workspace.version $EXPECTED matches release authority"

      - name: "守门: companion-desktop 是独立 workspace"
        run: |
          # companion-desktop/src-tauri/Cargo.toml 顶层必须有 [workspace],
          # 否则 会污染 root workspace (24 LOCKED crate 进 cargo test --workspace).
          if ! head -3 frontend/companion-desktop/src-tauri/Cargo.toml | grep -q '^\[workspace\]'; then
            echo "::error::companion-desktop/src-tauri/Cargo.toml 缺顶层 [workspace] (会污染 root)"
            exit 1
          fi
          # 反向检查: root Cargo.toml members 不能含 frontend/companion-desktop/src-tauri
          if grep -q 'frontend/companion-desktop' Cargo.toml; then
            echo "::error::root Cargo.toml members 包含 frontend/companion-desktop (污染)"
            exit 1
          fi
          echo "✅ companion-desktop 是独立 workspace"

  # =========================================================================
  # 4. ci-gate — 3/3 job 成功才算 green
  # =========================================================================
  ci-gate:
    name: companion-desktop CI gate (3/3)
    runs-on: ubuntu-latest
    needs: [tauri-shell, svelte-ui, hard-walls]
    if: always()
    steps:
      - name: Check all 3 jobs succeeded
        run: |
          if [[ "${{ needs.tauri-shell.result }}" != "success" ]]; then
            echo "❌ tauri-shell failed: ${{ needs.tauri-shell.result }}"
            exit 1
          fi
          if [[ "${{ needs.svelte-ui.result }}" != "success" ]]; then
            echo "❌ svelte-ui failed: ${{ needs.svelte-ui.result }}"
            exit 1
          fi
          if [[ "${{ needs.hard-walls.result }}" != "success" ]]; then
            echo "❌ hard-walls failed: ${{ needs.hard-walls.result }}"
            exit 1
          fi
          echo "================================================"
          echo "  ✅ companion-desktop CI gate: 3/3 success"
          echo "================================================"