name: rustdoc (nightly)

# R18 第 3 阶段: 对齐 wasmtime main.yml [doc] job
# https://github.com/bytecodealliance/wasmtime/blob/main/.github/workflows/main.yml
# nightly cargo doc, RUSTDOCFLAGS = "-Dwarnings" 拦截坏 doc 链接
# docs.rs 配置用 --cfg docsrs

on:
  push:
    branches: [master, main]
  pull_request:
    # ⭐ **paths 过滤**（2026-11-04 加）：CI 积压的根因是**PR 侧无过滤**
    # ⇒ ⇒ 每个 push 都触发全部 34 个 workflow（含 Kani / Miri / Coverage / OS matrix）
    # ⇒ ⇒ GitHub runner 排队 ⇒ ⇒ 积压 32 个。
    # ⇒ ⇒ 纯文档/台账改动**不触发**本 workflow（它守的是代码）
    # ⇒ ⇒ 代码 / 依赖 / 工具链 / 本 workflow 自身的改动**照跑**。
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'fuzz/**'
      - 'frontend/**/src-tauri/**'
      - 'frontend/**/package.json'
      - 'frontend/**/pnpm-lock.yaml'
      - '.github/workflows/rustdoc.yml'
    branches: ['**']

  workflow_dispatch:
permissions:
  contents: read

jobs:
  rustdoc:
    name: cargo +nightly doc -Dwarnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (for rustdoc)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # keyring/dbus/wayland/pipewire/egl 需要系统库 (--all-features 编译全链)
      - name: Bootstrap Ubuntu DNS for system dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/provision_ci_dns.py

      - name: "Install system deps (Linux: libdbus + libwayland + libpipewire + libegl)"
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libwayland-dev libpipewire-0.3-dev libspa-0.2-dev libegl1-mesa-dev libgbm-dev pkg-config
          pkg-config --exists libpipewire-0.3
          pkg-config --modversion libpipewire-0.3
          pkg-config --exists egl
          pkg-config --modversion egl

      - uses: Swatinem/rust-cache@v2

      - name: cargo +nightly doc --workspace
        env:
          RUSTDOCFLAGS: "-Dwarnings --cfg docsrs"
        run: cargo +nightly doc --workspace --no-deps --all-features

      - name: Upload doc artifacts
        uses: actions/upload-artifact@v7
        with:
          name: doc-${{ github.sha }}
          path: target/doc
          retention-days: 30
