name: M2B-XV three-OS process isolation validation

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  process-isolation:
    name: process isolation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check -p apeireth-tools-canonical --locked
        run: cargo check -p apeireth-tools-canonical --locked

      - name: cargo test -p apeireth-tools-canonical --locked
        run: cargo test -p apeireth-tools-canonical --locked

      - name: Controlled egress tests
        run: cargo test -p apeireth-tools-canonical --locked egress::tests -- --nocapture

      - name: Process isolation integration tests
        run: cargo test -p apeireth-tools-canonical --test process_executor --locked -- --nocapture

