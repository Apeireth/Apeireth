name: Miri (unsafe 检查)

# R18 第 3 阶段: 抄 wasmtime main.yml [miri] job
# https://github.com/bytecodealliance/wasmtime/blob/main/.github/workflows/main.yml
# 跑 unsafe 集中的 crate, nightly 工具链
# Apeireth 关注: apeireth-sovereignty + apeireth-core (双洋葱 + L0 HA 硬编码核心)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  miri:
    name: cargo miri (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # apeireth-sovereignty 已移除 (CI fix 2026-08): miri 下某测试死循环
          # (2026-08-18 实测: 测试逐个通过至 wasm_runtime 模块后 18 分钟零输出,
          # 20min step timeout 触发; 非慢速, 是卡死 — 待调查具体测试).
          # 与 apeireth-memory 移除 (SQLite FFI 不可执行) 同类: miri 不适合该 crate
          # 全量 --lib, 保留 apeireth-core 覆盖 unsafe 检查.
          - crate: "apeireth-core"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (for miri)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      # miri 编译 crate 依赖链 (keyring → dbus-secret-service → libdbus-sys) 需要系统库
      - name: "Install system deps (Linux: libdbus)"
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Run miri
        # CI fix 2026-08: sovereignty 卡死问题已通过移除 sovereignty 解决 (见 matrix 注释);
        # timeout 20 分钟兜底防未来再引入慢/卡 crate
        timeout-minutes: 20
        env:
          # -Zmiri-permissive-provenance: 放行指针 provenance (wasmtime 同款)
          # -Zmiri-disable-isolation: 测试用 std::time (REALTIME clock_gettime) 在 miri
          #   隔离模式不可用 (unsupported operation: clock_gettime with REALTIME)
          MIRIFLAGS: "-Zmiri-permissive-provenance -Zmiri-disable-isolation"
        run: cargo +nightly miri test -p ${{ matrix.crate }} --lib --no-fail-fast
