name: Miri (unsafe 检查)

# R18 第 3 阶段: 抄 wasmtime main.yml [miri] job
# https://github.com/bytecodealliance/wasmtime/blob/main/.github/workflows/main.yml
# 跑 unsafe 集中的 crate, nightly 工具链
# Apeireth 关注: apeireth-sovereignty + apeireth-core (双洋葱 + L0 HA 硬编码核心)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  miri:
    name: cargo miri (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 双洋葱 + L0 HA 核心
          - crate: "apeireth-sovereignty"
          - crate: "apeireth-core"
          # memory 涉及 SQLite FFI
          - crate: "apeireth-memory"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (for miri)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run miri
        env:
          MIRIFLAGS: "-Zmiri-permissive-provenance"
        run: cargo +nightly miri test -p ${{ matrix.crate }} --lib --no-fail-fast
