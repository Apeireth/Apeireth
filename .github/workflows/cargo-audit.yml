name: Cargo audit (RUSTSEC advisories)

# R61 B0 续: cargo audit 每周 + workflow_dispatch (跟 cargo-deny.yml 平行)
# 借 RustSec advisory-db 自动; install 1 次 cargo-audit 然后 cargo audit --json
#
# 结构对齐 (mirror cargo-deny.yml R19 第 0 阶段):
# - wasmtime .github/workflows/main.yml [cargo_audit] job
# - qdrant-spark 的 audit workflow
#
# 当前已知 0 vulnerabilities (R60 cargo audit 验证): cargo audit 1.1 KB 数据库, 0 vulnerabilities found.
# 仍跑 cron: 监控新 advisory 时邮件通知.
#
# 验收: 1) workflow 文件存在 + YAML 解析 OK; 2) 默认 cargo audit 0 vulns; 3) workflow_dispatch 触发 1 次跑过

on:
  push:
    # ⭐⭐⭐ 把**活跃的特性分支**列进来（2026-11-01 实测修正）。
    #
    # ## 为什么必须列（**实测**，不是推测）
    #
    # 现象：在 `ui-engine-p0-2026-10-24` 上 push ⇒ ⇒ **每次**都产生一个
    # `cargo-audit` 的 run ⇒ ⇒ `conclusion = failure` ⇒ ⇒ **但 `jobs = 0`**。
    #
    # 机制（实测确认）：
    # ① 该 workflow **在默认分支 `main` 上存在** ⇒ ⇒ GitHub 对**任何分支**的 push
    #    都会为它**创建 run**；
    # ② `push.branches` 过滤**只阻止 job 调度** ⇒ ⇒ 分支不在列表里 ⇒ ⇒ **run 里没有 job**
    #    ⇒ ⇒ **GitHub 把「无 job 的 run」判为 `failure`** ⇒ ⇒ ⇒ **每次一封红邮件**
    #    （owner 2026-10-31 报「一直发红邮件 / 空 CI 在跑」的现象）；
    # ③ ⚠️ **实测否定结果**：加否定路径 `'!crates-ui/**'` **不能**阻止它
    #    ⇒ ⇒ 只改台账（**不碰** lock / workflow）的 push **仍然**产生无 job run
    #    ⇒ ⇒ ⇒ ⇒ 路径过滤这条路**已被实测排除**。
    #
    # ⇒ ⇒ **正解**：把活跃分支**列进来** ⇒ ⇒ audit **真跑**（有 job）⇒ ⇒
    # ⇒ ⇒ run 的结论变成**真实的审计结论**（绿 ⇒ 无红邮件；红 ⇒ 是真问题）⇒ ⇒
    # ⇒ ⇒ **信息量更高**，而不是制造一个**假的失败**。
    #
    # ⚠️ 另注（**关键的机制事实**）：`push` 事件用的是**默认分支上**的 workflow 版本
    #   ⇒ ⇒ 在特性分支上改这个文件**不生效** ⇒ ⇒ ⇒ 本修复**必须进 main**。
    # ⭐⭐ **改成通配**（2026-11-04）：**任何分支**改依赖都真跑 audit。
    # 为什么不用「列活跃分支」（main 的 PR #110 那样做）：
    #   ⇒ 那种做法**每开一条新分支就要再加一次** ⇒ ⇒ 我们这条 `debt-round8`
    #      与记忆线的分支**又漏了** ⇒ ⇒ 同样的「无 job 的红邮件」会再来。
    # 与 `paths` 过滤合起来才是完整语义：
    #   **依赖没变 ⇒ 不创建 run（省资源）；依赖变了 ⇒ 一定真跑（不空跑）**。
    branches: ['**']
    # ⭐⭐ **只在依赖真的变了才跑**（2026-10-31 owner 报「一直发邮件、空 CI 在跑」时修）：
    #   实测：本 workflow 在 PR 分支同步时会生成**无 job 的失败 run**（jobs=0）
    #   ⇒ ⇒ 每次 push 都发一封红邮件 ⇒ ⇒ 而依赖没变时 RUSTSEC 结论与上次完全相同
    #   ⇒ ⇒ 跑它**没有信息量** ⇒ ⇒ 只在依赖变动时才跑。
    #   ⇒ 覆盖不丢：依赖变了照跑 + 每周 cron 仍跑 + cargo-deny 每次 PR 查 advisories。
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/cargo-audit.yml'
      # ⭐ 排除**独立 workspace**（`crates-ui/`，ADR-0015）⇒ ⇒ 主仓的 audit
      #   **根本不覆盖**它的依赖 ⇒ ⇒ 让主仓 workflow 为它触发**既无信息量、又发邮件**
      #   ⇒ ⇒ ⇒ **排除掉**（crates-ui 的依赖审计由它自己的门禁负责）。
      - '!crates-ui/**'
  pull_request:
    branches: ['**']
    # ⚠️ 同上：PR 侧也只在依赖变动时跑（RUSTSEC 覆盖由 cargo-deny 的 advisories 兜底）。
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/cargo-audit.yml'
      # ⭐ 同上：排除独立 workspace（crates-ui）⇒ ⇒ PR 侧也不产生「无 job 的失败 run」。
      - '!crates-ui/**'
  schedule:
    # 每周日凌晨 4 点 (跟 eval-live 错开 1h, 避免 GPU 竞争)
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read
  # R61: 加 security-events write (让 OSV.dev 报告 advisory match)
  security-events: write

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        # 2026-08 CI fix: crates.io 无 cargo-audit ^1.1 (最新 0.20.x), 改用 install-action 装最新
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit (json + exit code)
        # 0 vulnerabilities 期望; 有 vuln 时 fails CI
        # CI fix 2026-08: cargo-audit 0.22 默认不读项目 audit.toml (仅 ~/.cargo/audit.toml),
        # 需要 ignore 时用 --ignore 显式同步 audit.toml / deny.toml 清单 (真实漏洞 0 ignore)。
        # 2026-10-06 复核批 (交接工作包 §4.4): 原 21 条 --ignore 全部 unmatched (与
        # audit.toml 20 条 / deny.toml 10 条同样漂移), 按 0-ignore austere 模式清空,
        # 三处同步为空; 新增 ignore 须三处同步并写理由。
        # 注意: run 必须用 | 块标量 (普通标量折叠换行 → `\` 续行失效)
        # 2026-10-03 曾加 3 条 --ignore (apeireth-tui → ratatui 0.29 → paste/lru 0.12
        # transitive 未修复面)。2026-10-12 零债清偿批: ratatui 0.30 迁移落地,
        # 三条面已消 (paste 不在依赖树, lru 单一 0.18.5 修复线), --ignore 清空,
        # 与 audit.toml / deny.toml 三处同步。
        # 2026-10-18 D5 对账批: 首破 0-ignore —— 4 条 unmaintained (paste 经图像核心
        # 家族 EXR 链 / zbus 5.x 家族经 xcap → apeireth-perception), 全 transitive、
        # 0 直接业务依赖、0 known vulnerability、无安全升级路径; 三处同步 ignore。
        # 复核日 2026-10-18; 条目变 unmatched 即删。
        # 2026-11-10 依赖升级批 (rusqlite 0.32 → 0.41) 复审: 删掉 8 条已失效 ignore ——
        # zbus 5.x 三条 (RUSTSEC-2026-0370/0371/0372): 依赖树里已无 zbus;
        # quinn-proto 五条 (RUSTSEC-2026-0338..0342): 依赖树里已是 0.11.19 (已修)。
        # 两组皆 unmatched ⇒ 按本文件既有规则「条目变 unmatched 即删」处理;
        # 与 deny.toml 同批同删 (三处同步口径: deny.toml / audit.toml / 本文件 --ignore)。
        # 留档复审条件: 这两条链若再进依赖树, 因为 ignore 已删, advisory 会直接报出来。
        # 复核日 2026-11-10。
        run: |
          set +e
          cargo audit --json --deny warnings \
            --ignore RUSTSEC-2024-0436 \
            > audit-report.json
          audit_status=$?
          set -e
          echo "cargo audit 退出码: $audit_status"
          echo "AUDIT_STATUS=$audit_status" >> "$GITHUB_ENV"
          # 报告已落盘（下一步转 SARIF + 上传），**判定交给下一步** ⇒ 红灯也必带证据。
          exit 0
          # 2026-10-23 修「绿灯骗人」: 原 `|| echo ...` 把 cargo audit 的非零退出吞掉,
          # 整条 workflow 恒为绿。审计发现即应让作业失败; 报告已先落盘, 上传步骤
          # 用 if: always() 保证失败时也留证据 (见下两步)。
          #
          # 2026-10-25 修「红灯也骗人」（本 workflow 首次真红时暴露）:
          # 审计失败 ⇒ cargo audit 非零退出 ⇒ **本步直接中止** ⇒ 后续
          # 「Convert JSON report to SARIF」**根本没跑** ⇒ `audit-report.sarif`
          # 从未生成 ⇒ 「Upload SARIF to Code Scanning」报
          # `Path does not exist: audit-report.sarif` ⇒ **真实原因（哪几条 advisory）
          # 被掩盖**，只看日志会以为是上传问题。
          # 修法：**捕获退出码但不让本步失败**（报告一定落盘），
          # 由紧随其后的「审计判定」步骤**显式**按退出码判红。
          # ⇒ 红灯时必带证据，且证据里就是 advisory 明细。

      - name: 审计判定（按 cargo audit 退出码判红/绿）
        # 2026-10-25：把「判红」从 cargo audit 步骤挪到这里 ⇒
        #   ① 报告一定落盘（红灯也带证据）；
        #   ② 判红理由明确（不是「文件不存在」这种误导性报错）。
        if: always()
        run: |
          if [ "${AUDIT_STATUS:-1}" != "0" ]; then
            echo "::error::cargo audit 退出码 ${AUDIT_STATUS} —— 详见 audit-report.json / SARIF"
            python3 - <<'PYEOF'
          import json, os
          try:
              with open("audit-report.json") as f:
                  data = json.load(f)
          except Exception as error:  # 报告本身坏掉也要说清
              print(f"::error::无法读取 audit-report.json: {error}")
              raise SystemExit(1)
          # --deny warnings 同样会因 unsound / unmaintained / notice 等告警退出非零。
          findings = [("vulnerability", item) for item in ((data.get("vulnerabilities") or {}).get("list") or [])]
          for kind, items in (data.get("warnings") or {}).items():
              findings.extend((kind, item) for item in (items or []))
          print(f"::error::命中 {len(findings)} 条审计发现（漏洞与告警）:")
          for kind, item in findings:
              advisory = item.get("advisory") or {}
              package = item.get("package") or {}
              print(f"::error::  [{kind}] {advisory.get('id', '无 advisory 编号')} {package.get('name')} {package.get('version')} — {advisory.get('title', item.get('reason', kind))}")
          if not findings:
              print("::error::报告未列出审计发现；非零退出仍为失败，请检查审计命令的错误输出。")
          raise SystemExit(1)
          PYEOF
          fi
          echo "cargo audit: 0 未忽略 advisory"

      - name: Convert JSON report to SARIF (R66)
        # 语义对齐 GitHub `github/codeql-action` SARIF schema + qdrant-spark audit SARIF 转换模式.
        # 0 引新 dep; 走 python3 (GitHub Actions ubuntu-latest 默认带).
        # CI fix 2026-09: cargo-audit 0.22 的 JSON 里 vulnerabilities.found 是布尔值
        # (true/false), 漏洞条目在 vulnerabilities.list。修复前迭代 `found` 并用 `or []`
        # 兜底 —— `or []` 只兜 falsy, 兜不住 true, 所以 0 漏洞时正常、一旦真有漏洞就
        # TypeError: 'bool' object is not iterable (2026-09-23 首次真实漏洞暴露:
        # run 35835024572 步骤 "Convert JSON report to SARIF" 失败)。
        # 守门机制必须在发现漏洞或 --deny warnings 告警时工作：两类条目都导出，
        # 漏洞标 error、告警标 warning，执行成败仍以真实 AUDIT_STATUS 为准。
        # 2026-10-24 修「证据链断裂」: 审计失败时本步原本被 skip, 于是 upload-sarif 步
        # 报 `Path does not exist: audit-report.sarif` 二次失败 (PR #64 run 40058519140 实测),
        # 与 workflow 注释里「报告已先落盘, 上传步骤用 if: always() 保证失败时也留证据」相悖。
        # audit-report.json 在审计失败时同样已落盘, 故本步必须 always 跑, 让 SARIF 照常产出并上传。
        #
        # ⚠️ 2026-11-03 修「**YAML 重复键** ⇒ 整个文件被 GitHub 拒解析 ⇒ **0 job 秒红**」:
        # 本 step 之前有**两处** `if: always()`（step 名之后一处、注释块之后一处）
        # ⇒ YAML 同层重复键 ⇒ GitHub 报
        #   `Invalid workflow file: ... (Line: 162, Col: 9): 'if' is already defined`
        # ⇒ ⇒ **一个 job 都创建不出来** ⇒ run 立刻失败（不是审计失败）。
        # ⇒ 现只保留**下面注释块之后**的那一处（语义等价：同一步两行重复键本就不可能同时生效）。
        # ⇒ 溯源：这是**第三次复发**（`7146f4ad` 引入 → 两次各修一轮；
        #   `50576a88` 与 `981e9fe7` 各自加了一行 → `62f33288` 合并时位置不同 ⇒ git 看不见冲突 ⇒ 又生出重复键）
        # ⇒ ⇒ 已加**严格 YAML 重复键门禁**（`scripts/check_yaml_duplicate_keys.py`）防复发。
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          with open("audit-report.json") as f:
              report = json.load(f)
          findings = []
          vuln_index = {}
          vulns = report.get("vulnerabilities") or {}
          entries = [("vulnerability", item) for item in (vulns.get("list") or [])]
          for kind, items in (report.get("warnings") or {}).items():
              entries.extend((kind, item) for item in (items or []))
          for kind, v in entries:
              advisory = v.get("advisory") or {}
              aid = advisory.get("id")
              pkg = v.get("package") or {}
              pkg_name = pkg.get("name", "unknown")
              pkg_version = pkg.get("version", "unknown")
              rule_id = f"rustsec/{aid}" if aid else f"cargo-audit/{kind}"
              level = "error" if kind == "vulnerability" else "warning"
              vuln_index[rule_id] = {"package": pkg_name, "version": pkg_version, "level": level, "advisory": aid}
              findings.append({
                  "ruleId": rule_id,
                  "level": level,
                  "message": {"text": f"{pkg_name}@{pkg_version}: {advisory.get('description') or advisory.get('title') or v.get('reason') or kind}"},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": f"Cargo.toml"},
                          "region": {"startLine": 1, "startColumn": 1, "endLine": 1, "endColumn": 1}
                      }
                  }]
              })
          sarif = {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "cargo-audit",
                          "version": "1.1.x",
                          "informationUri": "https://github.com/rustsec/rustsec",
                          "rules": [
                              {
                                  "id": rid,
                                  "name": rid,
                                  "shortDescription": {"text": f"RUSTSEC advisory affecting {meta['package']}@{meta['version']}"},
                                  "fullDescription": {"text": f"RUSTSEC advisory affecting {meta['package']}@{meta['version']}"},
                                  "defaultConfiguration": {"level": meta['level']},
                                  "helpUri": f"https://rustsec.org/advisories/{meta['advisory']}" if meta['advisory'] else "https://github.com/rustsec/rustsec"
                              }
                              for rid, meta in vuln_index.items()
                          ]
                      }
                  },
                  "results": findings,
                  "invocations": [{
                      "executionSuccessful": os.environ.get("AUDIT_STATUS", "1") == "0",
                      "endTimeUtc": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
                  }]
              }]
          }
          with open("audit-report.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          PYEOF

      - name: Upload audit report (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-report
          path: |
            audit-report.json
            audit-report.sarif

      - name: Upload SARIF to Code Scanning (R66)
        if: always()
        # 2026-10-03: v3 已 EOL (GitHub 强制退役旧主版), 升 v4 —— 否则本步必败
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: audit-report.sarif
          category: cargo-audit
