name: Cargo audit (RUSTSEC advisories)

# R61 B0 续: cargo audit 每周 + workflow_dispatch (跟 cargo-deny.yml 平行)
# 借 RustSec advisory-db 自动; install 1 次 cargo-audit 然后 cargo audit --json
#
# 结构对齐 (mirror cargo-deny.yml R19 第 0 阶段):
# - wasmtime .github/workflows/main.yml [cargo_audit] job
# - qdrant-spark 的 audit workflow
#
# 当前已知 0 vulnerabilities (R60 cargo audit 验证): cargo audit 1.1 KB 数据库, 0 vulnerabilities found.
# 仍跑 cron: 监控新 advisory 时邮件通知.
#
# 验收: 1) workflow 文件存在 + YAML 解析 OK; 2) 默认 cargo audit 0 vulns; 3) workflow_dispatch 触发 1 次跑过

on:
  push:
    # ⭐⭐⭐ **把活跃的特性分支列进来**（2026-11-01 实测修正）。
    #
    # ## 为什么必须列（**实测**，不是推测）
    #
    # 现象：在 `ui-engine-p0-2026-10-24` 上 push ⇒ ⇒ **每次**都产生一个
    # `cargo-audit` 的 run ⇒ ⇒ `conclusion = failure` ⇒ ⇒ **但 `jobs = 0`**。
    #
    # 机制（实测确认）：
    # ① 该 workflow **在默认分支 `main` 上存在** ⇒ ⇒ GitHub 对**任何分支**的 push
    #    都会为它**创建 run**；
    # ② `push.branches` 过滤**只阻止 job 调度** ⇒ ⇒ 分支不在列表里 ⇒ ⇒ **run 里没有 job**
    #    ⇒ ⇒ **GitHub 把「无 job 的 run」判为 `failure`** ⇒ ⇒ ⇒ **每次一封红邮件**；
    # ③ ⚠️ **实测**：加否定路径 `'!crates-ui/**'`（2026-11-01 曾试）**不能**阻止它
    #    ⇒ ⇒ 第 2 次 push（只改台账，**不碰** lock / workflow）**仍然**产生无 job run。
    #    ⇒ ⇒ ⚠️ **2026-11-06 改名**：引擎线远端分支**新增 `ui-engine`**（旧名
    #    ⇒ ⇒ `ui-engine-p0-2026-10-24` 冻结在 `b72ac26e`，不再推）
    #    ⇒ ⇒ ⇒ ⇒ ⇒ 两个名字**都要列进来** ⇒ ⇒ 否则新分支 push ⇒ ⇒ **产生无 job 假失败**
    #    ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ （机制见台账 **E-150**：无 job 的 run 被 GitHub 判 failure ⇒ ⇒ 发红邮件）。
    #
    # ⇒ ⇒ **正解**：把活跃分支**列进来** ⇒ ⇒ audit **真跑**（有 job）⇒ ⇒
    # ⇒ ⇒ run 的结论变成**真实的审计结论**（绿 ⇒ 无红邮件；红 ⇒ 是真问题）⇒ ⇒
    # ⇒ ⇒ **信息量更高**，而不是「制造一个假的失败」。
    branches: [master, main, feature/cognitive-infrastructure-vnext, feature/memory-v2.2-production-completion, ui-engine, ui-engine-p0-2026-10-24]
    # ⭐⭐ **只在依赖真的变了才跑**（2026-10-31 owner 报「一直发邮件」时修）：
    #   依赖没变 ⇒ 不跑（**GitHub 连 run 都不创建** ⇒ 不会有红邮件）；
    #   依赖变了 ⇒ 照跑。每周 cron 与 workflow_dispatch 仍会跑 ⇒ 新 advisory 仍会被发现。
    #
    # ⚠️⚠️⚠️ **2026-11-06 真根因更正（台账 E-190 已更正自身）**：
    #   本文件曾长期**无法被 GitHub 解析** ⇒ ⇒ 每次 push 都产生一个
    #   **「加载不到 workflow 定义」的空 run**（特征：`run.name` = 文件路径而非
    #   `name:` 字段、`created_at == updated_at`、**`jobs = 0`**、`conclusion = failure`）
    #   ⇒ ⇒ **每次 push 一封红邮件**。
    #
    #   ⇒ ⇒ **真根因**：两个 step **各有重复的 `if: always()` 键**
    #   ⇒ ⇒ ⇒ ⇒ GitHub 报 `failed to parse workflow: 'if' is already defined`
    #   ⇒ ⇒ ⇒ ⇒ 而本地 PyYAML **只取最后一个**（不报错）⇒ ⇒ **本地校验全绿、CI 全红**。
    #   ⇒ ⇒ ⇒ ⇒ ⇒ **教训：YAML 校验通过 ≠ GitHub 能解析**（重复键必须查）。
    #
    #   ⇒ ⇒ ⚠️ **顺带更正 E-150**：它把「无 job 假失败」归因于 `push.branches` 未列分支
    #   ⇒ ⇒ ⇒ 但**列进来之后仍 0 job**（2026-11-06 实测 9 个 run 全 0 job）
    #   ⇒ ⇒ ⇒ ⇒ 因为它根本不是过滤问题 ⇒ ⇒ **是文件解析失败**。
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/cargo-audit.yml'
      # ⭐ 排除独立 workspace（`crates-ui/`，ADR-0015）⇒ 它的依赖审计由自己的门禁负责。
      # ⚠️ 诚实口径：`crates-ui/` 的 RUSTSEC 覆盖**不在**本 workflow（E-148 已登记）。
      - '!crates-ui/**'
  pull_request:
    branches: ['**']
    # ⚠️ 同上：PR 侧也只在依赖变动时跑（RUSTSEC 覆盖由 cargo-deny 的 advisories 检查兜底）。
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/cargo-audit.yml'
      - '!crates-ui/**'
  schedule:
    # 每周日凌晨 4 点 (跟 eval-live 错开 1h, 避免 GPU 竞争)
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read
  # R61: 加 security-events write (让 OSV.dev 报告 advisory match)
  security-events: write

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        # 2026-08 CI fix: crates.io 无 cargo-audit ^1.1 (最新 0.20.x), 改用 install-action 装最新
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit (json + exit code)
        # 0 vulnerabilities 期望; 有 vuln 时 fails CI
        # CI fix 2026-08: cargo-audit 0.22 默认不读项目 audit.toml (仅 ~/.cargo/audit.toml),
        # 需要 ignore 时用 --ignore 显式同步 audit.toml / deny.toml 清单 (真实漏洞 0 ignore)。
        # 2026-10-06 复核批 (交接工作包 §4.4): 原 21 条 --ignore 全部 unmatched (与
        # audit.toml 20 条 / deny.toml 10 条同样漂移), 按 0-ignore austere 模式清空,
        # 三处同步为空; 新增 ignore 须三处同步并写理由。
        # 注意: run 必须用 | 块标量 (普通标量折叠换行 → `\` 续行失效)
        # 2026-10-03 曾加 3 条 --ignore (apeireth-tui → ratatui 0.29 → paste/lru 0.12
        # transitive 未修复面)。2026-10-12 零债清偿批: ratatui 0.30 迁移落地,
        # 三条面已消 (paste 不在依赖树, lru 单一 0.18.5 修复线), --ignore 清空,
        # 与 audit.toml / deny.toml 三处同步。
        # 2026-10-18 D5 对账批: 首破 0-ignore —— 4 条 unmaintained (paste 经图像核心
        # 家族 EXR 链 / zbus 5.x 家族经 xcap → apeireth-perception), 全 transitive、
        # 0 直接业务依赖、0 known vulnerability、无安全升级路径; 三处同步 ignore。
        # 复核日 2026-10-18; 条目变 unmatched 即删。
        run: |
          cargo audit --json --deny warnings \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372 \
            > audit-report.json
          # 2026-10-23 修「绿灯骗人」: 原 `|| echo ...` 把 cargo audit 的非零退出吞掉,
          # 整条 workflow 恒为绿。审计发现即应让作业失败; 报告已先落盘, 上传步骤
          # 用 if: always() 保证失败时也留证据 (见下两步)。

      - name: Convert JSON report to SARIF (R66)
        # 语义对齐 GitHub `github/codeql-action` SARIF schema + qdrant-spark audit SARIF 转换模式.
        # 0 引新 dep; 走 python3 (GitHub Actions ubuntu-latest 默认带).
        # CI fix 2026-09: cargo-audit 0.22 的 JSON 里 vulnerabilities.found 是布尔值
        # (true/false), 漏洞条目在 vulnerabilities.list。修复前迭代 `found` 并用 `or []`
        # 兜底 —— `or []` 只兜 falsy, 兜不住 true, 所以 0 漏洞时正常、一旦真有漏洞就
        # TypeError: 'bool' object is not iterable (2026-09-23 首次真实漏洞暴露:
        # run 35835024572 步骤 "Convert JSON report to SARIF" 失败)。
        # 守门机制必须能在"发现漏洞"这一时刻工作, 故改为迭代 list; severity 缺省/为
        # null 时按 1 (warning) 处理, 不因缺字段崩。
        run: |
          python3 - <<'PYEOF'
          import json, sys, datetime, hashlib
          with open("audit-report.json") as f:
              report = json.load(f)
          findings = []
          vuln_index = {}
          vulns = report.get("vulnerabilities") or {}
          for v in (vulns.get("list") or []):
              advisory = v.get("advisory", {})
              aid = advisory.get("id", "UNKNOWN")
              pkg = v.get("package", {})
              pkg_name = pkg.get("name", "unknown")
              pkg_version = pkg.get("version", "unknown")
              rule_id = f"rustsec/{aid}"
              vuln_index[rule_id] = {"package": pkg_name, "version": pkg_version}
              findings.append({
                  "ruleId": rule_id,
                  "level": "error" if (advisory.get("severity") or 1) >= 5 else "warning",
                  "message": {"text": advisory.get("description", advisory.get("title", aid))},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": f"Cargo.toml"},
                          "region": {"startLine": 1, "startColumn": 1, "endLine": 1, "endColumn": 1}
                      }
                  }]
              })
          sarif = {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "cargo-audit",
                          "version": "1.1.x",
                          "informationUri": "https://github.com/rustsec/rustsec",
                          "rules": [
                              {
                                  "id": rid,
                                  "name": rid,
                                  "shortDescription": {"text": f"RUSTSEC advisory affecting {meta['package']}@{meta['version']}"},
                                  "fullDescription": {"text": f"RUSTSEC advisory affecting {meta['package']}@{meta['version']}"},
                                  "defaultConfiguration": {"level": "error"},
                                  "helpUri": f"https://rustsec.org/advisories/{rid.replace('rustsec/', '')}"
                              }
                              for rid, meta in vuln_index.items()
                          ]
                      }
                  },
                  "results": findings,
                  "invocations": [{
                      "executionSuccessful": report.get("vulnerabilities", {}).get("count", 0) == 0,
                      "endTimeUtc": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
                  }]
              }]
          }
          with open("audit-report.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          PYEOF

      - name: Upload audit report (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-report
          path: |
            audit-report.json
            audit-report.sarif

      - name: Upload SARIF to Code Scanning (R66)
        if: always()
        # 2026-10-03: v3 已 EOL (GitHub 强制退役旧主版), 升 v4 —— 否则本步必败
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: audit-report.sarif
          category: cargo-audit
