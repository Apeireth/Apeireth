name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Apeireth ${{ github.ref_name }} — AGI Operating System & Cognitive Microkernel"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'preview') }}
          body: |
            ## 🌟 Apeireth 2.0+ Cognitive Microkernel & AGI Operating System

            > **Pure Safe Rust (`#![deny(unsafe_code)]` / `#![forbid(unsafe_code)]`), 16 Microkernel Crates, 2012+ Verified Tests.**

            ---

            ### 🚀 Key Highlights & Architectural Innovations

            1. **Continuous Topological Memory Manifold (类脑连续流体拓扑记忆)**:
               - TagMemo V10 continuous field, Vietoris-Rips $\beta_1$ hole curiosity gradient, Kuramoto non-linear phase locking, and MGS orthogonal residual pyramid.
            2. **Cognitive Quota Preemptive Microkernel (多维认知配额抢占式调度器)**:
               - 5-level priority queue with multidimensional quota $\mathcal{Q}=\langle \text{Token}, \text{Step}, \text{Cost}, \text{Depth} \rangle$ & Priority Inheritance Protocol (PIP).
            3. **Causal World Model Sandbox (因果世界模型与 SAGA 逆向补偿)**:
               - Copy-On-Write (CoW) hypothesis branching with sub-35µs SAGA LIFO compensating reverse stack rollback.
            4. **Micro-Luminescent Ember HUD (微光在场感知与主动关怀)**:
               - 4.0s physiological breathing aura ($I(t)=I_0+A\sin^3(2\pi t/4)$), Kelvin Planckian blackbody shader synthesis & continuous Care Potential Field differential equations.
            5. **Triple-Onion Zero-Trust Sandbox (零信任三洋葱物理沙箱)**:
               - Windows JobObject / Linux cgroups physical containment + Git Worktree isolation + OWASP ASI-01 guardrails.
            6. **Lineage Spawning Protocol (跨代教养与物种分化协议)**:
               - Ed25519 constant-time epigenetic inheritance through Shadowing $\to$ DualCoSign $\to$ Emancipation.
            7. **Portable USB Flash-Drive Agent & P2P Mesh (随身 U 盘生命体与去中心化漫游)**:
               - Zero-dependency single-binary flash drive launcher with relative `./data/` isolation & Noise_XX encrypted BLE/LAN memory roaming.

            ---

