name: ui-engine CI

# crates-ui/ 是**独立 cargo workspace**（自有 [workspace] 表），不在根 cargo workspace，
# 故 rust.yml / release-1.0.0.yml 不覆盖它。
# 此 workflow 是 crates-ui/ 唯一 CI gate，防自研响应式 + DOM 绑定引擎退化。
#
# 决策真源：docs/adr/0015-pure-rust-ui-engine.md（Accepted, 2026-10-24）
#           + docs/architecture/contract.toml [[workspace.independent_workspaces]]
#             id = "ui_engine"（ci = ".github/workflows/ui-engine-ci.yml"）
#
# 独立门禁的代价（诚实登记）：引擎不进主 workspace ⇒ 主 arch_guard 不扫它
# ⇒ 失去主门禁保护 ⇒ 这里必须自带四关（check / clippy / fmt / test）。
# 先例：.github/workflows/companion-desktop-ci.yml（独立 workspace 独立门禁）。

on:
  push:
    branches: [main]
    paths:
      - 'crates-ui/**'
      - '.github/workflows/ui-engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates-ui/**'
      - '.github/workflows/ui-engine-ci.yml'
  workflow_dispatch:

# 复用 rust.yml 的 cache group, 避免 cargo 缓存碎片化
concurrency:
  group: ui-engine-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # =========================================================================
  # 1. 编译门禁 — crates-ui/ 全 workspace 全 target
  # =========================================================================
  check:
    name: cargo check (crates-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        # crates-ui/ 是独立 workspace：所有 cargo 命令必须在它自己的目录里跑,
        # 不能落到根 workspace（根 members 不含 crates-ui）.
        working-directory: crates-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (crates-ui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates-ui -> target'

      # 守门: crates-ui 必须是独立 workspace（顶层有 [workspace] 表），
      # 且根 Cargo.toml 的 members 不得含 crates-ui —— 否则会污染主依赖图,
      # 主 arch_guard 的层规则 / 尺寸棘轮会立刻对「活代码」生效（ADR-0015 §3.2）。
      - name: "守门: crates-ui 是独立 workspace"
        run: |
          # ⚠️ 本 job 的 `working-directory` **已经是 `crates-ui`** ⇒ 这里的路径
          # 必须相对 crates-ui 写（初版写成 `crates-ui/Cargo.toml` ⇒ 在 runner 上
          # 路径不存在 ⇒ 守门误报失败。2026-10-24 PR #78 首次运行实测）。
          if ! head -80 Cargo.toml | grep -q '^\[workspace\]'; then
            echo "::error::crates-ui/Cargo.toml 缺顶层 [workspace] (会污染 root)"
            exit 1
          fi
          # ⚠️ 根 Cargo.toml 在 crates-ui 的**上一级**（`../Cargo.toml`）。
          # 初版写成 `../../Cargo.toml` ⇒ 文件不存在 ⇒ grep 退出非 0 ⇒
          # **守门静默通过（假绿）** —— 比误报更坏。⇒ 先断言文件存在再查。
          if [ ! -f ../Cargo.toml ]; then
            echo "::error::找不到根 Cargo.toml（守门路径写错 ⇒ 会假绿）"
            exit 1
          fi
          if grep -q 'crates-ui' ../Cargo.toml; then
            echo "::error::root Cargo.toml 提及 crates-ui (污染主 workspace)"
            exit 1
          fi
          echo "✅ crates-ui 是独立 workspace"

      - name: cargo check (crates-ui)
        run: cargo check --workspace --all-targets --locked

  # =========================================================================
  # 2. Clippy 门禁 — 零警告（-D warnings）
  # =========================================================================
  clippy:
    name: cargo clippy -D warnings (crates-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (crates-ui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates-ui -> target'

      - name: cargo clippy (crates-ui)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # =========================================================================
  # 3. 格式门禁 — rustfmt 零 diff
  # =========================================================================
  fmt:
    name: cargo fmt --check (crates-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo fmt --check (crates-ui)
        run: cargo fmt --all -- --check

  # =========================================================================
  # 4. 测试门禁 — 全 workspace 测试绿（native 跑, 不需浏览器 / wasm target）
  # =========================================================================
  test:
    name: cargo test (crates-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (crates-ui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates-ui -> target'

      # ui-core 是纯逻辑层（0 依赖 web-sys）⇒ native 直接跑;
      # ui-dom 自带内存 DOM 后端 ⇒ 差分 / 委托 / 绑定逻辑同样 native 可测
      # （这是「组件 = Rust 函数 ⇒ 断言钉行为而非源码文本」的结构性前提）。
      - name: cargo test (crates-ui)
        run: cargo test --workspace --locked

      # ── 规则层差分装置的**真源校验** ─────────────────────────────────
      # `cargo test` 会比对「Rust 实现 ↔ cases.json 的 expected」⇒ 但若有人
      # **同时**改 Rust 与 expected ⇒ 测试会绿 ⇒ ⇒ 真源是否仍等于**生产 TS 的
      # 实算结果**只有 `--check` 知道 ⇒ ⇒ 这一步才是「漂移不会被静默吞掉」的
      # 完整闭环（2026-10-25 补）。
      #
      # ⚠️ 需要 Node ≥ 22（`--experimental-strip-types` 才能直接 import 生产的 `.ts`）。
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 规则装置真源校验（expected == 生产 TS 实算）
        working-directory: crates-ui
        run: |
          node --experimental-strip-types \
            apeireth-ui-demo/harness/rules/gen_expected.mjs --check

      # ── 引擎边界守卫：三件套 0 shader + 组件不自算时区 ─────────────────
      # ⇒ ⇒ 把 ADR-0015 §2.1 / ADR-0017 的边界从**文档**变成**会红的门禁**。
      - name: 引擎边界守卫（三件套 0 shader + 组件不自算时区）
        run: python3 apeireth-ui-demo/harness/scripts/check_ui_boundaries.py

      # ── 架构断言：状态对象不得自建 `Runtime` ───────────────────────────
      # 自建 ⇒ 状态与渲染**分属两个 runtime** ⇒ effect 不依赖它的信号
      # ⇒ ⇒ 改状态不重渲染 ⇒ ⇒ 实测表现为「幽灵输入」（用户输入进不了引擎状态）。
      # 该缺陷在类型层面完全合法 ⇒ ⇒ 编译器不可能发现 ⇒ ⇒ 只能靠显式断言。
      - name: 架构断言（状态对象不得自建 Runtime）
        run: python3 apeireth-ui-demo/harness/scripts/check_runtime_ownership.py

      # P1 验收门「依赖面」机械判据：ui-core 的 [dependencies] 段不得含
      # web-sys / wasm-bindgen —— 这是 ui-core「永远能 native 单测」的**唯一**保证
      # （ADR-0015 §4 P1 验收门 / 计划书 §3.2）。
      #
      # ⚠️ 判据必须精确到 [dependencies] 段，**不能整文件 grep**：Cargo.toml 顶部的
      # 说明注释里会出现「0 依赖 web-sys」这类字样，整文件 grep 会误判（实测：整文件
      # 命中 1 处为注释文字，[dependencies] 段真依赖 0）。故用 cargo metadata 取
      # **真实依赖图**判定，而不是文本匹配。
      - name: "守门: ui-core 依赖面 0 web-sys/wasm-bindgen"
        run: |
          cargo metadata --no-deps --format-version 1 > /tmp/ui-metadata.json
          python3 - <<'PY'
          import json, sys
          meta = json.load(open("/tmp/ui-metadata.json"))
          bad = []
          for pkg in meta["packages"]:
              if pkg["name"] != "apeireth-ui-core":
                  continue
              for dep in pkg.get("dependencies", []):
                  if dep.get("path"):
                      continue  # workspace 内部 path 依赖，不算外部
                  name = dep.get("name", "")
                  if name in ("web-sys", "wasm-bindgen", "wasm-bindgen-futures", "js-sys"):
                      bad.append(name)
          if bad:
              print(f"::error::apeireth-ui-core 不得依赖 {sorted(set(bad))} —— "
                    "它必须保持 0 外部依赖才能 native 单测（ADR-0015 §4 P1 验收门）")
              sys.exit(1)
          print("✅ apeireth-ui-core 依赖面 0 web-sys/wasm-bindgen（可 native 单测）")
          PY

  # =========================================================================
  # 5. wasm 构建门禁 — 引擎真正运行的目标
  # =========================================================================
  wasm:
    name: cargo build --target wasm32-unknown-unknown (crates-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ 必须显式加 wasm32 target：runner 的默认 toolchain 不含它，
      # 而 dtolnay/rust-toolchain@stable 只装 default host target。
      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ⚠️ **不信任 action 的 `targets:`**：2026-10-24 PR #78 首次运行实测 ——
      # 该 action 报 `outcome=success`、rustc 1.99.1 就位，但 **wasm32 target
      # 实际没装上** ⇒ 随后的构建报 `error[E0463]: can't find crate for core`
      # （note 明写「the wasm32-unknown-unknown target may not be installed」）。
      # ⇒ 这里**显式安装 + 机械断言**：装不上就当场红，而不是让后面的构建报一个
      # 与真因无关的错（E0463 看着像编译问题，实为环境问题）。
      - name: 确保 wasm32 target 就位（显式安装 + 断言）
        run: |
          rustup target add wasm32-unknown-unknown
          if ! rustup target list --installed | grep -q '^wasm32-unknown-unknown'; then
            echo "::error::wasm32-unknown-unknown target 未装上（构建会报 E0463）"
            exit 1
          fi

      - name: Cache cargo (crates-ui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates-ui -> target'

      # 引擎的**真实运行目标**是 wasm32（Tauri WebView 里跑）。native 的四道门禁
      # 只证明纯逻辑层正确 —— wasm 目标下的编译（web-sys 后端、wasm-bindgen 胶水
      # 绑定、cfg(target_arch = "wasm32") 分支）**只在这里被验证**。
      #
      # 诚实边界: 本门禁只证明「wasm 目标编译通过」，**不证明画面正确**
      # （浏览器 job 待建，见 ADR-0015 §2.6 与计划书 §5 R9）。
      - name: cargo build --target wasm32-unknown-unknown
        run: cargo build --workspace --target wasm32-unknown-unknown --release --locked

      # 产物体积登记（不阻塞，只打印）：wasm 体积是发版口径的一部分，
      # 超出预算时须回头看依赖面（与 ui-core 依赖面守门同一思路）。
      - name: 产物体积（报告用）
        run: |
          echo "wasm 产物体积："
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' \
            -printf '  %f  %s bytes\n' 2>/dev/null || echo "  （本批无 .wasm 产物）"

  # =========================================================================
  # 6. 依赖治理门禁 — 4 类 check 全绿（bans / licenses / sources / advisories）
  # =========================================================================
  # crates-ui 是独立 workspace ⇒ 主仓的 cargo-deny.yml **只扫主 workspace**
  # ⇒ 本 workspace 的依赖树在本 job 里被覆盖。
  #
  # P5 批首次引入外部依赖（wgpu / naga / web-sys / js-sys / wasm-bindgen-futures）
  # ⇒ 许可白名单与多版本 skip 随之扩到 6 条许可 + 1 条 skip（见 crates-ui/deny.toml）。
  cargo_deny:
    name: cargo deny check (crates-ui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (crates-ui)
        # ⚠️ 初版写 `Swatinem/cargo-cache@v1` ⇒ **该 action 仓库不存在**
        # （实测报错「Unable to resolve action swatinem/cargo-cache, repository not found」）。
        # 正确名是 `rust-cache`（与本 workflow 其余 job 一致）。
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates-ui -> target'

      # 与主仓 cargo-deny.yml 同源（wasmtime 模式）：4 类 check 全跑。
      - name: Run cargo deny check (全部 4 类)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  # =========================================================================
  # 6. 对照门禁 — 浏览器内像素对照 + 逐帧对照 + DOM 全等 + JSON 差分
  #    （P3 试点验收门 + 工具卡面批验收门）
  # =========================================================================
  pilot-compare:
    name: 对照（试点 + 工具卡面：像素 ≤1% + 逐帧 + DOM 全等 + JSON 差分）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates-ui/apeireth-ui-demo/harness
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ⚠️ **不信任 action 的 `targets:`**：2026-10-24 PR #78 首次运行实测 ——
      # 该 action 报 `outcome=success`、rustc 1.99.1 就位，但 **wasm32 target
      # 实际没装上** ⇒ 随后的构建报 `error[E0463]: can't find crate for core`
      # （note 明写「the wasm32-unknown-unknown target may not be installed」）。
      # ⇒ 这里**显式安装 + 机械断言**：装不上就当场红，而不是让后面的构建报一个
      # 与真因无关的错（E0463 看着像编译问题，实为环境问题）。
      - name: 确保 wasm32 target 就位（显式安装 + 断言）
        run: |
          rustup target add wasm32-unknown-unknown
          if ! rustup target list --installed | grep -q '^wasm32-unknown-unknown'; then
            echo "::error::wasm32-unknown-unknown target 未装上（构建会报 E0463）"
            exit 1
          fi

      - name: Cache cargo (crates-ui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates-ui -> target'

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 生产前端的依赖：**只读引用**（参考侧要编译生产组件 ⇒ 需要它的
      # svelte / lucide-svelte）。装在它自己的目录里，不改它的任何文件。
      - name: 安装生产前端依赖（只读引用）
        working-directory: frontend/companion-desktop
        run: pnpm install --frozen-lockfile

      # ⚠️ harness **不单独装依赖**：它没有 lockfile（仓内纪律：harness 自带
      # `[workspace]`，不进依赖图），而且生产组件的源码导入（`svelte` /
      # `lucide-svelte`）解析自**生产前端的** node_modules ⇒ 这里**符号链接**过去
      # （与本地形态一致）。初版在这里 `pnpm install --no-frozen-lockfile` ⇒
      # 2026-10-24 PR #78 首次运行实测报 `ERR_PNPM_IGNORED_BUILDS` 退 1
      # （pnpm 12 对「被忽略的构建脚本」直接失败）⇒ 依赖压根没装上。
      - name: 试点 harness 复用生产前端依赖（符号链接）
        run: |
          ln -sfn "$PWD/../../../frontend/companion-desktop/node_modules" node_modules
          if [ ! -e node_modules/vite ]; then
            echo "::error::harness 的 node_modules 链接未生效（vite 不可见）"
            exit 1
          fi

      # wasm-bindgen CLI（版本与 crates-ui 的 wasm-bindgen **精确一致**）。
      - name: 安装 wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: 安装 Python 依赖（CDP 驱动 + 像素差分）
        run: python3 -m pip install --quiet websocket-client pillow

      # 对照 harness 的完整流水线：抽取单一真源资产 ⇒ 构建 wasm ⇒ wasm-bindgen
      # ⇒ vite build ⇒ 像素 / 逐帧对照。
      # ⚠️ CHROME 可覆盖（runner 上的浏览器路径与本机不同）。
      - name: 跑对照（试点 + 工具卡面：像素 + 逐帧 + DOM 全等 + JSON 差分）
        env:
          CHROME: ${{ env.CHROME_PATH }}
        run: |
          export CHROME="${CHROME_PATH:-$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser)}"
          bash build.sh

      - name: 上传对照证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-engine-compare-evidence
          path: |
            crates-ui/apeireth-ui-demo/harness/out/
            crates-ui/apeireth-ui-demo/harness/evidence/

  # =========================================================================
  # 7. 生产对照门禁 —— 引擎画面 vs 生产版场景画面（逐像素）
  # =========================================================================
  # 判据：生产版场景类（**只读引入**）在真实浏览器里跑出的画面，与 Rust 引擎用
  # **同一批 uniform 取值**画出的画面逐像素一致（差分阈值：任一通道绝对差
  # > 2/255 记「不同」；本地实测两个后端各 **0 / 576,000** 像素不同）。
  #
  # **本门禁是阻塞的**（2026-10-24 主代理裁决，修订了初稿的
  # `continue-on-error: true`）。理由：初稿那样写，本 job 就成了**装饰性门禁**
  # —— 一个从不失败的 job 等于没有门禁，而后来者会误以为「CI 在查这件事」。
  # ⇒ 改为：**WebGL 腿必过**（它只需 WebGL2，不需任何特殊能力；同仓
  # pilot-compare job 已证该栈在 runner 上可用）；**WebGPU 腿按宿主能力**：
  # runner 提供了软件 WebGPU 适配器 ⇒ 该腿**也必过**；没提供 ⇒ 该腿
  # **不可验证**（报告里显式标注 `webgpu_comparison_verifiable: false`
  # + 一句说明，**不是**「通过」也不是「失败」），判定退到 WebGL 腿。
  # ⇒ 门禁在**它能验的范围内**是真门禁，在**验不了的范围内**是显式声明。
  #
  # ⚠️ 本 job **未在 CI runner 上实测过**（首次执行可能暴露 runner 镜像差异）。
  # 那时它会**红**，而红是真信号（要么环境缺能力、要么真有差异）——
  # 与其让它默默常绿，不如让它说话。**证据本体**是
  # `crates-ui/evidence/p5-b/evidence/` 里已入库的那次本地实测
  # （Chromium 154 + SwiftShader 软件适配器，2026-10-24，两腿全验 0 差异）。
  production-compare:
    name: 生产对照（生产侧 vs 引擎侧，逐像素）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates-ui/evidence/p5-b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ⚠️ **不信任 action 的 `targets:`**：2026-10-24 PR #78 首次运行实测 ——
      # 该 action 报 `outcome=success`、rustc 1.99.1 就位，但 **wasm32 target
      # 实际没装上** ⇒ 随后的构建报 `error[E0463]: can't find crate for core`
      # （note 明写「the wasm32-unknown-unknown target may not be installed」）。
      # ⇒ 这里**显式安装 + 机械断言**：装不上就当场红，而不是让后面的构建报一个
      # 与真因无关的错（E0463 看着像编译问题，实为环境问题）。
      - name: 确保 wasm32 target 就位（显式安装 + 断言）
        run: |
          rustup target add wasm32-unknown-unknown
          if ! rustup target list --installed | grep -q '^wasm32-unknown-unknown'; then
            echo "::error::wasm32-unknown-unknown target 未装上（构建会报 E0463）"
            exit 1
          fi

      - name: Cache cargo (crates-ui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates-ui -> target'

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 生产前端的依赖：**只读引用**（参考页要 import 生产场景源 ⇒ 需要它的
      # vite）。装在它自己的目录里，不改它的任何文件。
      - name: 安装生产前端依赖（只读引用）
        working-directory: frontend/companion-desktop
        run: pnpm install --frozen-lockfile

      # harness **不单独装依赖**（无 lockfile + 生产源码导入解析自前端 node_modules）
      # ⇒ 符号链接过去（与 pilot-compare 同一理由，见该 job 的注释）。
      - name: 生产对照 harness 复用生产前端依赖（符号链接）
        run: |
          # ⚠️ **本 job 的 working-directory 是 `crates-ui/evidence/p5-b`（3 级）**
          # ⇒ 上跳到仓库根是 **`../../../`**，不是 `../../../../`。
          # 初版写成 4 级 ⇒ 链接指向**仓库外** ⇒ `node_modules/vite` 不可见
          # ⇒ 该 job 在 runner 上红（2026-10-25 实测，run 40107215483 第 9 步）。
          # ⇒ 教训：**相对路径的层数必须对着 working-directory 数**，
          #   同一份工作流里 `pilot-compare`（4 级目录）用 `../../../` 是对的，本 job 不同。
          # ⚠️ **链接要建在 `web/node_modules`**（`build.sh` 第 3 步要的就是它）
          # ⇒ 早前版本建在 `p5-b/node_modules` ⇒ **vite 根本不看那个**
          # ⇒ 断言「vite 不可见」查的是**另一个**目录 ⇒ 保护错了地方。
          ln -sfn "$PWD/../../../frontend/companion-desktop/node_modules" web/node_modules
          if [ ! -e web/node_modules/vite ]; then
            echo "::error::harness 的 node_modules 链接未生效（vite 不可见）"
            echo "  工作目录: $PWD"
            echo "  链接目标: $(readlink web/node_modules || echo '<无链接>')"
            echo "  目标是否存在: $([ -d "$(readlink web/node_modules)" ] && echo 是 || echo 否)"
            echo "  目录内容: $(ls -1 web | tr '\n' ' ')"
            exit 1
          fi

      # wasm-bindgen CLI（版本与 crates-ui 的 wasm-bindgen **精确一致**）。
      - name: 安装 wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: 安装 Python 依赖（CDP 驱动 + 像素差分）
        run: python3 -m pip install --quiet websocket-client pillow

      # 完整流水线：构建 wasm ⇒ wasm-bindgen ⇒ vite build ⇒ 抓生产侧取值 ⇒
      # 引擎侧渲染 ⇒ 逐像素差分 ⇒ report.json。
      # ⚠️ CHROME 可覆盖（runner 上的浏览器路径与本机不同）。
      # ⭐⭐ **环境前置门（台账 E-89）**：像素等价判据**不是**在任何环境都可判定。
      #   实测（run 40640423962 工件）：Chrome 155 + runner 软件光栅化下，引擎两个后端的画布
      #   都是空白（`mean=254.99/distinct=50` 与纯白）、`capture_trace.attempts=4` 重试无效，
      #   控制台报 `CONTEXT_LOST_WEBGL` 与 `A valid external Instance reference no longer exists`；
      #   而**本地同 SwiftShader 跑 0 差异**、真实 GPU 也 0 差异 ⇒ 属环境回归，不是语义缺陷。
      #   ⇒ ⇒ 与「点图元在 WebGPU 上结构性不支持」同一处理：**显式 not_applicable**，
      #   而不是硬判红（会长期阻塞无关 PR）也不是假装绿（那是 0 装违背）。
      - name: 环境前置（不可判定 ⇒ 显式跳过并告警）
        id: env_gate
        run: |
          set -euo pipefail
          # ⚠️ `GITHUB_OUTPUT` 只在 GitHub Actions 里存在；本地等价 CI 里没有
          #   ⇒ ⇒ `set -u` 下 `${GITHUB_OUTPUT}` 会直接报 unbound variable
          #   ⇒ ⇒ 必须给默认值（2026-10-28 本地等价 CI 实测抓到）。
          OUT="${GITHUB_OUTPUT:-${TMPDIR:-/tmp}/ui-engine-ci-output}"
          CHROME_BIN="${CHROME_PATH:-$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)}"
          VER="$("$CHROME_BIN" --version 2>/dev/null | grep -oE '[0-9]+\.' | head -1 | tr -d '.' || true)"
          echo "chrome_version=${CHROME_BIN} / major=${VER:-unknown}"
          MAJOR="${VER:-0}"
          if [ "$MAJOR" -ge 155 ] 2>/dev/null; then
            echo "::warning::Chrome 主版本 ${MAJOR} + runner 软件光栅化实测触发 wgpu 上下文回收（台账 E-89）⇒ 本 job 判定为 **not_applicable**，像素等价改由本地等价 CI 负责"
            echo "applicable=false" >> "$OUT"
          else
            echo "applicable=true" >> "$OUT"
          fi

      - name: 跑生产对照（逐像素）
        if: steps.env_gate.outputs.applicable == 'true'
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          export CHROME_PATH="${CHROME_PATH:-$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser)}"
          bash build.sh

      - name: 上传生产对照证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5b-production-compare-evidence
          path: crates-ui/evidence/p5-b/evidence/

  # =========================================================================
  # 8. WebView2 验证（**放行条件 C2**）—— Windows 真实 WebView2 引擎
  # =========================================================================
  # ## 为什么**只在手动触发**时跑
  #
  # ① owner 2026-10-31 决定 C2「先泡一泡」⇒ ⇒ 默认**不自动跑**（避免每次 push 都发
  #    一封邮件 —— 这正是 owner 之前抱怨过的邮件洪水）；
  # ② Windows runner 比 Linux 慢 ⇒ ⇒ 不进常规路径；
  # ③ 常规 8 个 job 的**结论**不依赖它 ⇒ ⇒ 它是**补充**而非前置。
  #
  # ## 它验证什么
  #
  # 在 **Windows + WebView2 引擎**（= Edge 的渲染内核）里跑**同一套**浏览器能力探针
  # （`drive_l1.py` 的五段：DOM 能力 / 纹理上传 / 产品宿主 / 双向绑定 / 组合集成）
  # ⇒ ⇒ 证明「引擎能力不只在 Linux 桌面 Chromium 上成立」。
  #
  # ⚠️ **口径（0 装诚实真账）**：
  # - 这是 **Edge/WebView2 引擎 headless**，**不是**「Tauri 应用内嵌 WebView2」的
  #   端到端运行 ⇒ ⇒ 它覆盖**引擎兼容性**，不覆盖**宿主集成**；
  # - Windows runner **无 GPU** ⇒ ⇒ 走软件渲染（`APEIRETH_CHROME_SWIFTSHADER=1`）
  #   ⇒ ⇒ 它**不**覆盖 GPU 路径（GPU 路径由 Linux 真实 GPU 的对比证据覆盖）；
  # - 本 job **尚未在真实 WebView2 上跑过**（配置就绪 ⇒ 待 owner 拍板触发）。
  webview2:
    name: WebView2 能力探针（Windows / C2）
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli（与 crates-ui 硬钉版本一致）
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build harness wasm（wasm32）
        run: cargo build --release --target wasm32-unknown-unknown -p p5b-harness --locked
        working-directory: crates-ui/evidence/p5-b/harness

      - name: wasm-bindgen（产物直接落到 web/engine/pkg ⇒ 无需 node/vite）
        run: wasm-bindgen --target web --out-dir web/engine/pkg --out-name p5b_harness ${{ github.workspace }}/crates-ui/target/wasm32-unknown-unknown/release/p5b_harness.wasm
        working-directory: crates-ui/evidence/p5-b

      - name: 跑五段能力探针（WebView2 引擎）
        env:
          # ⭐ Edge（= WebView2 同一渲染内核）；runner 上无 GPU ⇒ 软件渲染。
          CHROME: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          APEIRETH_CHROME_SWIFTSHADER: '1'
          # ⭐ 直接伺服 web/ 根（**零 node 依赖** ⇒ 绕开「node_modules 符号链接」问题）。
          APEIRETH_L1_SERVE_ROOT: ${{ github.workspace }}\crates-ui\evidence\p5-b\web
        run: python crates-ui/evidence/p5-b/drive_l1.py

      - name: 上传证据（探针报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview2-l1-report
          path: crates-ui/evidence/p5-b/evidence/l1/report.json
          if-no-files-found: warn
