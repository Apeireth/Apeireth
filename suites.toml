# Current root-workspace package inventory.
# This file is declarative documentation; Cargo remains the build authority.

schema = 1

[base]
feature = "base"
crates = [
    "apeireth-core",
    "apeireth-protocol",
    "apeireth-plugin",
    "apeireth-governance",
    "apeireth-credentials",
    "apeireth-runtime",
    "apeireth-provider",
    "apeireth-storage",
    "apeireth-memory",
    "apeireth-tools-canonical",
    "apeireth-gateway",
    "apeireth-cli",
    "apeireth-sdk",
]
note = "The root product baseline is the thirteen-package Cargo workspace. The independent desktop workspace is released separately."

[deferred]
process_supervisor = "Not implemented; requires a separate process-tree and containment contract."
runtime_security = "Not implemented; risk, telemetry, Sentinel, and EDR remain separate design work."
optional_packs = "No unimplemented feature-pack directories or placeholder crates are created by this baseline."
