# ============================================================================
# audit.toml — cargo-audit ignore 配置 (CI fix 2026-08)
# ============================================================================
# 这份文件与 deny.toml [advisories].ignore、cargo-audit.yml 的显式
# `--ignore` 以及 scripts/vet.sh 保持完全相同。新增或删除条目时，四处必须同批
# 更新；scripts/test_advisory_policy.py 会阻止清单静默漂移。

[advisories]
ignore = [
    # paste 1.0.15：unmaintained 类公告；经 pulp/exr 图像链进入，运行时不执行
    # paste proc macro。上游已归档且当前无安全升级路径。若依赖链移除即删本条。
    # 完整理由及复审条件见 deny.toml 同名条目。
    "RUSTSEC-2024-0436",
    # 2026-11-17 供应链公告批：RUSTSEC-2026-0543（chrono 0.4.45 · unmaintained）。
    # 类型＝unmaintained（非漏洞：无 exploit / 无 unsafe 缺陷 / 无数据泄漏面）；
    # 所有版本都受影响 ⇒ 公告自带「无安全升级路径」⇒ 升级解不掉；
    # chrono 是在役直接依赖（6 个在役 crate 引用）⇒ 迁移属独立工作线。
    # 复审条件：迁移完成后即删；上游恢复维护 ⇒ 变 advisory-not-detected ⇒ 即删。
    # 理由全文与同步面见 deny.toml [advisories].ignore 同名条目。
    "RUSTSEC-2026-0543",
]
