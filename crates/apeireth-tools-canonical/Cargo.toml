[package]
name = "apeireth-tools-canonical"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical builtin tool capabilities: read-only filesystem, local search, and read-only repository inspection."

[dependencies]
