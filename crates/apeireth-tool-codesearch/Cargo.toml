[package]
name = "apeireth-tool-codesearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R140: code search + knowledge graph (regex + Aho-Corasick + symbol extraction), 15 MCP tools, borrows codebase-memory-mcp design"

[dependencies]
# Apeireth core
apeireth-tools = { path = "../apeireth-tools" }
apeireth-tool-registry = { path = "../apeireth-tool-registry" }
apeireth-tool-runtime = { path = "../apeireth-tool-runtime" }
apeireth-tool-approval = { path = "../apeireth-tool-approval" }
apeireth-tool-filesystem = { path = "../apeireth-tool-filesystem" }
apeireth-core = { path = "../apeireth-core" }
apeireth-sovereignty = { path = "../apeireth-sovereignty" }

# Workspace deps
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
regex = "1.10"
lru = { workspace = true }
tempfile = "3.10"
aho-corasick = "1.1"
globset = "0.4"
walkdir = "2.5"
ignore = "0.4"
rusqlite = { workspace = true }

# P2#9 (审计 backlog 全清, 2026-08-16): tree-sitter 精确符号提取 (可选 feature —
# 默认关, 避免编译成本; 开启后与 regex 版共存, 同一 Symbol API)
tree-sitter = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }

[features]
default = []
# 开启 tree-sitter 精确提取 (Rust 文件; 全语法树, 非正则)
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-rust"]

[lib]
path = "src/lib.rs"
# R179 P0#X (warnings cleanup): 加 [lints] section 继承 workspace (含 unexpected_cfgs.check-cfg = ['cfg(kani)'])
[lints]
workspace = true
