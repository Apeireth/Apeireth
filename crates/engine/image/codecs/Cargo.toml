# Modified 2026-10-18 for the Apeireth workspace: crate identifiers, tooling knob
# names and product references renamed to neutral names; generated metadata producer
# strings neutralised; scope adaptations recorded in
# docs/04-internal/license-port/gate1-license.md. Original license terms unchanged.
[package]
name = "apeireth-image-codecs"
description = "Symmetric, depth- and metadata-preserving codecs for flat raster image formats"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
rust-version.workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
default = []
# AVIF *encode* via ravif (pure Rust). Decoding AVIF needs dav1d (C), so AVIF
# stays read-unsupported and therefore asymmetric; it is off by default.
avif = ["image/avif"]

[dependencies]
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["gif", "bmp", "tga", "ico", "qoi", "hdr"] }
png = "0.18"
tiff = { version = "0.11", default-features = false, features = ["deflate", "fax", "jpeg", "lzw"] }
exr = { version = "1.73", default-features = false }
half = "2"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image-webp = "0.2"
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = "0.6"

# Orientation is applied a band of rows per task on native; wasm stays single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
# EXR block (de)compression runs on the rayon pool natively; wasm stays single-threaded.
exr = { version = "1.73", default-features = false, features = ["rayon"] }

[dev-dependencies]
proptest = "1"
# Oracle decoders for cross-checking in tests only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "allow", priority = -1 }
dbg_macro = "warn"
todo = "warn"
