[package]
name = "apeireth-image-compose"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "allow", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[dependencies]
apeireth-image-geom = { path = "../geom" }
apeireth-image-color = { path = "../color" }
apeireth-image-raster = { path = "../raster" }
apeireth-image-doc = { path = "../doc" }
apeireth-image-vector = { path = "../vector" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "compose"
harness = false
