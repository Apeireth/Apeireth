#
# Modified 2026-10-18 for the Apeireth workspace: crate identifiers, tooling knob
# names and product references renamed to neutral names; generated metadata producer
# strings neutralised; scope adaptations recorded in
# docs/04-internal/license-port/gate1-license.md. Original license terms unchanged.
[package]
name = "apeireth-image-psd"
description = "Faithful, lossless reader and writer for Adobe Photoshop PSD (v1) and PSB (v2) files"
version.workspace = true
edition = "2024"
license.workspace = true
publish = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "apeireth_image_psd"
path = "src/lib.rs"

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# `testgen` is on by default: the integration tests under `tests/` build their fixtures with
# `apeireth_image_psd::testgen`, and the usual way to switch a crate's own feature on for its
# integration tests — a self dev-dependency — cannot survive `cargo package` (cargo strips the
# path and then looks the crate up in the registry, so packaging fails with
# "no matching package named `apeireth-image-psd` found"). A default feature keeps the test
# suite complete and the crate publishable; `default-features = false` turns the module off.
default = ["testgen"]
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "allow", priority = -1 }
dbg_macro = "warn"
todo = "warn"
