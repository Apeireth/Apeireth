[package]
name = "apeireth-image-cms"
description = "Pure-Rust ICC v2/v4 colour management: profile parsing and writing, transforms, rendering intents, black point compensation"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "allow", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
moxcms = "0.8"
