# Modified 2026-10-18 for the Apeireth workspace: crate identifiers, tooling knob
# names and product references renamed to neutral names; generated metadata producer
# strings neutralised; scope adaptations recorded in
# docs/04-internal/license-port/gate1-license.md. Original license terms unchanged.
[package]
name = "apeireth-image-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "allow", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[dependencies]
apeireth-image-geom = { path = "../geom" }
apeireth-image-color = { path = "../color" }
apeireth-image-raster = { path = "../raster" }
serde = { version = "1", features = ["derive", "rc"] }
rustfft = "6.4.1"

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
serde_json = "1"
