[package]
name = "apeireth-perception"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth 感知层 trait (P-arch 2026-08-27, A3): 5 modality (Text/Voice/Vision/Tactile/Command) + Attention 策略 (TopK/Threshold) + 统一 PerceptionEvent. v2.0 alpha 仅 Text 真实现; Voice/Vision/Tactile 是 forward-declared 0 装 (v2.1 路线)"

[dependencies]
apeireth-core = { path = "../../foundation/core" }
apeireth-plugin = { path = "../../foundation/plugin" }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# XCap is only compiled on platforms for which it provides a capture backend.
# The vision module has a cfg-gated fail-closed fallback for other targets.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
xcap = "0.9.8"
# Keep emitted formats explicit and minimal. `xcap` supplies RGBA frames;
# this activates only PNG/JPEG encoders instead of image's full codec set.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lib]
name = "apeireth_perception"
path = "src/lib.rs"

[lints]
workspace = true
