[package]
name = "apeireth-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth canonical memory: durable storage, ACT-R retrieval, graph primitives, and vector indexing"

[dependencies]
apeireth-core = { path = "../../foundation/core" }
apeireth-plugin = { path = "../../foundation/plugin" }
# 「性格养成」第一铲: 体验参数旋钮 (MemoryFade 等) 的类型单一权威在
# orchestration::self_tuning —— 记忆衰减常量直接按 TunableParam 取值, 不复制边界。
apeireth-orchestration = { path = "../../foundation/orchestration" }
apeireth-protocol = { path = "../../foundation/protocol" }
apeireth-storage = { path = "../storage" }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
# v2.0.0-rc.1 RC-10: AES-256-GCM 加密 (per v2.0.0-rc-roadmap.md §3 RC-10)
aes-gcm = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

[features]
default = []

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"
rusqlite = { workspace = true }

[lib]
name = "apeireth_memory"
path = "src/lib.rs"
bench = false

[[example]]
name = "memory_effect_demo"
path = "examples/memory_effect_demo.rs"

[lints]
workspace = true
