[package]
name = "apeireth-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth canonical memory: durable storage, ACT-R retrieval, graph primitives, and vector indexing"

[dependencies]
apeireth-core = { path = "../../foundation/core" }
apeireth-plugin = { path = "../../foundation/plugin" }
apeireth-storage = { path = "../storage" }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v5"] }

[features]
default = []

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"
rusqlite = { workspace = true }

[lib]
name = "apeireth_memory"
path = "src/lib.rs"
bench = false

[[example]]
name = "memory_effect_demo"
path = "examples/memory_effect_demo.rs"

[lints]
workspace = true
