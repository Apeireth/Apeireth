[package]
name = "apeireth-organ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth 9-organ 真移植 (P-arch 2026-08-28): v1 companion era 9 organ (W1/W2/W3/E4/F4/F1/F6/E7/Memory) 1:1 翻译到 v2 OrganTrait 抽象边界. v2.0-rc.1 E4/F4/F6/F1 真实现 (确定性无 LLM 器官); 其余 5 organ (W1/W2/W3/E7/Memory) 是 forward-declared trait/类型 (rc 阶段或 v2.1 续做, 含 LLM 重估)."

[dependencies]
apeireth-core = { path = "../../foundation/core" }
apeireth-plugin = { path = "../../foundation/plugin" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# R4 W1 world_model 真接 LLM (per v1 doc "第一层: LLM 按时间线展开反事实推演链") —
# `LlmFactory::spawn` 需要 `SubagentRole` (来自 `apeireth-orchestration`).
# 0 装诚实: W1 必须真接 LLM, 不能走 dev-dep 路径 (那 src 不可见).
apeireth-orchestration = { path = "../../foundation/orchestration" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# organ_llm_bridge_compat test: prove W1/W2 constructors consume the runtime
# canonical bridge (`InvokerLlmFactory` over `ModuleInvoker`) without
# algorithm changes. dev-only; the library dependency graph is unchanged.
apeireth-runtime = { path = "../runtime" }
apeireth-protocol = { path = "../../foundation/protocol" }

[lib]
name = "apeireth_organ"
path = "src/lib.rs"

[lints]
workspace = true