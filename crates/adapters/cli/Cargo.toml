[package]
name = "apeireth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Canonical Apeireth CLI for session, chat, and gateway commands"

[[bin]]
name = "apeireth"
path = "src/main.rs"

[dependencies]
apeireth-core = { path = "../../foundation/core" }
apeireth-credentials = { path = "../../foundation/credentials" }
apeireth-governance = { path = "../../foundation/governance" }
apeireth-gateway = { path = "../gateway" }
apeireth-guard = { path = "../../engine/guard" }
apeireth-memory = { path = "../../engine/memory" }
apeireth-orchestration = { path = "../../foundation/orchestration" }
apeireth-plugin = { path = "../../foundation/plugin" }
apeireth-protocol = { path = "../../foundation/protocol" }
apeireth-provider = { path = "../../engine/provider" }
apeireth-runtime = { path = "../../engine/runtime" }
apeireth-runtime-assembly = { path = "../../engine/runtime-assembly" }
# V3-a 双引擎主动关怀: 治理档钩子 (`CareScheduleApprovalHook`) 与关怀节时钟
# (`SystemCareClock`) 的注册/接线面 (engine 层, 方向不变)。
apeireth-organ = { path = "../../engine/organ" }
apeireth-storage = { path = "../../engine/storage" }
# 2026-09-08 用户旋钮批: shell/fetch 工具配置类型 (TrustedShellConfig / FetchConfig).
apeireth-tools-canonical = { path = "../../capabilities/tools" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# W2 §4.1 dreaming: dream 命令缺省日记日期 = 本地今天 (YYYY-MM-DD)
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
chrono = { workspace = true }
rusqlite = { workspace = true }
# 文件写入统一走 fs_err (clippy.toml disallowed-methods 约束, 测试面同样适用)
fs-err = { workspace = true }
# V2-b 双入口同源测试: 以真路由过 HTTP 面 (与 gateway 测试面同款三件套)
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = ["base"]
base = []

[lib]
name = "apeireth_cli"
path = "src/lib.rs"

[lints]
workspace = true
