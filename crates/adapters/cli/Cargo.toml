[package]
name = "apeireth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Canonical Apeireth CLI for session, chat, and gateway commands"

[[bin]]
name = "apeireth"
path = "src/main.rs"

[dependencies]
apeireth-core = { path = "../../foundation/core" }
apeireth-credentials = { path = "../../foundation/credentials" }
apeireth-governance = { path = "../../foundation/governance" }
apeireth-gateway = { path = "../gateway" }
apeireth-memory = { path = "../../engine/memory" }
apeireth-orchestration = { path = "../../foundation/orchestration" }
apeireth-plugin = { path = "../../foundation/plugin" }
apeireth-tools-canonical = { path = "../../capabilities/tools" }
apeireth-provider = { path = "../../engine/provider" }
apeireth-runtime = { path = "../../engine/runtime" }
apeireth-storage = { path = "../../engine/storage" }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
reqwest = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["base"]
base = []

[lib]
name = "apeireth_cli"
path = "src/lib.rs"

[lints]
workspace = true
