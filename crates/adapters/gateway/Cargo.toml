[package]
name = "apeireth-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical HTTP gateway adapter for the Apeireth runtime"
keywords = ["ai", "gateway", "http", "runtime"]
categories = ["api-bindings"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
axum = { version = "0.7", features = ["macros"] }
async-trait = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["cors"] }
apeireth-core = { path = "../../foundation/core" }
apeireth-protocol = { path = "../../foundation/protocol" }
apeireth-runtime = { path = "../../engine/runtime" }
apeireth-guard = { path = "../../engine/guard" }
# IM 快捷接入: 审批闭合四态词表 + 原子审计配对 (approval_closure) + 动作绑定摘要口径
apeireth-governance = { path = "../../foundation/governance" }
# IM 快捷接入: 渠道 wire 面 (kind / 入站解码 / 出站信封 / 审批卡片 / 分段 / 传输)
apeireth-sdk = { path = "../sdk" }
# 自主度提案面接线: 工具面 trait (按钮回调 → `proposal accept/reject` 落账)
apeireth-plugin = { path = "../../foundation/plugin" }
# 自主度提案面接线: 提案账 / 推送账 / 人审卡载荷 (提案卡出站 + 落账同账同源)
apeireth-tools-canonical = { path = "../../capabilities/tools" }
# 仓库统一文件 IO 约定 (clippy.toml: std::fs → fs_err)
fs-err = { workspace = true }
sha2 = { workspace = true }
# W2-② TLS 面真接线 (安全加固批 B5, 主代理拍板 2026-10-20): 服务端 TLS 协议栈 +
# tokio IO 适配 + PEM/DER 材料解析。0 新外部包: 三包已随 workspace reqwest
# rustls-tls 在 Cargo.lock 树 (rustls 0.23.x / tokio-rustls 0.26.x / rustls-pki-types
# 1.15.x), 此处只 +3 依赖边; default-features 关掉 aws_lc_rs 家族 (树内 provider
# = ring, 见 Cargo.lock), 不引新包。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1.15"
# TLS 面连接组装 (hyper-util 本就是 workspace 依赖, 0 新外部包): HTTP/1+2 协商 +
# 优雅停机 + 服务胶 (axum 0.7 的 serve 只收 TcpListener, TLS 面须自行接线)。
hyper-util = { workspace = true, features = ["server", "service", "http1", "http2", "tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }
uuid = { workspace = true }
apeireth-provider = { path = "../../engine/provider" }
reqwest = { workspace = true }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# IM 快捷接入测试: mock IM 端点 (0 真实网络)
wiremock = "0.6"

[lib]
name = "apeireth_gateway"
path = "src/lib.rs"

[lints]
workspace = true
