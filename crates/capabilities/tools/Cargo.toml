[package]
name = "apeireth-tools-canonical"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical builtin tool capabilities: filesystem / search / repo (默认启用); shell / fetch (opt-in, 默认关); egress 策略 + 唯一 ProcessExecutor 边界（Windows Job Object + CREATE_SUSPENDED 三 OS 隔离）"

[dependencies]
# Permitted direction: builtin tools are plugin capabilities. They depend on the
# canonical plugin/protocol/core contracts, never on the runtime or gateway.
# The governance edge is one-way and interface-only: the execution chain's guard
# stage consults the deny-only guard interface; no policy is owned here.
apeireth-core = { path = "../../foundation/core" }
apeireth-protocol = { path = "../../foundation/protocol" }
apeireth-plugin = { path = "../../foundation/plugin" }
apeireth-governance = { path = "../../foundation/governance" }
# 技能卡调用面 (I1) 复用共享引用封套 (UntrustedEnvelope: 固定警告头 + 显式
# 边界 + 边界伪造转义 + 每源预算 + 分级省略) —— 与记忆检索披露同一套 L2
# 封套披露语义, 一个预算系统管到底。orchestration 生产依赖仅 core,
# 方向不变 (foundation 契约面)。
apeireth-orchestration = { path = "../../foundation/orchestration" }
async-trait = { workspace = true }
encoding_rs = "0.8"
futures = { workspace = true }
# 创作工具面 W1 (图像操作 `tool.image_ops`) 换创作内核: 编解码与像素几何/滤镜
# 走引擎级创作内核 `apeireth-image-core` (workspace 内部接口层 + 图像核心家族,
# 许可与四关质检见 docs/04-internal/license-port/)。换核后产品代码**零外部
# 图像库直接依赖**: 白名单四格式 (png/jpeg/webp/bmp) 编解码由核面接管 (jpeg
# 有损质量 90 / webp 无损档, 与换核前口径一致)。如实登记: 核面内部对
# bmp/gif/tga 等格式的编解码仍委派外部纯 Rust 图像库 (属核面依赖闭包既有
# 登记, 见 artifacts/licport-dep-closure.txt), 本层不再直接引用。
apeireth-image-core = { path = "../../engine/image/core" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# G5 备份恢复: manifest 逐文件 SHA-256 摘要 (损坏可检出)。workspace 既有依赖
# (guard/gateway/memory 等同源), 非新外部包; 归档容器 (tar/zip 类) 都需新依赖,
# 故备份格式选目录快照 + 逐文件摘要 (0 引新外部包)。
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = "2.5.8"

# 文档操作面 (W2 `tool.doc_ops`) 依赖报备 —— **0 新外部包**: 两者都是 Cargo.lock
# 既有传递依赖 (png / wayland-scanner 等同源) 的同版本直接化引用, 版本钉死
# (`=` 精确) 保证锁定文件版本轴零漂移。分工: `flate2` = PDF 内容流 zlib 解压 +
# ZIP deflate 条目解压/压缩; `quick-xml` = DOCX (OOXML) XML 解析。ZIP 容器读写端
# 是 `doc_ops.rs` 内纯 Rust 最小实现 (读写同一 stored/deflate 子集对称, 不引 zip
# 容器包)。
flate2 = "=1.1.10"
quick-xml = "=0.41.0"

# Windows process containment uses the same windows-sys convention as the
# companion crate. The dependency is target-scoped so non-Windows builds never
# compile or link Windows-only imports.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Unix backends use libc only inside target-scoped modules. The crate does not
# expose libc types through the canonical public process layer.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.189" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.189" }

[dev-dependencies]
tempfile = "3"
# 测试专用 (金标准像素断言的 fixture 生成/回读 + 换核前后一致性抽样的换核前
# 旧实现): 非产品依赖, 特性面仍只开白名单四格式。
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
] }

[target.'cfg(unix)'.dev-dependencies]
libc = { version = "0.2.189" }

[lints]
workspace = true

# Test-only helper for proving real OS process enforcement. It is not a
# product tool, accepts no user command strings, and is driven only by fixed
# modes (sleep, print, allocate, spawn-child, check-job, ...).
[[bin]]
name = "sandbox-test-child"
path = "src/bin/sandbox_test_child.rs"
test = false
bench = false
doc = false

