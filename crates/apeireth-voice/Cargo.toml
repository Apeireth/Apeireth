[package]
name = "apeireth-voice"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["Apeireth Team"]
license.workspace = true
repository = "https://github.com/apeireth/apeireth-rust"
description = "Apeireth voice subsystem"
keywords = ["ai", "voice", "wake-word", "porcupine", "tts", "stt", "stub"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "apeireth_voice"
path = "src/lib.rs"
# CI fix 2026-08: lib 默认 bench=true → cargo bench 无参数/--benches 会把 lib 当
# libtest harness bench 跑, 不认 criterion 的 --save-baseline → 显式关掉
bench = false

[dependencies]
# R173 bridge 4: consciousness -> voice
apeireth-consciousness = { path = "../apeireth-consciousness" }
# R173 bridge 8: companion -> voice
apeireth-companion = { path = "../apeireth-companion" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full", "test-util", "macros"] }
futures = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"

[[bench]]
name = "bench"
harness = false

[[example]]
name = "voice_stub_demo"
path = "examples/voice_stub_demo.rs"

[[example]]
name = "voice_real_demo"
path = "examples/voice_real_demo.rs"

[lints]
workspace = true

[[example]]
name = "realtime_session_demo"
path = "examples/realtime_session_demo.rs"
