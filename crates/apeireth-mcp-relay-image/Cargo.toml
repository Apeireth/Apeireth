[package]
name = "apeireth-mcp-relay-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R20 阶段 1: Relay Image MCP Server (1:1 翻译 v0.9.21 商业版 out/main/mcp/RelayImageMcpServer.js ~57KB)"
keywords = ["ai", "mcp", "image", "relay", "agent"]
categories = ["api-bindings", "multimedia"]

[dependencies]
# HTTP client (image relay)
reqwest = { workspace = true }
# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# base64 (image encoding)
base64 = "0.22"
# SHA256 (image dedup)
sha2 = "0.10"
# async runtime
tokio = { workspace = true }
# serialization
serde = { workspace = true }
serde_json = "1.0"
# error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# tracing
tracing = "0.1"
# async traits
async-trait = { workspace = true }
# shared MCP types
apeireth-mcp = { path = "../apeireth-mcp" }
apeireth-protocol = { path = "../apeireth-protocol" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[example]]
name = "relay_image_mcp_demo"
path = "examples/relay_image_mcp_demo.rs"

# R19 第 0 阶段: workspace lint 继承
[lints]
workspace = true
