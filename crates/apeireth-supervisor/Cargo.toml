[package]
name = "apeireth-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth process-level supervisor: PID 1 + 5 sub-supervisors + 3 restart strategies + actor mailbox + AI 自驱心跳"

[dependencies]
apeireth-verify = { path = "../apeireth-verify" }
tokio = { workspace = true, features = ["sync", "process", "rt", "macros", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lib]
name = "apeireth_supervisor"
path = "src/lib.rs"

[[example]]
name = "supervisor_demo"
path = "examples/supervisor_demo.rs"

[lints]
workspace = true
