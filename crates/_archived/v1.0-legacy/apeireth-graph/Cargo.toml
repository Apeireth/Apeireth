[package]
name = "apeireth-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth v2.0 P0 deterministic graph orchestration and checkpoints"

[features]
default = []
supervisor-integration = ["dep:apeireth-supervisor"]

[lib]
name = "apeireth_graph"
path = "src/lib.rs"
# CI fix 2026-08: lib 默认 bench=true → cargo bench 无参数/--benches 会把 lib 当
# libtest harness bench 跑, 不认 criterion 的 --save-baseline → 显式关掉
bench = false

[dependencies]
apeireth-supervisor = { path = "../apeireth-supervisor", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "macros"] }
uuid = { workspace = true }
apeireth-asi = { path = '../apeireth-asi' }
apeireth-mcp = { path = "../apeireth-mcp" }
apeireth-cognition = { path = '../apeireth-cognition' }
apeireth-core = { path = '../apeireth-core' }
parking_lot = "0.12"

[[example]]
name = "linear_3_nodes"
path = "examples/linear_3_nodes.rs"

# R126-3: Subgraph + Channel demo
[[example]]
name = "subgraph_channel_demo"
path = "examples/subgraph_channel_demo.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true


