[package]
name = "apeireth-relation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth relation subsystem (A12) - 4 relation kinds (Symbiosis/Coordination/Embedding/SelfRelation) + relation decision tree + property graph (R154: RelationGraph with adjacency indexes + BFS/DFS iterators + shortest path + predicate query). 0 引 external dep."

[dependencies]
apeireth-core = { path = "../apeireth-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lib]
name = "apeireth_relations"
path = "src/lib.rs"

[[example]]
name = "relation_demo"
path = "examples/relation_demo.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true

[[example]]
name = "graph_demo"
path = "examples/graph_demo.rs"
