[package]
name = "apeireth-relation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth 关系子系统 (A12 — 4 类关系: Symbiosis/Coordination/Embedding/SelfRelation + 关系决策树)"

[dependencies]
apeireth-core = { path = "../apeireth-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lib]
name = "apeireth_relations"
path = "src/lib.rs"

[[example]]
name = "relation_demo"
path = "examples/relation_demo.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
