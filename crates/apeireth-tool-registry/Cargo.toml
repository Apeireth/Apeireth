[package]
name = "apeireth-tool-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R17 战役 2-1: 工具注册中心 (6 类 enum + 5 轴正交 + token 预算三层 + notify 热加载 + 异步任务推送, VCP 借鉴 §6.2.1 #12/#13 + §6.2.2 #15 + agentManager.js chokidar)"
keywords = ["ai", "tool", "registry", "plugin", "hot-reload"]
categories = ["api-bindings", "data-structures"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
notify = "5"
parking_lot = "0.12"
tracing = "0.1"

# 注: AsyncTaskStore 不直接依赖 apeireth-bus, 避免
# tool-registry -> bus -> extension -> verify -> asi -> api -> tool-registry 循环
# 调用方 (tool-runtime) 自行把 TaskRecord 投到 bus

[dev-dependencies]
tempfile = "3"

[[example]]
name = "registry_demo"
path = "examples/registry_demo.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
