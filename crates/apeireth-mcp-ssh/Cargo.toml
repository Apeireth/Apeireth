[package]
name = "apeireth-mcp-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R20 阶段 1: SSH MCP Server (1:1 翻译 v0.9.21 商业版 out/main/mcp/SSHMcpServer.js ~438KB)"
keywords = ["ai", "mcp", "ssh", "remote-shell", "agent"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# SSH 客户端 (1:1 翻译 SSH 协议支持, 默认 features 走系统 openssl, 不强制 vendored)
ssh2 = { version = "0.9" }
# async runtime
tokio = { workspace = true }
# serialization
serde = { workspace = true }
serde_json = "1.0"
# error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# tracing
tracing = "0.1"
# async traits
async-trait = { workspace = true }
# shared MCP types (apeireth-mcp builtin 集成)
apeireth-mcp = { path = "../apeireth-mcp" }
apeireth-protocol = { path = "../apeireth-protocol" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[example]]
name = "ssh_mcp_demo"
path = "examples/ssh_mcp_demo.rs"

# R19 第 0 阶段: workspace lint 继承
# 业界来源: wasmtime + qdrant 等 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
