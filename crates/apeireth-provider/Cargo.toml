[package]
name = "apeireth-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "apeireth-provider — R35: 6 Provider (claude-code/codex/copilot/gemini-cli/opencode/minimax) + R176: LlmFacade + http_dispatch"
[lib]
name = "apeireth_provider"
path = "src/lib.rs"
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
apeireth-core = { path = "../apeireth-core" }
apeireth-llm-iface = { path = "../apeireth-llm-iface" }
apeireth-plugin = { path = "../apeireth-plugin" }
apeireth-protocol = { path = "../apeireth-protocol" }
apeireth-acp = { path = "../apeireth-acp" }
apeireth-http-client = { path = "../apeireth-http-client" }
tokio = { workspace = true }
# Canonical provider transport: the provider owns its reqwest client and its
# lifetime (per ARCHITECTURE.md HTTP-ownership rule). rustls-tls matches the
# workspace default; no native-tls.
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time", "test-util"] }
apeireth-core = { path = "../apeireth-core" }
[lints]
workspace = true
