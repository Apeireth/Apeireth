[package]
name = "apeireth-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth R17 战役 1-3 主 chat 管线 (借鉴 §6.2.2 #15/#17/#19/#20: token 预算三层 / placeholder 递归 / Force-Translate / 15s 抑制窗口)"

[lib]
name = "apeireth_pipeline"
path = "src/lib.rs"

[dependencies]
apeireth-protocol = { path = "../apeireth-protocol" }
apeireth-http-client = { path = "../apeireth-http-client" }
tokio = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
# R122-5: 借鉴 VCP semanticModelRouter.js, YAML 配置 (R122-5-VCP-SemanticModelRouter-2026-08-10)
serde_yaml = "0.9"
# R122-3-retry: 借鉴 VCP finalContextStore.js, 精确 token 计数 (tiktoken Rust 绑定)
tiktoken-rs = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
regex = "1.10"
parking_lot = "0.12"
bytes = "1.7"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util", "macros"] }
wiremock = "0.6"
# R122-3-retry: 集成 test 验证 5 model + BPE encode/decode
tiktoken-rs = { workspace = true }

[[example]]
name = "pipeline_demo"
path = "examples/pipeline_demo.rs"

# R126-1: Provider Registry demo (LiteLLM ⏳ 限流 = 准备, 0 装 PASS 严守)
[[example]]
name = "provider_registry_demo"
path = "examples/provider_registry_demo.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
