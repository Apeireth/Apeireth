[package]
name = "apeireth-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth Web 前端 — Leptos 0.7 SSR + WASM hydration, 让主人能在浏览器真用 Apeireth Council 7 advisor (R18)"

[package.metadata.leptos]
# Leptos 0.7 metadata (必需, 告诉 leptos_config bin/lib 位置)
bin-package = "apeireth-web"
lib-package = "apeireth_web"
features = ["ssr"]

[lib]
name = "apeireth_web"
path = "src/lib.rs"

[[bin]]
name = "apeireth-web"
path = "src/main.rs"

[features]
# SSR mode (服务端渲染 + 部分客户端交互通过 SSR 渲染的 HTML + vanilla JS)
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:apeireth-api",
    "dep:apeireth-asi",
    "dep:apeireth-memory",
    "dep:apeireth-sovereignty",
    "dep:apeireth-core",
    "dep:apeireth-cognition",
    "dep:apeireth-perception",
    "dep:apeireth-consciousness",
    "dep:apeireth-life-force",
    "dep:apeireth-motivation",
    "dep:apeireth-value",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:tower-http",
    "leptos/ssr",
    "leptos_meta/ssr",
]

# 默认 features: ssr (R18 MVP 简化, 暂不搞 client WASM hydration)
default = ["ssr"]

[dependencies]
apeireth-pipeline = { path = '../apeireth-pipeline' }
# Leptos 0.7 全家桶
leptos = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_axum = { version = "0.7" }

# 后端依赖 (SSR mode 用)
apeireth-api = { path = "../apeireth-api", optional = true }
apeireth-asi = { path = "../apeireth-asi", optional = true }
apeireth-memory = { path = "../apeireth-memory", optional = true }
apeireth-sovereignty = { path = "../apeireth-sovereignty", optional = true }
# Dashboard (R18 sub-agent #5) — 综合 6 器官状态汇总
apeireth-core = { path = "../apeireth-core", optional = true }
apeireth-cognition = { path = "../apeireth-cognition", optional = true }
apeireth-perception = { path = "../apeireth-perception", optional = true }
apeireth-consciousness = { path = "../apeireth-consciousness", optional = true }
apeireth-life-force = { path = "../apeireth-life-force", optional = true }
apeireth-motivation = { path = "../apeireth-motivation", optional = true }
apeireth-value = { path = "../apeireth-value", optional = true }
axum = { version = "0.7", optional = true, features = ["macros"] }
tokio = { workspace = true, optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", features = ["fs", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# 通用依赖 (hydrate 也要用)
serde = { workspace = true }
serde_json = "1.0"
thiserror = { workspace = true }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-net = "0.5"
web-sys = { version = "0.3", features = ["SubmitEvent", "EventTarget", "HtmlTextAreaElement", "HtmlInputElement"], optional = true }

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
