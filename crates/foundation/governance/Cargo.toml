[package]
name = "apeireth-governance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Canonical governance hook: the decision point the runtime consults before it acts. Depends on core only."

[dependencies]
# Permitted direction: governance -> core, and nothing else. Governance must not
# know about the runtime, the gateway, or any concrete capability.
apeireth-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = "1.13"
sha2 = "0.10"

[lib]
name = "apeireth_governance"
path = "src/lib.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# 文件读写统一走 fs_err (clippy.toml disallowed-methods 约束, 测试面同样适用)
fs-err = { workspace = true }

[lints]
workspace = true
