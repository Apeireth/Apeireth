
[package]
name = "apeireth-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth 主路径核心类型 (Episode/Note/Session/IdentityCard) — R14 Phase 1 入口"

[dependencies]
sha2 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[lib]
name = "apeireth_core"
path = "src/lib.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true

# 审计账本单写者锁：Windows 侧用原生 `LockFileEx`（unix 侧走手写 FFI，不加依赖）。
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # `OVERLAPPED` 在 `Win32::System::IO`（不是 Foundation）⇒ 必须开这个 feature。
    "Win32_System_IO",
] }
