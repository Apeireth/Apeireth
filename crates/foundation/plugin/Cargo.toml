[package]
name = "apeireth-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Canonical plugin and capability model: a plugin is a capability provider, and the registries here are the single source of truth for what the runtime can do."

[dependencies]
