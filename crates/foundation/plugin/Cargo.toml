futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lib]
name = "apeireth_plugin"
path = "src/lib.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

