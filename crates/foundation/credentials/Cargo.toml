[package]
name = "apeireth-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth 统一凭据存取层 (TP3/N21): 按服务名读写凭据 (CredentialsStore trait + 文件形态后端) + 权限洋葱衔接 (高危凭据审批门) + 脱敏红线 (明文不入日志/错误). TP20-S3 塞缝批: KeyringBackend trait + 平台 keyring 后端 + EncryptedFileBackend fallback (chacha20poly1305) + SecretBuf zeroize + 审计 (name_hash 不含明文). W4 (2026-10-10): ① 审批门接成真治理 hook (CredentialApprovalHook + ApprovalMemoryGate 共享 ApprovalMemory); ② 审计真落档 FileAuditSink + AuditContext 盐化. 7 src / 92 测试"

[dependencies]
apeireth-plugin = { path = "../plugin" }
# W4① (2026-10-10): 高危凭据审批门接成真治理 hook — 实现 apeireth-governance 的
# GovernanceHook (RequireApproval + approval_resolved 会话记忆)。依赖方向无环
# (governance -> core)。DAG 同步见 docs/04-internal/maintenance-guide.md §2.5。
apeireth-core = { path = "../core" }
apeireth-governance = { path = "../governance" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# TP20-S3 (塞缝批, 安全凭证): 平台 keyring 自动选 Linux/macOS/Windows
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
# TP20-S3: SecretBuf Drop 零化 + EncryptedFileBackend master.key 零化
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# TP20-S3: EncryptedFileBackend 加密原语 (AEAD, 业界标准)
chacha20poly1305 = "0.10"
# TP20-S3: master.key / nonce 随机源
rand = "0.8"
# TP20-S3: 审计 name_hash (SHA-256, 跟 apeireth-host::keyring 1:1 一致)
sha2 = "0.10"
# TP20-S3: name_hash hex 编码
hex = "0.4"

[dev-dependencies]
# W4① 测试: async hook 测试跑 tokio 当前线程运行时 (同 apeireth-guard 惯例)
tokio = { workspace = true, features = ["macros", "rt"] }

[lib]
name = "apeireth_credentials"
path = "src/lib.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
[lints]
workspace = true
