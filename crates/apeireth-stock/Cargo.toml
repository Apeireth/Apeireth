[package]
name = "apeireth-stock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "TP27 标的元数据资产 (N3 金融源, FinanceDatabase 30 万标的入库套件 — 标的清单/行业/交易所/可信度 T0)"

[dependencies]
apeireth-core = { path = "../apeireth-core" }
# 不依赖 apeireth-memory (避免循环依赖, 自带独立 Provenance 枚举)
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
chrono = { workspace = true }
# clippy disallowed-methods (clippy.toml): std::fs / Path::metadata 强制走 fs_err
fs-err = { workspace = true }
# CSV 解析: 用 csv crate (成熟, 处理引号转义/多行字段/UTF-8 BOM 安全)

[dependencies.csv]
version = "1.3"
default-features = false

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(fuzzing)'] }