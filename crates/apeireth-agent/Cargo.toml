[package]
name = "apeireth-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R17 战役 2-4: Agent 管理系统 (alias 解析 + LRU cache + notify 热加载, 字段级复刻 agentManager.js 339 行)"
keywords = ["ai", "agent", "alias", "cache", "hot-reload", "lru"]
categories = ["api-bindings", "data-structures"]

[dependencies]
apeireth-tool-registry = { path = "../apeireth-tool-registry" }
apeireth-api = { path = "../apeireth-api" }
apeireth-pipeline-g5 = { path = "../apeireth-pipeline-g5" }
apeireth-tool-runtime = { path = "../apeireth-tool-runtime" }
apeireth-tool-approval = { path = "../apeireth-tool-approval" }
apeireth-memory = { path = "../apeireth-memory" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = "0.12"
tracing = "0.1"
async-trait = { workspace = true }
notify = "5"
lru = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "agent_demo"
path = "examples/agent_demo.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
