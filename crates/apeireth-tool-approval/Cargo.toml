[package]
name = "apeireth-tool-approval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R17 战役 2-3: 工具审批 (5 规则 + 5 分钟窗口 + fuzzy matching 集成, VCP 借鉴 toolApprovalManager.js)"
keywords = ["ai", "tool", "approval", "security", "fuzzy"]
categories = ["api-bindings", "data-structures"]

[dependencies]
apeireth-tool-registry = { path = "../apeireth-tool-registry" }
apeireth-tool-runtime = { path = "../apeireth-tool-runtime" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = "0.12"
tracing = "0.1"
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "approval_demo"
path = "examples/approval_demo.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
