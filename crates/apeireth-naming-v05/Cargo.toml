[package]
name = "apeireth-naming-v05"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R20 阶段 4 估补: V0.5 命名规范 (4 类 × 6 维 = 24 维) — 1:1 翻译 v1077 V0.5 17 维 LOCKED 升级到 24 维 v2 命名空间 (per docs/architecture-v4-1-living-intelligence-update §13). 4 大类 (PC 0.40 / RC 0.30 / HG 0.15 / GP 0.15) × 6 维度 (level/domain/modality/safety/completeness/lineage) = 24 维, sum=1.00 守门, 编译期 hardcode enum, encode/decode/validate/sum_guard 完整. 0 触碰 24 LOCKED crate + 0 改 workspace version + 6 哲学 anchor + 8 项不修改承诺"
keywords = ["naming", "v05", "asi", "namespace", "24-dim", "agent"]
categories = ["api-bindings", "data-structures", "encoding"]

[dependencies]
# async runtime (encode/decode 都同步, tokio 仅为 dev-deps 留接口)
tokio = { workspace = true }
# serialization (V05Spec Serialize/Deserialize)
serde = { workspace = true }
serde_json = { workspace = true }
# error handling (10 NamingError variant, per skeleton 模式)
anyhow = { workspace = true }
thiserror = { workspace = true }
# logging (sum_guard failure / decode error log)
tracing = "0.1"
# regex for encode/decode (V0.5 字符串 ↔ 24 维结构)
regex = "1.10"

[dev-dependencies]
# workspace tokio 全 feature
tokio = { workspace = true, features = ["full", "test-util"] }
# property-based testing (encode/decode roundtrip)
proptest = { workspace = true }
# 临时文件 (test fixture)
tempfile = "3"

[[example]]
name = "naming_v05_demo"
path = "examples/naming_v05_demo.rs"

# R20 阶段 4: skeleton 阶段不强求 workspace lint 同步, 避免 noise
# (跟 i18n / observability / lark / voice / keyring / machine-id / tree-sitter 同款)
# 整合时 (Mavis 整合 commit) 改为 [lints] workspace = true
[lints.rust]
unused_imports = "allow"
dead_code = "allow"
missing_docs = "allow"
unused_must_use = "allow"
