[package]
name = "apeireth-council"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth 智囊团 7 强制 Advisor + 按住机制 + 拟人化 synthesis + mock LLM provider — R14 Phase 5 P22 (架构师2 落点, P15 7 强制顾问)"

[dependencies]
apeireth-verify = { path = "../apeireth-verify" }
apeireth-core = { path = "../apeireth-core" }
apeireth-api = { path = "../apeireth-api" }
# R113: 真接 apeireth-graph (cognition summary → council deliberation context)
apeireth-graph = { path = "../apeireth-graph" }
# R115: 真接 apeireth-mcp (CouncilMember → MCP Prompt/ResourceServer)
apeireth-mcp = { path = "../apeireth-mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
# R159: council 接 g5 substrate (第 3 个生产调用方, 继 tool-runtime R132.4 + chat pipeline R157)
apeireth-pipeline-g5 = { path = "../apeireth-pipeline-g5" }

[dev-dependencies]
# R269: MultiModelAdvisorBackend tests impl LlmProvider trait (defined with #[async_trait])
async-trait = { workspace = true }

[lib]
name = "apeireth_council"
path = "src/lib.rs"

[[example]]
name = "council_demo"
path = "examples/council_demo.rs"

# R33-4-1: CouncilMember 多轮协商 deliberation demo (4 场景: keyword 兜底 / strong_disapprove / 模拟多 LLM / env-gated 真 MiniMax)
[[example]]
name = "council_member_deliberation_demo"
path = "examples/council_member_deliberation_demo.rs"

# R25 D-3: 3 advisor 协作任务 + reasoning trace 可视化 (per v2.0 strategy §2B 验收硬指标)
[[example]]
name = "trace_visualize"
path = "examples/trace_visualize.rs"

# R131 七强制 advisor 真接 LLM demo (env-gated APEIRETH_MINIMAX_LIVE_TEST)
[[example]]
name = "seven_advisors_live_demo"
path = "examples/seven_advisors_live_demo.rs"

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true

# R131.1 mini 验证: 5 连发 + 异步直跑
[[example]]
name = "r131_mini_live"
path = "examples/r131_mini_live.rs"

# R131.2 async 直跑 7-advisor (绕过 LlmAdvisorBackend::block_on)
[[example]]
name = "r131_seven_advisors_async"
path = "examples/r131_seven_advisors_async.rs"

# R131.3 collaboration 4 模式真接 LLM
[[example]]
name = "r131_collab_live"
path = "examples/r131_collab_live.rs"
