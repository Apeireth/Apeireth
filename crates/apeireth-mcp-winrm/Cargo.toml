[package]
name = "apeireth-mcp-winrm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R20 阶段 1: WinRM MCP Server (1:1 翻译 v0.9.21 商业版 out/main/mcp/WinRMMcpServer.js ~64KB)"
keywords = ["ai", "mcp", "winrm", "windows-remote", "agent"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# WinRM HTTP client (Windows Remote Management)
reqwest = { workspace = true }
# XML 解析 (SOAP envelope)
quick-xml = { version = "0.41", features = ["serialize"] }
# async runtime
tokio = { workspace = true }
# serialization
serde = { workspace = true }
serde_json = "1.0"
# error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# tracing
tracing = "0.1"
# async traits
async-trait = { workspace = true }
# base64 (Windows auth)
base64 = "0.22"
# shared MCP types
apeireth-mcp = { path = "../apeireth-mcp" }
apeireth-protocol = { path = "../apeireth-protocol" }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
mockito = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[example]]
name = "winrm_mcp_demo"
path = "examples/winrm_mcp_demo.rs"

# R19 第 0 阶段: workspace lint 继承
[lints]
workspace = true
