[package]
name = "apeireth-oauth"
# R21 借鉴 Golutra #2: 3 OAuth 模式 (authorization_code / implicit / client_credentials) +
# 3 Provider (claude-code / opencode / copilot) 1:1 翻译 (per analysis/golututra/BORROW_FROM_GOLUTRA.md
# §8 P2 第 8 项). 跟借鉴 #1+#3+#5+#6 1:1 镜像模式 (独立新 crate + 编译期 hardcode + 5 K-1 强校验
# + 8 TOOL_WHITELIST + 8 项不修改承诺). PKCE (RFC 7636 §4.2-§4.4) + state (RFC 6749 §10.12) 真做
# (sha2 + base64url + rand), 0 假 mock. 99 测试 (56 lib unit + 43 integration) + 5 K-1 强校验
# (validate_client_id / validate_redirect_uri / validate_scope / validate_pkce_verifier /
# validate_state). 0 真连商业版 OAuth 端点 (skeleton 阶段, R21+ 续真接 HTTP exchange).
# 0 触碰 24 LOCKED crate + 0 改 workspace version (1.0.0) + 6 哲学 anchor + 8 项不修改承诺.
# 跟借鉴 #1+#3+#5+#6 (apeireth-state / sandbox / credentials / cache) 1:1 镜像模式.
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Apeireth Team"]
license = "Apache-2.0"
repository = "https://github.com/apeireth/apeireth-rust"
description = "Apeireth R21 借鉴 Golutra #2: 3 OAuth 模式 (authorization_code / implicit / client_credentials, per RFC 6749) + 3 Provider (claude-code / opencode / copilot) 1:1 翻译. 跟借鉴 #1+#3+#5+#6 1:1 镜像 (独立新 crate + 编译期 hardcode + 5 K-1 强校验 + 8 TOOL_WHITELIST). PKCE (RFC 7636) + state (RFC 6749 §10.12) 真做, 99 测试. 0 真连商业版 OAuth 端点, 留 R21+ 续真接. 0 触碰 24 LOCKED crate + 0 改 workspace version (1.0.0) + 6 哲学 anchor + 8 项不修改承诺"
keywords = ["oauth", "oauth2", "pkce", "state-csrf", "authorization-code", "client-credentials", "skeleton"]
categories = ["authentication", "api-bindings", "asynchronous"]

# R21 借鉴 Golutra #2 skeleton: 借 std + sha2 + base64url + rand + thiserror (业界标准, 0 重复造轮子).
# 0 引 NewAPI (0 外部 RPC), 0 引 reqwest (留 R21+ 续真接 HTTP exchange), 0 引 tokio (skeleton 阶段 sync, 0 async).
[dependencies]
# PKCE code_challenge = base64url(sha256(code_verifier)) per RFC 7636 §4.2
sha2 = "0.10"
# base64url 编码 (state / PKCE 不可预测值, RFC 6749 §10.12 + RFC 7636 §4.2)
base64 = "0.22"
# 随机数 (state / PKCE code_verifier 生成)
rand = "0.8"
# 序列化 (3 Provider 配置 / 3 Callback mode / Token / State)
serde = { version = "1.0", features = ["derive"] }
# 错误处理 (OAuthError 派生, per sister #6 模式)
thiserror = "1.0"
# R23 P1 真接: 异步 HTTP client (reqwest). 默认 false 以保证 skeleton 运行轻量 + 0 隐型依赖 (cargo tree 不出 tokio 重变).
# 打开后: 5 K-1 强校验 同时完成 §4.1.3 token exchange 真接 与 3 Provider 端点 (api.anthropic.com / api.opencode.ai / github.com).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1.40", features = ["rt"], optional = true }
# JSON 序列化 (transport.rs post_token_form 返 serde_json::Value, RFC 6749 §5.1)
serde_json = { version = "1.0", optional = true }

[features]
# R24+ 默认打开 (今天未开 = skeleton 运行, 0 进行真 HTTP 请求)
default = []
real-http = ["dep:reqwest", "dep:tokio", "dep:serde_json"]

[dev-dependencies]
# serde_json (test + example 序列化验 ProviderKind / CallbackMode / OAuthState)
serde_json = "1.0"
# HTTP mock server (wiremock 0.6, 端到端测 device_code 真接 OAuth server polling)
# 跟 apeireth-lark / apeireth-sdk-livekit / apeireth-sdk-voice 1:1 模板
wiremock = "0.6"
# async test runtime (tokio full features for #[tokio::test])
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }

# 1 个完整 OAuth flow 例子 (per 任务 spec "1 OAuth flow 例子")
[[example]]
name = "oauth_flow_demo"
path = "examples/oauth_flow_demo.rs"

[[example]]
# R44 device_code HTTP polling demo (wiremock 模拟 OAuth server)
name = "device_code_http_demo"
path = "examples/device_code_http_demo.rs"
required-features = ["real-http"]

# R21 借鉴 Golutra #2: 复用 workspace.lints (per 任务 spec "workspace.lints 复用 (不重复造轮子)")
# Apeireth 业界 lints (wasmtime + qdrant 精选) 守门, 跟 24 LOCKED crate 保持一致
[lints]
workspace = true
