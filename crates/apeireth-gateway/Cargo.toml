[package]
name = "apeireth-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth OpenClaw-mode gateway: single long-lived daemon hosting multiple Node adapters (TUI/HTTP/Desktop/Mobile/CLI), Agent workspace, Skills, and DM access security. Borrows the 'single process, multi-LLM, multi-channel' architecture from OpenClaw, lifted to Rust with compile-time-guaranteed single-instance mode."
keywords = ["ai", "gateway", "openclaw", "multi-channel", "single-process"]
categories = ["api-bindings"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = "0.12"
tracing = "0.1"
axum = { version = "0.7", features = ["macros"] }
apeireth-core = { path = "../apeireth-core" }
apeireth-protocol = { path = "../apeireth-protocol" }
apeireth-runtime = { path = "../apeireth-runtime" }
apeireth-rate-limiter = { path = "../apeireth-rate-limiter" }
# R174 stage 6: Privacy Guard integration — PII detection + redaction at the gateway boundary
apeireth-guard = { path = "../apeireth-guard" }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
apeireth-bus = { path = "../apeireth-bus" }
apeireth-governance = { path = "../apeireth-governance" }
apeireth-plugin = { path = "../apeireth-plugin" }
apeireth-tool-registry = { path = "../apeireth-tool-registry" }
# Real-entry test wires the migrated canonical minimax provider through the
# gateway router against a mock HTTP server.
apeireth-provider = { path = "../apeireth-provider" }
reqwest = { workspace = true }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "apeireth_gateway"
path = "src/lib.rs"

[lints]
workspace = true
