body:
- attributes:
    value: 'Thanks for reporting a bug. Please fill out the template below — it helps
      us reproduce and fix faster.

      '
  type: markdown
- attributes:
    description: Output of `apeireth --version` or `cargo run -p apeireth-cli -- --version`
    label: Apeireth version
    placeholder: e.g. 1.1.0 (workspace semver)
  id: version
  type: input
  validations:
    required: true
- attributes:
    description: How severe is the bug?
    label: Severity
    options:
    - Critical (data loss / crash / 1.0 release blocker)
    - High (1.0 release 0-优先级)
    - Medium (post-1.0 fix)
    - Low (cosmetic / docs)
  id: severity
  type: dropdown
  validations:
    required: true
- attributes:
    label: Operating system
    options:
    - Linux (Ubuntu 22.04)
    - Linux (Ubuntu 24.04)
    - macOS (latest stable)
    - Windows 10
    - Windows 11
    - Other (specify in description)
  id: os
  type: dropdown
  validations:
    required: true
- attributes:
    description: Output of `rustc --version` and `rustup show`
    label: Rust toolchain
    placeholder: e.g. stable 1.81.0 / nightly-2026-08-01
  id: rustc
  type: input
- attributes:
    description: Minimal sequence to reproduce the bug
    label: Reproduction steps
    placeholder: '1. cargo build --workspace

      2. cargo run -p apeireth-cli -- chat

      3. Send message: "..."

      4. Observe: ...

      '
  id: repro
  type: textarea
  validations:
    required: true
- attributes:
    description: What you expected to happen
    label: Expected behavior
  id: expected
  type: textarea
  validations:
    required: true
- attributes:
    description: What actually happened
    label: Actual behavior
  id: actual
  type: textarea
  validations:
    required: true
- attributes:
    description: Paste `RUST_LOG=debug` output, stack traces, or screenshots
    label: Relevant logs / output
    render: shell
  id: logs
  type: textarea
- attributes:
    value: '## 0 触碰实查 (per [CONTRIBUTING.md §0 触碰实查](https://github.com/apeireth/apeireth-rust/blob/main/CONTRIBUTING.md))


      Run before submitting:


      ```bash

      # 0 改 24 LOCKED crate (24 个 crate: apeireth-{supervisor, agent, council, bus,
      protocol, mcp, tool-registry, tool-runtime, graph, pipeline, tool-approval,
      extension, evolution, api, core, memory, asi, tools, cli, bench, cognition,
      action, life-force, constraint})

      git diff main..HEAD -- crates/apeireth-{supervisor,agent,council,bus,protocol,mcp,tool-registry,tool-runtime,graph,pipeline,tool-approval,extension,evolution,api,core,memory,asi,tools,cli,bench,cognition,action,life-force,constraint}/

      # 必须 0 行

      ```

      '
  type: markdown
- attributes:
    description: Confirm no hard-locked items were modified
    label: 0 触碰实查确认
    options:
    - label: 0 改 24 LOCKED crate (mtime 实查)
      required: false
    - label: 0 改 workspace version (1.1.0)
      required: false
    - label: 0 改 R11 baseline 3 值 (V1141 / V1131 / V1136, in `apeireth-asi/src/lib.rs`)
      required: false
    - label: 0 改 7 LOCKED 文档 (per `docs/conventions/10-locked.md`)
      required: false
  id: locked_check
  type: checkboxes
- attributes:
    value: '## 6 哲学 anchor 影响 (per `docs/conventions/09-anchor.md`)


      - **S-1** 北极星导向: 跟 1:1 翻译 v0.9.21 商业版冲突吗?

      - **S-2** 实事求是: 实查 5 决策点 (loc / files / deps / hardcode / 0 触碰) 了吗?

      - **O-2** 走在前人肩上: 复用 std / tokio / 业界标准了吗?

      - **O-3** 干到底: cargo check 0 error + cargo test pass 了吗?

      - **O-4** 任何人都能接手: doc 顶部 30+ 行 + 编译期 hardcode 守门了吗?

      - **O-5** 不假装: skeleton 标 ⏳ + 不假装已实现了吗?

      '
  type: markdown
- attributes:
    label: 6 哲学 anchor 穿透
    options:
    - label: S-1 北极星导向 穿透
      required: false
    - label: S-2 实事求是 穿透
      required: false
    - label: O-2 走在前人肩上 穿透
      required: false
    - label: O-3 干到底 穿透
      required: false
    - label: O-4 任何人都能接手 穿透
      required: false
    - label: O-5 不假装 穿透
      required: false
  id: philosophy_check
  type: checkboxes
- attributes:
    value: '## 8 项不修改承诺影响 (per `docs/conventions/10-locked.md`)


      - ✅ 不假装已实现

      - ✅ 编译期 hardcode

      - ✅ 不改 LOCKED 24 crate

      - ✅ 不改 workspace version

      - ✅ 6 哲学 anchor 穿透

      - ✅ 不依赖 NewAPI

      - ✅ 不重复造轮子

      - ✅ 诚实标缺

      '
  type: markdown
description: Report a bug in Apeireth (Rust 92+ crate backend, 24 LOCKED + 9 organ
  + 5 重守门)
labels:
- bug
- triage
name: Bug Report
title: '[BUG] '
