    notes: "可由 Host API 组合；12 项真实实例测试覆盖并发、私有历史、预算、取消、模块自主创建及原生资源排水。不是桌面后台任务全面迁移，也不替代旧 SubLoop。；2026-10-28 生产收敛：请求使用共享服务的只读执行目录视图，模型等待期间不持控制读锁；热注册获得受限 ModuleAgents 端口，模块停止不影响主 Agent。PortableHost 已接线；桌面 Raw Runtime 和旧 SubLoop 的完整多实例迁移仍未完成，维持 IMPLEMENTED 口径。；2026-10-29 S1：SubLoop 路径为 PRODUCTION WIRED；规范化任务端口保留完整响应及本次 usage，父子身份/历史隔离、持久工具对、预算与 native drain 经真实 Runtime 验证。桌面 managed 默认及全部 Legacy 迁移仍未完成，整体维持 IMPLEMENTED，见 kernel-convergence-s1-2026-10-29.md。；2026-10-29 S2：生产与独立 ModuleInvoker 共用 SingleShot 任务策略，意外 tool_calls 原样返回但不执行；请求事实归 child 与真实注册 owner，来源关联父 request/trace，适配器无重复计量。共享预算、跨 turn/session、失败/取消、未知缓存与缺失 usage 的 fail-closed 已实测；原 with_module 的兼容 Host owner 留 S3，不抬升整体等级，见 kernel-convergence-s2-2026-10-29.md。；2026-10-29 S3：旧 builder 回调也绑定真实注册模块 owner 与世代，受原生命周期、内部 capability、父 scope 和模块 child grant 约束；原 SubLoop/Invoker 用量、预算与取消回归通过。未改桌面 managed 默认或旧数据 Profile 映射，不抬升整体等级，见 kernel-convergence-s3-2026-10-29.md。；2026-10-29 S4：子任务核对父 principal/epoch，旧 invoker、fork、reload、审批与后台整理不能复用替换后的 grant；Profile 切换取消旧执行，新 main 不继承旧缓存。runtime all-targets 与 profile_memory_authorization 通过；维持 IMPLEMENTED，S5 默认主入口未实施，见 kernel-convergence-s4-2026-10-29.md。；2026-10-29 S5：默认桌面 Host-owned main 使用现有 ManagedAgent；完整请求、流式、审批、CLI/gateway 和实际 heartbeat producer 共享同一 AgentRuntime/AgentId，历史按 Session 保留，用量在原实际边界记账后按身份汇总。Host 显式选择 SessionQuota，有限实例/共享预算仍默认拒绝未知用量；别实例 Session 认领、跨会话预算、阻塞 Provider 期间热控制/并发/关闭与原实例回归通过。该默认路径另有独立 PRODUCTION WIRED claim，宽泛本项维持 IMPLEMENTED，整体仍 Partial。 证据见 kernel-convergence-s5-2026-10-29.md。；2026-10-29 S6：兼容子执行经既有实例、Kernel 与 Dispatcher，未新增 Provider 后端或重复计量；真实 Runtime 验证多 child/round 复用 wire id 的独立事实、前端隔离、取消保账、native drain 后的持久 AgentTaskInterrupted 与重复 stop 幂等。新 reader 保留旧日志，新增变体不承诺旧二进制降级读取；pending 只表示最后 checkpoint 未闭合，不证明副作用回滚。原五段 gate_full 清理磁盘后重试通过；宽泛等级与默认不变，平台/性能及最终结论见 kernel-convergence-s6-2026-10-29.md。；2026-10-29 S6 Android 库复验：aarch64-linux-android 的 runtime 库 check/build 与 assembly no-default-features 库 check 均 exit 0，精确命令与日志见 kernel-convergence-s6-2026-10-29.md。仅库编译，无设备/JNI/UI/HARDWARE VALIDATED；冷启动目标未达，整体仍 Partial，能力等级与默认不变。；2026-10-29 D3：移除仅内部且无调用的 providers_arc；受管实例仍用原 gated router/执行视图，不把兼容 Host API 测试宣称新增生产接线；原实例回归随 workspace 主门禁通过。；2026-10-30 P2：新增可选 Host 监督服务与执行回执；原能力默认、Provider 路由与确定性权限机制保持，定向及原 MainOnly 测试/clippy/fmt 回归通过。未将兼容入口声明为已受 System One 保护，无 live model/硬件声明。；2026-10-30 P3：可选 owner-bound 消息复用 Registry/Dispatcher，委托交集与独立后台授权分离；真实 Runtime 定向及原 MainOnly test/clippy/fmt 回归通过。默认与既有等级保持，本地幂等非持久 exactly-once，新消息变体需新 reader；无 live model/硬件声明。；2026-11-07 抬级（生产装配接线）：缺口 = `ProductionModules::build` 造了 `MemoryCoordinator` 却**只喂行为模块**（召回/写回），从未构造 `MemoryModule` ⇒ 生产装配里 `module.memory` 不存在 ⇒ 7 个 `memory_*` 工具全未注册、`BeforeModelCall` 固定 Hook 不跑（既有测试能跑是因为测试自己 `with_plugin(MemoryModule)` = 假绿）。修法 = 新增 `canonical/memory_assembly.rs` 生产槽位（`production.rs:1484 wire(...)`，production.rs **净 -1 行** 1897→1896），让模块拿 `PluginContext.agents/tasks` 注入 ⇒ `memory_organize` 经 `organizer.rs` 用 `ModuleAgents::spawn_agent` 起**模块自有子 Agent**，子 Agent 用它自己的 Host grant 调工具。真跑 `memory_namespace_production` 3 passed：organize 回执 `{agent_id:…, status:scheduled}` + 子 Agent 真写成功。反证（口径 = **整个装配点摘除**，不是只删 `tool_modules.push`）：把 wire 调用换成不登记 ⇒ 3 个测试全红在 `ScopeDenied: requested tool is not registered`。⚠️ 边界：生产默认只注册**兼容 ABI**（`with_module_contract()` 是 Host 显式 opt-in，6 工具 Protected + System One 复核面）；**自动检索默认关**（`with_automatic_retrieval(false)` —— 开它会让既有不变量 `learning_does_not_pollute_the_primary_transcript` 由 2 条变 4 条，且生产另有 ProactiveRecallPolicy 这条显式召回入口）；无 organizer 跨重启恢复、无多 Agent 并发压测、无 live 模型/硬件。；2026-11-10 PR31 rebase 到 #94 之后复核：owned agents 四处回归通过（cognitive_module_abi / canonical_subloop / convergence_agents / memory_namespace_production）；本批 execution_view.rs 的运行时快照补 remote_port 字段（共享服务共享同一 Arc），owned agent 的归属与生命周期语义未变"

