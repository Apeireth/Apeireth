# 文档状态声明唯一真源（Docs Truth System · P0 试点）
#
# 规则：
# - 每条 claim = 一个"可核验的状态声明"；id 全局唯一、永不复用。
# - level 取四级口径：IMPLEMENTED / PRODUCTION WIRED / DEFAULT ENABLED / HARDWARE VALIDATED；
#   缺口用 NOT IMPLEMENTED。
# - sources 是证据文件；`scripts/docs_truth.py --verify` 会核对存在性，并用
#   `git diff <verified_at> -- <sources>` 计算 STALE（源码动过而 verified_at 未更新 = 过期）。
# - switch_env 非空时 verify 会核对 env 常量在 crates/ 中存在。
# - verified_at 必须是 commit hash；**改完对应源码后必须更新它并跑 verify**。
# - 生成物 docs/status/STATUS.md 由 `--gen` 产出，禁止手改。
#
# 0 装口径：没有证据的声明不写在这里；grep 不到的写进 notes 而不是假装验证。
