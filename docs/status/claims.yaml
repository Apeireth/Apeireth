    notes: "总指挥 2026-11-05 登记（外部审计 P0-2 的连带残留）。前批已在 fetch **产出输出处**写下 `prompt_injection` 标记（fetch.rs:54/489，用治理面**同一个**启发式 `PromptInjectionHeuristic`）⇒ 但**全仓无任何消费者** ⇒ 治理面的 `input_security.prompt_injection` 只扫**入参**（`Action::CapabilityDispatch` 的 arguments）⇒ ⇒ 「间接提示词注入」在治理管线里没有落点。本条 = 回合层在 `HookPoint::AfterToolResult`（工具结果刚进 transcript 之后、下一次 completion 组装之前）读该标记 ⇒ 通过 `ModuleOutcome::with_system_overlay` 投影进**下一次 provider 请求**（模型真的看得见）⇒ 并落 session 事件审计面；告警账（计数 + 有界记录表 256 条）经 `ProductionModules::prompt_injection_report()` 暴露。⚠️ **恒不阻断**（directive 恒 `Continue`，已单测钉住）⇒ 「命中即拒工具结果」是独立的产品决策。⚠️ 告警措辞**固定**（逐字复用 `FETCH_PROMPT_INJECTION_WARNING`）⇒ 敌意载荷无法「说服」告警本身。⚠️ 与治理面的入参扫描**互补不重叠**（入参扫「模型要调什么」，输出侧扫「远端给模型看什么」）。；2026-11-08 W1 波次复核：本批在生产装配根**新增 4 族注册**（进程树快照 / HTTP 写面 / 互联网检索 / 主人日程，均默认关）+ 名册与策展表扩充 + CLI 组合根新增 env 段与授权钩子；**本声明所指的既有能力，其注册条件与执行路径逐字未动** ⇒ 口径不变。"
