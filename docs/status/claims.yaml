      - crates/capabilities/tools/src/accountability_view.rs
      - crates/foundation/governance/src/authorization.rs
      - crates/adapters/cli/src/egress_command.rs
    verified_at: 5adc04932552c5788255716b721a29de5a0137d9
    verify_cmd: "cargo test -p apeireth-runtime --lib egress && cargo test -p apeireth-runtime-assembly --lib egress_gate"
    owner: runtime
    next_review: "2026-12-01"
    notes: "第 5 条边界（模型上下文→provider）已接判定点：检出 PII→真值换不可逆占位；闸不可用→拒绝即帧（fail-closed）。默认 OFF（脱敏改写请求内容=行为变化，非'更安全的默认值'）。**回程还原已接**（双闸的闸二）：只还原本会话登记簿登记过的指纹，未登记占位照实留痕；还原只在受控回程面，对出境面不可逆。**出域账本已接**（零真值 append-only JSONL：对象类型/不可逆指纹/目的地/用途）+ CLI 出口 `apeireth egress ledger`（只读；账本若无人可查，「记录已知流向」就是空的）。**授权策略对象已接**（`apeireth_governance::authorization`：可携带/可委托/可过期/可追溯；委托只能收窄、过期即失效、内容指纹可追溯）：按用途授权（资源 `egress`，scope 装用途名如 `chat`），未授权即拒绝出网（fail-closed），授权写坏不装配闸并 stderr 报错。；2026-10-27 KC-1 复核：runtime.rs/CLI 改动为通用 ToolCompletionObserver 端口与装配拆出，本 claim 语义与权限边界未变（实测见 b419826c 正文）；2026-10-27 KC-2 复核：runtime.rs 新增控制命令/插件工具同名启动期拒绝，本 claim 语义未变（实测见 75ee2464 正文）
**问责闭环五步全部 PRODUCTION WIRED**（ADR-0014 §5）：
①影响声明 + 事实→行动索引（零真值）——`egress_gate.rs` 三条出网路径各写一条 + CLI `egress impact` 读出端；
②决策回执 —— **生产调用方 = `apeireth egress impact` 用 `DecisionReceipt::from_statement` 渲染**；
③后果追踪（`unknown` 是一等公民，append-only 不改写历史）——`egress_gate.rs` 挂 tracker + 写账本 + `egress outcome` 回填；
④通知义务 —— **生产调用方 = `apeireth egress notify <FACT_ID> <wording|partial|refuted>`**（查影响 → 生成待办，**不自动外发**、不被引用就不打扰）；
⑤自述面 `capabilities.accountability` —— 探测口接进 `ProductionBackends.self_status_accountability` + CLI 装配根。
**沿革（如实记，不掩盖）**：2026-10-24 自查发现 ②④⑤ 此前**只有库级实现 + 测试调用、生产零调用**（被 `audit_unwired.py` 抓出 —— 而它此前自己也没接电，见该脚本 docstring）；同日已全部接上真实调用方，并新增 CI 棘轮 `.github/workflows/unwired-ratchet.yml` 防回归。
**读出端已接**：出域账本 `apeireth egress ledger`（观测面）+ 问责账本 `apeireth egress impact`（责任面：授权/可逆性/影响谁/后果）。
**后果回填通道已接**（`apeireth egress outcome <ACTION_ID> <confirmed|failed>`）：用户/回执渠道显式回填，系统不猜（只接受 confirmed/failed）；状态机把关（已确认的事实不能退回）；后果账本 append-only 持久化（`consequence-ledger.jsonl`）。**仍未接**：回执渠道的**自动**回报（当前只能用户手动回填）。；2026-10-28 Phase 3 复核：单一工具目录/上下文接线未改变出网闸与 Provider 边界，原出境治理/账本回归随全量门禁通过；默认仍 OFF，未声称自动外发或自动回执已接。"

