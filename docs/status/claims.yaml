      四级口径：**PRODUCTION WIRED**（接入 canonical 运行时主路径）｜DEFAULT ENABLED 不成立（默认关，开关 `APEIRETH_ENABLE_MCP=1`）｜**HARDWARE VALIDATED 整体口径仍不成立**（⚠️ **但已不是「完全没有真机证据」**）：**2026-11-07 起，四环（发现 / 登记 / 授权 / 派发）已在真第三方 stdio MCP 服务器上端到端成立**（实测：207 个真工具被发现并命名空间化 / 有界收敛真触发（58 条超长描述截断 + 25 个超深 schema 压深）/ 族授权 + **逐次人批真挂起** / 服务器自己的答案进模型上下文）⇒ ⇒ **未覆盖 5 类性质**（真 server 物理上不产生这些帧）：**传输面 30 s 截止** / **SSE·http 传输** / **服务器主动通知帧** / **`tools/list` 分页** / **断线自愈重连 + 重发现** ⇒ ⇒ 距整体成立还差这 5 项。
      2026-11-06 合并批（双方能力取并集）：两侧的 MCP 能力现在**同时在**生产装配路径上，证据分两摊。
      **本线侧（族授权 + 逐次人批 + 有界收敛 + 周期刷新 + 结果面绊线）**：①发现 `crates/capabilities/tools/src/mcp_bridge/bridge.rs` 的 `McpToolBridge::refresh()` 有生产调用点（组合根 `crates/adapters/cli/src/external_tools.rs`）；②登记 `crates/engine/runtime/src/canonical/runtime.rs` 的 `Runtime::register_dynamic_tool()` 有生产调用点（`crates/engine/runtime-assembly/src/canonical/external_tool_bridge.rs` 的 `RuntimeExternalToolRegistry::register`）⇒ 进运行时能力表，`tool_declarations()` 自动带上 `mcp:<server>:<tool>`；③授权 —— 族授权底座（`crates/foundation/governance/src/permission.rs` 的 `grant_family` / `require_approval_for_family` / `decision_for_capability` 族兜底）+ MCP 族审批地板（`crates/engine/runtime-assembly/src/canonical/permission_preset.rs` 的 `human_approval_floor_applies`）⇒ MCP 族一律逐次人批、`full` 预设不豁免（族根 `tool.mcp`，段边界判定，`tool.mcpsomething` 不命中）；④派发 —— `find_by_name` 按 `declaration().name` 命中动态工具。
      **对方线侧（资源工厂 + 身份撞车 + ASI-01 + 代际/描述符回执 + 进程收容）**：⑤**能力身份撞车修复**（`crates/capabilities/tools/src/mcp_bridge/catalog.rs`：一个能力身份只承载一个工具 ⇒ 授权其一即授权其二；撞身份的登记 / 刷新一律拒）；⑥**ASI-01 提示词注入防线**（`crates/foundation/governance/src/tool_desc_audit.rs` 的 `ToolDescAuditor`；`catalog.rs` 的 `audited_description` / `audit_diff` 调用 ⇒ 描述投毒拒登记、注册后静默换描述被拒）；⑦**模块热代/生产监管**（`crates/capabilities/tools/src/mcp_bridge/definition.rs` 的 `McpDefinition` 资源工厂 + `module.rs` 的 `McpPlugin`：每次激活 = 新代际 `ModuleInstanceId` + 新 `ModuleTaskScope`，旧代际撤销即不可调用；`tool.rs` 的**描述符回执**随审批载荷冻结（`MCP_FROZEN_VERSION = 2`），恢复调用时与活描述符逐项比对，不符即拒）；⑧**进程收容**（`crates/capabilities/tools/src/mcp_bridge/process_owner.rs`：unix 进程组 / windows JobObject 绑定与终止）。
      **两侧合流点**：`crates/engine/runtime-assembly/src/canonical/production.rs` 同时注册资源工厂形态（`McpDefinition`，production.rs:1389）与本线的登记账袋（`McpModule`，production.rs:867），共用同一个桥（`production_mcp.rs` 的 `mcp_bridge()` 访问器）⇒ 不重复连进程；组合根 `crates/adapters/cli/src/lib.rs:1766-1767` 在装配后接上本线四环（`wire_at_startup` + `spawn_periodic_refresh`）。
      **live 实测（2026-11-05 实跑）**：`APEIRETH_ENABLE_MCP=1` + 可达 stdio 服务器 ⇒ stderr `[external-tools] wired: 1 registered, 0 unregistered, 1 live`；开关关 ⇒ 不装配；开关开 + 服务器不可达 ⇒ stderr `[external-tools] discovery failed: …` 且启动不中断。
      **声明面/结果面已做有界收敛**（`crates/capabilities/tools/src/mcp_bridge/redaction.rs`：描述 ≤500 字符、schema 深度 ≤8 / 属性 ≤64、结果正文 ≤64 KiB、控制字符清洗复用治理既有字符类）—— 第三方原文不再裸奔进模型。
      **周期刷新 + 重连后能力表重登已落地**（`external_tool_bridge.rs` 的 `refresh_outcome` 逐服务器隔离 / `apply_external_tool_report` 先撤后登 / `spawn_external_tool_refresh`，默认 60s、程序化配置无 env 旋钮、**首拍延后一周期**）—— 不可达服务器不产出增量（不误撤），同 id 同模型面名重复登记幂等。
      **传输面**：`transport.rs` 的 `RESPONSE_TIMEOUT = 30 s`（一次响应等待的截止，与桥的 `DEFAULT_CALL_TIMEOUT_MS` 同档）、坏帧/裸帧**可观测**（`note_malformed_frame` 计数 + 节流 stderr）、SSE `retry:` / `id:` 真被消费（`connection.rs` 的 `observe_stream_hints` → `crates/foundation/plugin/src/mcp/reconnect.rs` 的 `ReconnectState::observe_frame` ⇒ 服务端重连提示与 Last-Event-ID 生效）。
      **名册口径已归位**：`mcp` 行 = 实际登记进运行时能力表的外部工具件数 ≥ 1（`crates/engine/runtime-assembly/src/canonical/self_status_roster.rs`）⇒ 旧口径「服务器列表已加载」不再冒充「MCP 工具可用」；`mcp_bridge` 行 = 桥面已装配（配置面事实，与件数无关）。
      **遗留（如实）**：① 结果面的内容级凭据识别**已接** —— 外部工具族的结果面与错误面走 `ToolGuardrail` 的 **`EgressSweeper::sweep`**（`guardrail.rs:718` 的包装器，内部即 `sweep_output_for_egress`；占位族脱敏 + 凭据绊线单向标签，**不新增处置语义**）⇒ ⚠️ **准确表述**：**凭据形状绊线的内核 `scan_and_sanitize_output` 另有一个生产消费者 = shell**（`shell.rs:634/637`）⇒ ⇒ 出网清扫（`EgressSweeper`）**只覆盖外部工具族**、而**凭据形状绊线覆盖 shell + 外部工具族两族** ⇒ ⇒ 缺口应表述为「**其它工具族未接凭据形状绊线**」（2026-11-07 盘点实测：26 族中 **默认开却零凭据形状绊线 = filesystem / search / repo** 三族）⇒ ⇒ **不能**声称「所有工具输出已脱敏」；② deny 闸的**配置面封禁**已落地（`McpServerSpec::deny_tools`）⇒ 被封工具不入目录、不入登记面，deny 压过只读预设 / allowlist / 族授权；但**主人可见的「当场拉黑」面仍不存在**（改配置文件 + 重启生效，库 API 有、主人面无）；③ 名册不独立复核「族授权 + 逐次人批已就位」⇒ 只报可观测代理「已登记 ≥1」；④ 工具数 N 本身不在名册（`CapabilitySwitch` 只有布尔）⇒ 计数面在接线日志（stderr）；⑤ 真服务器端到端 —— **2026-11-07 已实测 stdio 子集**（见上「四级口径」段：四环成立 + 5 类性质未覆盖）⇒ ⇒ 整体 HARDWARE VALIDATED **仍不成立**（差那 5 类）；**升级判据（2026-11-07 可得性审计后修订）**：**⚠️ 审计把「缺证据」与「缺实现」拆开了 —— 后者才是天花板**：**性质 5（掉线自愈重连 + 重发现 + 一次重试）可达 A 级**（真第三方服务器进程被真 SIGKILL ⇒ 真掉线）；**性质 1（30 s 截止 + `timeout.*`）可达 B 级**（靠调用方参数让真服务器挂起；实测真服务器 ≈30.6 s 才回）；**性质 2b（SSE 事件流）最高 C 级**（第三方生态不提供遗留 SSE 端点公告 ⇒ 只能经 stdio→SSE 代理 ⇒ **降级**）；**性质 2a（http 直答）先决条件未满足 —— 桥的 http 面必 406**（桥不发 `Accept`，客户端默认插 `Accept: */*`，规范 streamable-http 服务器要求 `Accept` **同时**含 `application/json` 与 `text/event-stream` ⇒ **这是「实现不兼容」，不是「缺证据」**；另：桥不管 `Mcp-Session-Id` 会话头、不发 `MCP-Protocol-Version`）；**性质 3（通知帧）与性质 4（`tools/list` 分页）在本机达不到 A 级 —— 桥侧零实现**（`nextCursor` 全仓零命中、桥发 `tools/list` 不带 cursor 且只读 `tools` ⇒ 分页被静默忽略；桥从不发 `_meta.progressToken`、从不声明 `tools.listChanged`、服务器帧只计数丢弃 ⇒ 无通知消费路径）。**修订后的判据（三段式，缺一不可）**：**第 0 条前置闸「桥侧对应机制存在」**（分页 = 发 cursor + 消费 `nextCursor`【当前不存在】；通知消费 = 发 progressToken + 声明 listChanged + 有消费路径【当前不存在】；http = 合规 `Accept` + 会话头【当前不合规】；sse = 会等 endpoint 公告【已存在】）⇒ **闸不过 ⇒ 该性质记「不可达（实现缺口）」，不进整体口径分母** ｜ ① http 直答（**先补 Accept 头**，否则记「实现不兼容」并写明拒绝码，**不无限期挂账**）② sse 事件流（**允许 B 级入账但须标注触发方式**）③ 通知（拆 **3a** 真通知帧下不崩/可计数【可取证】与 **3b** 消费 progress 与 `list_changed` 并刷新目录【当前 0 装】⇒ **整体口径只认 3b**）④ 分页（拆 **④a** 桥侧实现存在【当前不成立 ⇒ 整条记「前置未满足」】与 **④b** 真实分页服务器证据）⑤ 掉线自愈（**A 级可达**）⑥ **第二个**第三方 server（把「样本量 = 1」降级）⑦ **可复核性**：第三方服务器清单登记（性质 ↔ 服务器 ↔ 触发方式 ↔ 等级 A/B/C/D ↔ 证据命令 ↔ 日期；**代理/包装触发必须显式标 C/D**）。**⇒ 结论口径三段式**：「**N 类可达 / M 类被实现缺口硬挡 / K 类被第三方生态缺位**」⇒ **当前 = 1 类 A 级可达 / 2 类实现缺口硬挡（通知 3b、分页）/ 2 类生态缺位或降级（sse、http 待补头）**；⑥ **桥内闸仍是桥内自建策略**（生产装配走 `McpDefinition::new` → `McpToolBridge::new`，不是共享生产策略 `new_with_policy`；`external_tool_bridge.rs:53` 的同一句仍属实）⇒ 授权裁决仍在运行时治理链（族授权 + 逐次人批），桥内闸只做 deny-only。
      **2026-11-07 真机暴露的 3 个缺陷已修**（`be61023d`）：① **传输截止不跟随桥的截止**
      （`transport.rs` 原以 30 s 硬编码 ⇒ 不跟随 `McpBridgeOptions::call_timeout_ms` ⇒ 桥的截止 > 30 s 时
      **传输先触发**、分类退化成 transport/retryable ⇒ **与同文件不变量注释相反**）⇒ 改为
      `response_deadline_for_call(call_timeout_ms)` = max(桥截止 + 500 ms 余量, 握手层 30 s)，
      经 `SpecChannelFactory::with_response_deadline` 下发到 stdio/http/sse 三面 ⇒ **传输永不比桥更严**；
      ② **真 server 的结构化结果被静默丢弃**（`ToolCallResult` 只有 `content` + `is_error` ⇒ serde 忽略
      未知字段 ⇒ `structuredContent` 到不了模型面）⇒ 增 `structured: Option<Value>`（`serde(default)` ⇒
      **旧形状不变**）⇒ 先摘载荷再容错改写（**服务器自己的数据键绝不被改名**）⇒ 进模型面 ⇒
      **过出口清扫**（结构化负载里的凭据也被改写）+ **过有界收敛**（64 KiB / 深 8 / 成员 64 / 节点 512）⇒
      **新通道不是新的泄漏面、也不是新的绕过面**；③ **stdio 的服务器主动通知被静默丢弃**（`id` 为 `None`
      ⇒ `route()` 静默丢、不计数不记日志 ⇒ 运维面零痕迹）⇒ 增「未路由帧」计数 ⇒ 与 SSE 面**口径对齐**。
      **裁决记录**：手写 `impl Eq for ToolCallResult` **保留**（JSON 表达不出 NaN ⇒ derived `PartialEq`
      自反 ⇒ `Eq` 标记可靠；去掉它对要求 `Eq` 的下游是破坏性变更）｜模型面键名用 `structured`
      **保留**（与既有 `text` / `content` / `is_error` 的短名风格一致；线上仍是 `structuredContent`）｜
      `WIRE_KEY_MAP` 的 `structured_content` 条目**保留**（载荷在改写前已摘出 ⇒ 当前是死条目，
      但它表达「两种拼写都合法」的意图）｜dev-dependency 的 `tokio` 开 `test-util` **接受**
      （暂停时钟用；**0 新包**、lock 未变、`--locked` 可过）｜`external.rs` 的 nmap 例曾因并行负载
      抖红一次（`Text file busy` ⇒ **产物竞争**，与本能力无关）⇒ **不单独处理**。
      **⚠️ 合并后一处旧表述已过时（请主代理裁决，本批未改任何源码）**：`crates/capabilities/tools/src/mcp_bridge/mod.rs:49` 仍写「**生产未接线**：发现 / 登记 / 授权三环零生产调用点 ⇒ 生产只构造桥与模块袋，0 个外部工具进模型工具目录。」—— **已不属实**：合并后两侧都在 `production.rs` 注册（`McpModule` 登记账袋 production.rs:867 + 资源工厂 `McpDefinition` production.rs:1389），组合根 `crates/adapters/cli/src/lib.rs:1766-1767` 真接发现/登记/授权四环，外部工具真进 `tool_declarations()`。建议把该行改写为：「**生产已接线**（2026-11-06 合并后）：发现 / 登记 / 授权三环均有生产调用点 —— 组合根 `crates/adapters/cli/src/external_tools.rs`（`wire_at_startup` + `spawn_periodic_refresh`）→ `crates/engine/runtime-assembly/src/canonical/external_tool_bridge.rs`（发现 → 撤销 → 登记 → 族授权）⇒ 外部工具进运行时能力表（`tool_declarations()`）；装配面 `crates/engine/runtime-assembly/src/canonical/production.rs` 注册资源工厂形态（`McpDefinition`）与登记账袋（`McpModule`）各一份 ⇒ 不重复连进程。**遗留**：桥内闸仍是**桥内自建策略**（`McpToolBridge::new`），不是共享生产策略（`new_with_policy`）。」
      **⚠️ 合并后两条红测（2026-11-06 实测）**：合并引入的描述符前置校验（`connection.rs` 的 `call_tool_checked` 比对 `discovered` 描述符）把两条**夹具自造条目**（`input_schema: None`、未先发现）的用例前置拒掉：
      - `crates/capabilities/tools/tests/mcp_deny_guard.rs` 的 `a_denied_tool_stays_denied_after_a_reconnect` **FAILED**（`the disconnect recovery must have run`，mcp_deny_guard.rs:493）⇒ 「deny 后重连仍被封」这条**当前无通过用例覆盖**（断言在重连计数处就断了，后面的「不得被重新采纳进目录」断言未跑到）；
      - `crates/capabilities/tools/tests/mcp_result_egress_sweep.rs` 的 `the_sweep_ledger_records_the_hit_without_the_true_value` **FAILED**（`tool descriptor changed; registry refresh and new authorization required`，mcp_result_egress_sweep.rs:366）⇒ **结果面脱敏账本（`sweep` 侧车）这条当前无通过用例覆盖**；
      两处的**生产路径**未证伪：同批实测 `crates/capabilities/tools/tests/mcp_bridge_e2e.rs`（28 passed，真经目录条目 invoke）与 `crates/engine/runtime-assembly/tests/mcp_bridge_runtime_e2e.rs`（4 passed，走 canonical 运行时）全绿 ⇒ 生产侧条目带真描述符，前置校验放行。**建议**：把两处夹具改成走目录条目（`bridge.catalog().get(...)`）或先 `refresh()` 再取条目；本批未改任何源码/测试。
      **本批实测（2026-11-06）**：`cargo test -p apeireth-tools-canonical --locked --lib mcp_bridge` ⇒ 43 passed / 0 failed；`--test mcp_bridge_e2e` 28 passed；`--test mcp_deny_guard` 13 passed / **1 failed**；`--test mcp_result_egress_sweep` 8 passed / **1 failed**；`--test mcp_malformed_frame_observability` 2 passed；`--test mcp_sse_frame_consumption` 8 passed；`--test mcp_transport_response_deadline` 8 passed；runtime-assembly `--test mcp_bridge_refresh` 10 passed、`--test mcp_refresh_first_round` 2 passed、`--test mcp_bridge_runtime_e2e` 4 passed、`--test production_mcp_factory` 1 passed、`--test convergence_mcp` 7 passed；cli `--test mcp_cli` 20 passed。

