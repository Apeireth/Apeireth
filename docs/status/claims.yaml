    notes: "① 接在：装配根 install_bio_modules 注册 BioAssemblyModule（canonical/cognitive.rs），APEIRETH_ENABLE_BIO_REPAIR_GUIDANCE 只认 \"1\"；生产装配**不注入** RepairPlan（install_bio_modules 只注入 context budget）⇒ 修复指令块在生产实际未产出；自述侧 SocialRepairObservationSource 订阅 NervousBus 的 ApprovalSocial::Rejected 并只读折算修复计划。② 自述在：capabilities.bio_mechanisms 的 social_repair 格（BioMechanismKind::SocialRepair，经 fill_social_repair 迟绑定同源观测源）+ 聚合面 capabilities.nervous_system 的 SG-20.social_repair 行。③ ⭐ **2026-11-07 口径裁决：降级 PRODUCTION WIRED ⇒ ⇒ IMPLEMENTED**（主指挥拍板）：本条**标题点名的能力 = 产出提示词修复指令**，而生产装配**不注入** RepairPlan（`with_repair_plan` 全仓只在 tests 出现 ⇒ ⇒ 生产产出点 = 0）⇒ ⇒ ⇒ **标题点名的能力在生产没有路径** ⇒ ⇒ ⇒ 故不得记 PRODUCTION WIRED。⚠️ **与 `bio.ritual` 的区别（不是同一回事）**：ritual 标题点名的是「关怀完成面」，而 `tool.ritual_done/skip` **确实在生产注册并落盘** ⇒ ⇒ 它的「半程」只是**下游消费者**没接；⇒ ⇒ ⇒ ⇒ social_repair 的「半程」**正是标题点名的那个能力本身** ⇒ ⇒ ⇒ ⇒ 故降级。⇒ ⇒ ⇒ 判据统一为：**四级口径判的是「标题点名的能力」，不是「模块装配了没有」**⇒ ⇒ ⇒ ⇒ （与 `mem.registered_namespace` 同一判据）。③ 边界：会话事件源未接（UncertaintySignal 采集未接，plan_repair 只能由调用方显式注入；nervous_snapshot.rs 记 session_event_source = not_wired）；观测格只读，不改行为。；2026-11-07 抬级（行为面接线）：缺口 = `BioAssemblyModule` 是装配期构造一次的长寿模块，而 `RepairPlan` 是**回合间事件**（人工拒绝）的产物 ⇒ plan 只能在装配期取快照（恒 None）⇒ 生产修复指令块产出恒 0。修法 = **共享槽**：写侧 `SocialRepairObservationSource::record_rejection()`（NervousBus 的 `ApprovalSocial::Rejected` 订阅回调）写槽；读侧 `ObservedBioAssemblyModule::on_hook(TurnStart)` 每回合读槽，有计划时用**同一组输入**重放装配（唯一差别 = repair_plan）⇒ 既有链路渲染出 `[交互修复指令] … [/交互修复指令]`；关档不构造订阅者/不注册模块/不拿锁（零变化零读取）。生产调用点 `production.rs:1661 → install_bio_modules` 未改。真跑：新 3 例（拒绝 → 次回合恰 1 块且含 `acknowledge_uncertainty`；关档人为填槽仍 0 overlay；槽写读同源）+ 既有 19 例全绿；原 verify_cmd `bio_cognitive_wiring` 11 passed。反证两条（已贴红）：去掉**写槽** ⇒ 行为测试红；去掉**读槽** ⇒ 同一测试红。⚠️ 边界（不标题党）：该块由 Runtime 以 **untrusted V1 数据**送进请求、**不是 system 权威**；事件源目前只有「人工拒绝审批」一条（`plan_repair` 其它 `UncertaintySignal` 变体仍未驱动）；计划由 organ 固定规则表确定性算出（不推断动机）；需 `APEIRETH_ENABLE_BIO_REPAIR_GUIDANCE=1` 才开；无 live 模型/硬件 E2E。（另：为不触尺寸棘轮，把 `bio_production_wiring.rs` 里 ~668 行既有测试**原样搬**进 `bio_production_wiring/tests.rs`，父文件 1238→812，基线同步收紧。）"

