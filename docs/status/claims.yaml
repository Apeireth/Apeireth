    # **apeireth-memory 整个 lib 单测**（944 条 + 1 ignored）⇒ ⇒ 而本条真正相关的
    # 只有 `retrieval_pipeline.rs` 的 33 条 + `coordinator.rs` 的 17 条
    # ⇒ ⇒ ⇒ 其余 894 条任一红 ⇒ ⇒ **本条就红** ⇒ ⇒ 「捎带别人的红」
    # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ **收窄到本条自己的两个 source**
    # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ 与兄弟声明同形
