  - id: sec.credential_endpoint_binding
    title: "凭据 ↔ 端点绑定（凭据只发往 audience ∪ 显式绑定内的端点；运行时换端点默认拒绝）"
    level: PRODUCTION WIRED
    default: "ON"
    switch_env: null
    sources:
      - crates/engine/provider/src/endpoint_binding.rs
      - crates/engine/provider/src/canonical_anthropic.rs
      - crates/engine/provider/src/canonical_minimax.rs
      - crates/engine/provider/src/canonical_openai_compatible.rs
      - crates/foundation/plugin/src/credentials.rs
      - crates/foundation/credentials/src/hot_store.rs
    tests:
      - crates/engine/provider/tests/endpoint_binding.rs
    verified_at: a9d689ed8f095975e9210ad54b7b67dfcf44f3fa
    verify_cmd: "cargo test -p apeireth-provider --test endpoint_binding --locked"
    owner: provider
    next_review: "2026-12-01"
    notes: "2026-11-01 安全审计 P1 的设计落点：凭据与端点是两份独立配置，只改端点那一份会把旧凭据发给新主机。判定（并集口径）：允许集合 = audience（构造时确定）∪ 显式绑定（凭据库维度：HotCredentialStore::set_with_endpoints；admin 同笔提交 base_url+api_key 时自动登记）；两者皆空则不拦截，否则端点不在集合内即拒绝。audience：厂商 provider（anthropic/minimax）的 from_env() = {厂商默认端点} ∪ {启动时配置的端点}；协议族 provider（openai-compatible）= **空**（端点本就由部署方选，且 admin 的合法热更新必须能工作）。⇒ 真正被挡住的是**运行时**换端点（admin 热改 base_url / apply_hot_config）：新主机不在允许集合里 ⇒ 拿不到凭据。校验点在 resolve_key 取密钥之前 ⇒ 未绑定的端点根本取不到凭据；错误里只有端点与凭据名，没有凭据内容。残余边界（如实）：① 绑定是部署方的显式声明，不是密码学证明，防的是「只改端点就泄漏」，不防能同时改端点与声明的对手；② 启动时的端点配置不拦（同一份配置里也放着凭据，能改它的人本来就能读到凭据）；③ 协议族未声明绑定时不拦（否则打死自建端点与 admin 热更新）—— 想要保护就显式声明绑定；④ 绑定只活在进程内（OS keyring 的值模型没有附加元数据的位置）⇒ 重启后需重新声明。"

