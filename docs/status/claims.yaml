    notes: "2026-11-08 接入生产（主指挥批），**默认关**。配置面 `shadow.json`（StoredDoc 信封、deny_unknown_fields、失败闭合）：**缺失 ⇒ 不构造任何东西**（逐字节零行为变化、零新增文件）；**坏配置 ⇒ 拒绝装配**（不许被当成「没配置」）。影子两侧都是**真生产路径**（现役 coordinator vs 另建 coordinator，同一批只读库、只差排序旋钮）⇒ 影子**物理上碰不到现役实例**；报告里**没有答案字段**（影子纪律在数据结构上就成立）。三道闸：裁决（只放 `Approved`/`ApprovedWithGain`）→ 回退速度（`rollback_ms < switch_ms` ⇒「可回退」是假的就不许切）→ 样本充分（≥2 轮且 ≥10 题）⇒ **任一不过 ⇒ 什么都不做**（指针逐字不变、不落盘、如实返回是哪道闸 + 带数字）。切换走仓里既有的 `GovernanceChain`（不自造审批）。⚠️ 边界：① **装配根当前没有治理链句柄 ⇒ 传 `None` ⇒ 切换必被拒**（失败闭合，刻意）；② 切换的是**启动时**读的排序旋钮（**刻意不做热重载**），**「已切换」≠「已生效」**（中间有一次重启）；③ **无工具面/CLI 出口** ⇒ 目前只能程序内调用（本条最明确的缺口）；④ 候选侧只覆盖「重排旋钮」这一类变体（没做「换召回算法」）；⑤ 探针题要运维自己给（没有探针 ⇒ 裁决必然拒绝：没证据 ≠ 没变差）。反证：把装配短路成永远 `Ok(None)` ⇒ 8 个用例里 **6 个变红**。"

