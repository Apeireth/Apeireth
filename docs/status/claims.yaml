    notes: "第 5 条边界（模型上下文→provider）已接判定点：检出 PII→真值换不可逆占位；闸不可用→拒绝即帧（fail-closed）。默认 OFF（脱敏改写请求内容=行为变化，非'更安全的默认值'）。**回程还原已接**（双闸的闸二）：只还原本会话登记簿登记过的指纹，未登记占位照实留痕；还原只在受控回程面，对出境面不可逆。**出域账本已接**（零真值 append-only JSONL：对象类型/不可逆指纹/目的地/用途）+ CLI 出口 `apeireth egress ledger`（只读；账本若无人可查，「记录已知流向」就是空的）。**授权策略对象已接**（`apeireth_governance::authorization`：可携带/可委托/可过期/可追溯；委托只能收窄、过期即失效、内容指纹可追溯）：按用途授权（资源 `egress`，scope 装用途名如 `chat`），未授权即拒绝出网（fail-closed），授权写坏不装配闸并 stderr 报错。；2026-10-27 KC-1 复核：runtime.rs/CLI 改动为通用 ToolCompletionObserver 端口与装配拆出，本 claim 语义与权限边界未变（实测见 b419826c 正文）；2026-10-27 KC-2 复核：runtime.rs 新增控制命令/插件工具同名启动期拒绝，本 claim 语义未变（实测见 75ee2464 正文） **问责闭环五步全部 PRODUCTION WIRED**（ADR-0014 §5）： ①影响声明 + 事实→行动索引（零真值）——`egress_gate.rs` 三条出网路径各写一条 + CLI `egress impact` 读出端； ②决策回执 —— **生产调用方 = `apeireth egress impact` 用 `DecisionReceipt::from_statement` 渲染**； ③后果追踪（`unknown` 是一等公民，append-only 不改写历史）——`egress_gate.rs` 挂 tracker + 写账本 + `egress outcome` 回填； ④通知义务 —— **生产调用方 = `apeireth egress notify <FACT_ID> <wording|partial|refuted>`**（查影响 → 生成待办，**不自动外发**、不被引用就不打扰）； ⑤自述面 `capabilities.accountability` —— 探测口接进 `ProductionBackends.self_status_accountability` + CLI 装配根。 **沿革（如实记，不掩盖）**：2026-10-24 自查发现 ②④⑤ 此前**只有库级实现 + 测试调用、生产零调用**（被 `audit_unwired.py` 抓出 —— 而它此前自己也没接电，见该脚本 docstring）；同日已全部接上真实调用方，并新增 CI 棘轮 `.github/workflows/unwired-ratchet.yml` 防回归。 **读出端已接**：出域账本 `apeireth egress ledger`（观测面）+ 问责账本 `apeireth egress impact`（责任面：授权/可逆性/影响谁/后果）。 **后果回填通道已接**（`apeireth egress outcome <ACTION_ID> <confirmed|failed>`）：用户/回执渠道显式回填，系统不猜（只接受 confirmed/failed）；状态机把关（已确认的事实不能退回）；后果账本 append-only 持久化（`consequence-ledger.jsonl`）。**仍未接**：回执渠道的**自动**回报（当前只能用户手动回填）。；2026-10-28 Phase 3 复核：单一工具目录/上下文接线未改变出网闸与 Provider 边界，原出境治理/账本回归随全量门禁通过；默认仍 OFF，未声称自动外发或自动回执已接。；2026-10-29 S4 复核：新增通用 principal epoch 检查，未改出网授权、脱敏或账本；默认仍 OFF。runtime all-targets 原出网回归通过，未声明自动回执或外部服务实测，见 kernel-convergence-s4-2026-10-29.md。；2026-10-29 S5：完整 TurnRequest 委托保留 security/intent，上游批准的冻结 continuation 仍进入原出网与 Provider 边界。原算法与默认开关未改，runtime all-targets 及真实 bootstrap 通过；不声明外部出网实测。 证据见 kernel-convergence-s5-2026-10-29.md。；2026-10-29 D3：router 差异仅新增 cfg(test) 模块，runtime 仅移除无调用内部 getter；新增兼容会话入口拒绝测试证明拒绝时 Provider 零新增调用、计量事实零新增；默认 OFF 与受管 gate 路径不变。；2026-10-30 P2：新增可选 Host 监督服务与执行回执；原能力默认、Provider 路由与确定性权限机制保持，定向及原 MainOnly 测试/clippy/fmt 回归通过。未将兼容入口声明为已受 System One 保护，无 live model/硬件声明。；2026-10-30 P3：可选 owner-bound 消息复用 Registry/Dispatcher，委托交集与独立后台授权分离；真实 Runtime 定向及原 MainOnly test/clippy/fmt 回归通过。默认与既有等级保持，本地幂等非持久 exactly-once，新消息变体需新 reader；无 live model/硬件声明。；2026-11-10 PR31 rebase 到 #94 之后复核：出网闸门两处回归通过（cargo test -p apeireth-runtime --lib egress && cargo test -p apeireth-runtime-assembly --lib egress_gate）；本批 runtime.rs 新增的远端投影不经过本地出网闸门（本地没有对端能力的 scope 对象，远端由对端自身出网策略把关），本地出网判定、账本与默认开关语义未变；不宣称远端分发等同本地出网管控"

