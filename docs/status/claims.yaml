  - id: sec.egress_gate
    title: "模型出网闸（上下文→provider 边界；出境脱敏 + fail-closed 拒绝）"
    level: PRODUCTION WIRED
    default: "OFF"
    switch_env: APEIRETH_ENABLE_EGRESS_GATE
    sources:
      - crates/engine/runtime/src/canonical/egress_gate.rs
      - crates/engine/runtime/src/canonical/provider.rs
