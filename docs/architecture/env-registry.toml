# 纪律: 新增开关必须先登记（默认关 + 关时零变化测试），否则 arch_guard W3 违规；
#       deprecated 的开关不得再出现在 src（R3c 守卫收紧）。
# 生成/播种: 效率线维护（R3a）；格式由架构线定（ADR-0004），变更需 ADR。
# ============================================================================


