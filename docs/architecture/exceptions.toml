# ============================================================================
# 架构例外登记簿 (Exception Register)
# ============================================================================
# 用途: 为"必须暂时违反契约、但已登记且有到期日"的改动留痕。
# 规则 (推荐值, 待 owner 裁决; 契约 [exceptions] 段为准):
#   - 结构/方向类 (weight>=10) 不允许走例外, 只能走 ADR 改契约;
#   - 每波新增例外权重合计 <= per_wave_weight_budget (默认 3);
#   - 全仓同时活跃例外 <= active_exceptions_max (默认 2);
#   - 例外最多存活 expiry_waves 波 (默认 2), 到期未清 -> 守卫 strict 直接红;
#   - 净零: 依赖边/重复概念类"加 1 必须同批删 >=1";
#   - 发版冻结窗口 (release_freeze) 预算 0。
# 每条必填: id / fingerprint / weight / owner / reason / created_wave / expires_wave / removal_task。
# 守卫读取: scripts/arch_guard.py (tomllib), 缺字段/到期/超预算 -> 违规。
# ============================================================================

version = 1
updated_at = "2026-10-20"

# 示例 (取消注释并填实后生效):
# [[exceptions]]
# id = "EXC-0001"
# fingerprint = "edge apeireth-cli -> apeireth-orchestration"
# weight = 3
# owner = "cli-line"
# reason = "临时: 装配迁移期需要直接读取 orchestrator 类型"
# created_wave = 1
# expires_wave = 3
# removal_task = "00-backlog#D27 / ADR-0003 §迁移步骤 4"
# adr = ""                      # weight>=10 时必填 docs/adr/000X-*.md 路径

# --- 生效例外 ---
# EXC-0001（首个真实例外）: 生物线在途 W3.5/bio_lifecycle 新开关未登记。
# 依据: bio_lifecycle.rs:32-48 自述默认关/fail-closed/三层零变化语义（源码文档为证）。
# 移除: Wave 2 收口时转入 env-registry.toml（R3a）并删除本例外；零变化测试由生物线收口批提供。
[[exceptions]]
id = "EXC-0001"
fingerprint = "env APEIRETH_ENABLE_BIO_LIFECYCLE"
weight = 3
owner = "bio-line"
reason = "W3.5/bio_lifecycle 在途；开关默认关 fail-closed（源码 :32-48）；登记表 R3a 未建前先记例外"
created_wave = 2
expires_wave = 4
removal_task = "Wave 2 收口: 转 env-registry.toml + 生物线零变化测试; 到期未清则 strict 红"
adr = ""
