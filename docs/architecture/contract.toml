# ============================================================================
# 机制型微内核边界 (KC-1, 2026-10-27)
# ============================================================================
# runtime 是机制内核: 只持有通用机制, 不依赖领域实现 crate, 不在执行循环里按
# 业务工具名分支。新增生产依赖 / 执行循环字面量 / 领域类型必须先出 ADR 并改本表。
# 静态扫描是预警手段, 不是完整架构证明。
[kernel]
crate = "apeireth-runtime"
allowed_production_deps = [
  "apeireth-core",
  "apeireth-protocol",
  "apeireth-plugin",
  "apeireth-governance",
  "apeireth-orchestration",
]
forbidden_production_deps = [
  "apeireth-organ",
  "apeireth-memory",
  "apeireth-guard",
  "apeireth-storage",
  "apeireth-provider",
  "apeireth-tools-canonical",
]
execution_loop_files = [
  "crates/engine/runtime/src/canonical/execute.rs",
  "crates/engine/runtime/src/canonical/dispatch_admission.rs",
  "crates/engine/runtime/src/canonical/dispatcher.rs",
  "crates/engine/runtime/src/canonical/registered_hooks.rs",
  "crates/engine/runtime/src/canonical/subloop.rs",
  "crates/engine/runtime/src/canonical/capability.rs",
  "crates/engine/runtime/src/canonical/module_host.rs",
]
forbidden_dispatch_literals = [
  "exit_plan_mode",
  "shell",
  "bash",
  "filesystem",
  "process",
]
forbidden_domain_types = [
  "BioPainState",
  "BioRecoveryLedger",
  "BioPainSnapshot",
  "NociceptionObserver",
  "CarePotentialField",
  "care_potential_field",
  "nociception",
]

# 现役装配根 (允许多个但必须登记; 目标收敛到 runtime-assembly + 薄适配器)。
[[composition_roots]]
crate = "apeireth-runtime-assembly"
file = "src/canonical/production.rs"
role = "目标装配根 (保留)"

[[composition_roots]]
crate = "apeireth-cli"
file = "src/lib.rs"
role = "CLI 引导 (目标: 只做参数/输入输出, 装配迁回 assembly)"

[[composition_roots]]
crate = "apeireth-gateway"
file = "src/canonical_entry.rs"
role = "Gateway 引导 (目标同上)"

[extension_points]
ui_component_trait = "crates-ui/apeireth-ui-core/src/component.rs::UiComponent"
# 唯一扩展点登记。新增能力必须复用其一; 新增扩展点/注册表 = 结构变更, 必须 ADR。
# 统一 ABI 家族（R2, ADR-0008 §2.1）: foundation/plugin/src/extension.rs 的
# ExtensionKind / ExtensionDescriptor / ExtensionCatalog; 注册表对外须实现
# ExtensionCatalog（现存 PluginManager 与 BehaviorRegistry 两个实现）。
module_trait = "crates/engine/runtime/src/canonical/module.rs::BehaviorModule"
plugin_trait = "crates/foundation/plugin/src/plugin.rs::Plugin"
# KC-1 (ADR-0017): 通用工具完成观察口 + 注册式内部控制命令。
tool_completion_observer = "crates/foundation/plugin/src/observation.rs::ToolCompletionObserver"
control_command = "crates/engine/runtime/src/canonical/control.rs::ControlCommand"
# Compatibility behavior registry; V1 module lifecycle reuses plugin_manager below (ADR-0019).
module_registry = "crates/engine/runtime/src/canonical/module.rs::BehaviorRegistry"
capability_registry = "crates/engine/runtime/src/canonical/capability.rs::CapabilityRegistry"
plugin_manager = "crates/foundation/plugin/src/manager.rs::PluginManager"
sub_loop = "crates/engine/runtime/src/canonical/module.rs::SubLoopSpawner"

# 已登记技术债: R2 收口（2026-10-20）后清零。新增结构变更须先出 ADR 再登记。

# 去重黑名单: 同名概念只允许一个 canonical 定义; known_debt 为实测债务 (只减不增)。
