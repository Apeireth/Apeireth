# ============================================================================
# Apeireth 架构契约（Architecture Contract）— 唯一可执行真源
# ============================================================================
# 状态: v0.1 草案 (2026-10-20, 待 owner 裁决后转 adjudicated)
# 读取者: scripts/arch_guard.py (CI / fast gate / 本地提交前)
#
# 原则:
#   1. 本文件是可执行契约, 不是叙事文档。叙事由 contract -> README/ARCHITECTURE 生成。
#   2. accepted-current = 2026-10-20 实测接受现状 (≠ 目标); target = 待 owner 裁决。
#   3. 棘轮: 允许集合只减不增; 新增依赖边/开关/结构必须 ADR + 本文件变更。
#   4. 不替代、不修改 LOCKED 5 项; 与 LOCKED 冲突时以 LOCKED 为准。
#
# 0 装边界 (2026-10-20 实测来源):
#   - 依赖边: cargo metadata --no-deps (kind != dev) = 118 条生产边
#   - 开关名: `rg -o 'APEIRETH_[A-Z0-9_]+' crates --glob '*.rs'` = 158 distinct
#   - 最大 src 文件: 实测 ~6150 行 (crates/capabilities/tools/src/doc_ops.rs)
# ============================================================================

