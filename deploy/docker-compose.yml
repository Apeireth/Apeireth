# Apeireth ASI 真生产 Docker Compose (主 23:44 + 主 22:33 + 主 17:33)
version: '3.8'
services:
  asi-core:
    image: apeireth/asi-core:0.1.0
    ports:
      - "18765:18765"
    environment:
      - ASI_MODE=core
      - ASI_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18765/api/asi/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  asi-bench:
    image: apeireth/asi-bench:0.1.0
    ports:
      - "18766:18766"
    environment:
      - ASI_MODE=benchmark
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18766/api/asi/health"]
      interval: 30s
      timeout: 10s
      retries: 3
