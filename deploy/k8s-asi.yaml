# Apeireth ASI asi-core K8s manifest (主 23:44 + 主 22:33 + 主 17:33)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asi-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asi-core
  template:
    metadata:
      labels:
        app: asi-core
    spec:
      containers:
      - name: asi-core
        image: apeireth/asi-core:0.1.0
        ports:
        - containerPort: 18765
        env:
        - name: ASI_MODE
          value: "core"
        livenessProbe:
          httpGet:
            path: /api/asi/health
            port: 18765
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: asi-core
spec:
  selector:
    app: asi-core
  ports:
  - port: 18765
    targetPort: 18765
