# Apeireth R14 阶段 5 — group-a-organs (V1180 真渲染)
# Crates: 9 services
# Source: V1180 / R14 阶段 5 施工图纸 (commit 531f5a14)
services:
  apeireth-core:
    build:
      context: ../..
      dockerfile: deploy/18-crates/Dockerfile.apeireth-core
    image: apeireth/apeireth-core:0.14.0
    restart: unless-stopped
    init: true
    ports:
      - "8800:8800"
    environment:
      APEIRETH_CRATE: "apeireth-core"
      APEIRETH_R14_STAGE5: "1"
      APEIRETH_CRATE_PORT: "8800"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8800/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

