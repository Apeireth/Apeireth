# Apeireth R14 阶段 5 — Kubernetes bundle (V1180 真渲染)
# Crates: 18 (1 Deployment + 1 Service each)
# Source: V1180 / R14 阶段 5 施工图纸 (commit 531f5a14)
# Apply: kubectl apply -f deploy/18-crates/k8s-18crates.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apeireth-apeireth-core
  labels:
    app: apeireth-apeireth-core
    apeireth.crate: "apeireth-core"
    apeireth.r14-stage5: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: apeireth-apeireth-core
  template:
    metadata:
      labels:
        app: apeireth-apeireth-core
        apeireth.crate: "apeireth-core"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apeireth-core
          image: apeireth/apeireth-core:0.14.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8800
          env:
            - name: APEIRETH_CRATE
              value: "apeireth-core"
            - name: APEIRETH_R14_STAGE5
              value: "1"
            - name: APEIRETH_CRATE_PORT
              value: "8800"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: apeireth-apeireth-core
  labels:
    app: apeireth-apeireth-core
spec:
  type: ClusterIP
  selector:
    app: apeireth-apeireth-core
  ports:
    - name: http
      port: 8800
      targetPort: 8800
      protocol: TCP
---
