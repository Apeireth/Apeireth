  labels:
    app: apeireth-apeireth-life-force
    apeireth.crate: "apeireth-life-force"
    apeireth.r14-stage5: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: apeireth-apeireth-life-force
  template:
    metadata:
      labels:
        app: apeireth-apeireth-life-force
        apeireth.crate: "apeireth-life-force"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apeireth-life-force
          image: apeireth/apeireth-life-force:0.14.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8811
          env:
            - name: APEIRETH_CRATE
              value: "apeireth-life-force"
            - name: APEIRETH_R14_STAGE5
              value: "1"
            - name: APEIRETH_CRATE_PORT
              value: "8811"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8811
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8811
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: apeireth-apeireth-life-force
  labels:
    app: apeireth-apeireth-life-force
spec:
  type: ClusterIP
  selector:
    app: apeireth-apeireth-life-force
  ports:
    - name: http
      port: 8811
      targetPort: 8811
      protocol: TCP
---
