# V1391 default policy 鈥?true production safe defaults
name: apeireth-default-policy
version: "0.1.0"
schema: v1391.policy-gate/v1
description: |
  Pass criteria:
  - zero errors (errors cause immediate failure)
  - max 5 warnings
  - max 20 info
  - no :latest tags
  - no plaintext secrets
rules:
  - rule_id: DEFAULT
    severity: error
    max_count: 0
  - rule_id: DEFAULT
    severity: warning
    max_count: 5
  - rule_id: DEFAULT
    severity: info
    max_count: 20
  - rule_id: COMPOSE-LATEST-TAG
    severity: error
    max_count: 0
  - rule_id: K8S-LATEST-TAG
    severity: error
    max_count: 0
  - rule_id: V1384-FROM-LATEST
    severity: error
    max_count: 0
  - rule_id: COMPOSE-PLAINTEXT-SECRET
    severity: error
    max_count: 0
  - rule_id: K8S-PLAINTEXT-SECRET
    severity: error
    max_count: 0

