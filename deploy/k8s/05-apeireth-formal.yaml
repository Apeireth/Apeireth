# apeireth-formal — k8s Deployment + Service + PVC (V2 战区 5 P2)
#
# 形式化验证 daemon (Kani / 模型检查)
# 端口: 8094 (HTTP, verify API)
# 持久化: PVC 挂 /app/artifacts (counter-example + proof cert)
#
# 加固: 同 graph/vector

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apeireth-formal-artifacts
  namespace: apeireth-v2
  labels:
    app.kubernetes.io/name: apeireth-formal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apeireth-formal
  namespace: apeireth-v2
  labels:
    app.kubernetes.io/name: apeireth-formal
    app.kubernetes.io/part-of: apeireth
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: formal-verify
spec:
  replicas: 1
  # formal 是 CPU 重任务 (Kani CBMC), 单副本避免资源争抢
  # 需扩缩容时手动改 replicas, 不要 HPA
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: apeireth-formal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apeireth-formal
        app.kubernetes.io/part-of: apeireth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: fix-data-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1001:1001 /app/artifacts && chmod 700 /app/artifacts
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
      containers:
        - name: apeireth-formal
          image: apeireth/formal:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --port=8094
            - --artifacts-dir=/app/artifacts
          ports:
            - name: http
              containerPort: 8094
              protocol: TCP
          env:
            - name: APEIRETH_FORMAL_PORT
              value: "8094"
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: apeireth-v2-config
                  key: RUST_LOG
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: apeireth-formal-artifacts
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apeireth-formal
  namespace: apeireth-v2
  labels:
    app.kubernetes.io/name: apeireth-formal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apeireth-formal
  ports:
    - name: http
      port: 8094
      targetPort: http
      protocol: TCP"