# 独立 workspace: 与 Apeireth 主 workspace (root Cargo.toml) 隔离, 不强行加入 upstream members
[workspace]

[package]
name = "companion-desktop"
version = "2.0.0-rc.4"
description = "Apeireth 桌面伙伴 — 薄 Tauri shell (窗口/托盘/通知), 保留 legacy companion 兼容接入"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# 存储文档信封 (配置严格打开 / 显式迁移): 主 workspace 存储基础件, path 依赖。
apeireth-core = { path = "../../../crates/foundation/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 自铸回环令牌 (G10): 每次启动侧车一枚密码学随机 32 字节令牌。
rand = "0.8"
# OS keychain persistence. Windows speaks to Credential Manager directly
# (see src/keychain.rs — keyring v3's CRED_PERSIST_ENTERPRISE is broken on
# Microsoft-account machines); keyring remains the macOS/Linux backend.
keyring = "3.6.3"
# Workspace policy (clippy.toml): fs_err over std::fs for path-carrying errors.
fs-err = "3.0"
# 矿脉数据库面: 只读 SQL 查询引擎。版本对齐主 workspace 硬锁 0.32 (bundled)，
# 防 libsqlite3-sys 生态漂移——本 crate 独立 workspace，同版即同栈。
rusqlite = { version = "0.32", features = ["bundled"] }
# 信使 SMTP 发送面: 传输件对齐既有依赖树版本（经 reqwest 带入的同栈），
# 零树膨胀。隐式 TLS 走 ring 提供者；明文通道需显式 insecure 标志（如实命名）。
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1.0"
base64 = "0.22"
# 认证件: MD5/SCRAM 握手哈希用，纯计算零网络。
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# MySQL 认证加扰（mysql_native_password 的 SHA1 口径；纯计算零网络）。
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
# Win32_Graphics_Dwm: 主窗标题栏配色 (src/titlebar.rs); Foundation/Credentials 供 keychain。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Dwm"] }

# 构建缓存治理（2026-10-16 建议书 P0-1 同款）：第三方依赖不生成调试信息
[profile.dev.package."*"]
debug = 0
[profile.release]
codegen-units = 1
lto = true
strip = true
