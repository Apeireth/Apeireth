# 独立 workspace: 与 Apeireth 主 workspace (root Cargo.toml) 隔离, 不强行加入 upstream members
[workspace]

[package]
name = "companion-desktop"
version = "2.0.0-rc.1"
description = "Apeireth 桌面伙伴 — 薄 Tauri shell (窗口/托盘/通知), 保留 legacy companion 兼容接入"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# OS keychain persistence. Windows speaks to Credential Manager directly
# (see src/keychain.rs — keyring v3's CRED_PERSIST_ENTERPRISE is broken on
# Microsoft-account machines); keyring remains the macOS/Linux backend.
keyring = "3.6.3"
# Workspace policy (clippy.toml): fs_err over std::fs for path-carrying errors.
fs-err = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
