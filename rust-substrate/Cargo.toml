[workspace]
resolver = "2"

members = [
    "crates/apeireth-core",         # 核心 domain: memory / identity / episode / note
    "crates/apeireth-ports",        # Port interfaces (hexagonal architecture)
    "crates/apeireth-adapters",     # Qdrant / Tantivy / SQLite / LLM adapters
    "crates/apeireth-gateway",      # HTTP / JSON-RPC API
    "crates/apeireth-py",           # PyO3 binding — Python 调 Rust
    "crates/apeireth-cli",          # 内部 CLI / benchmarks
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Apeireth <apeireth@local>"]
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }
# Web Framework
axum = "0.7"
tower = { version = "0.4", features = ["timeout", "limit", "retry"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "timeout"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Config
config = "0.15"
dotenv = "0.15"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Error Handling
thiserror = "1.0"
anyhow = "1.0"
# HTTP Client
reqwest = { version = "0.12", features = ["json", "stream"] }
# Vector
qdrant-client = "1.7"
# Search
tantivy = "0.22"
# Utils
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
arc-swap = "1.6"
parking_lot = "0.12"
# Python bindings
pyo3 = { version = "0.21", features = ["extension-module"] }
# Benchmarks
criterion = { version = "0.5", features = ["async_tokio"] }

# Apeireth 借鉴说明:
# - MemoryOS-Rust: workspace 结构 + STM/MTM/LTM tier_manager (TelivANT/memoryos-rust, Apache-2.0)
# - DeltaMemory: WAL + MemTable + SSTable (https://www.deltamemory.com/blog/why-we-built-deltamemory-in-rust)
# - Qdrant: HNSW vector index (https://github.com/qdrant/qdrant, Apache-2.0)
# - Tantivy: BM25 full-text search (https://github.com/quickwit-oss/tantivy, MIT)
# - claude-mem: 3-layer progressive disclosure (https://github.com/thedotmack/claude-mem, Apache-2.0)
# - Zep / Graphiti: Episode provenance + temporal validity (https://github.com/getzep/graphiti, Apache-2.0)