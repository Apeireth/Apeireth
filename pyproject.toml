[tool.pytest.ini_options]
# Override the parent workspace pyproject.toml's pytest config so that
# Windows + Python 3.13 + pytest 9.1.1 capture=fd doesn't race against the
# r11 V1136 measurement subprocess (see tests/test_r11_v04_lift_acceptance.py
# — `ValueError: I/O operation on closed file` was caused by capture=fd
# closing the tmpfile after measure_v05_3dims() returned). capture=sys is
# still strict (asserts still captured) but avoids the file-descriptor
# redirection that trips on Windows.
addopts = "-v --tb=short -p no:cacheprovider --capture=sys"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]
