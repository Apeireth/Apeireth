# Apeireth docker-compose（当前基线 v2.0.0-rc.1）
#
# 单服务编排: apeireth canonical gateway（SQLite 持久化 + 数据卷）。
# - 镜像由根目录 Dockerfile 构建（构建当前工作区 CLI 并以 `apeireth gateway serve` 启动）
# - 数据落 /var/lib/apeireth（卷挂载），备份 = 复制该卷
# - 旧版三服务（postgres/redis）编排为 v1 时代遗留，当前代码不读取
#   POSTGRES_PASSWORD / APEIRETH_DB_URL / APEIRETH_REDIS_URL / APEIRETH_LLM_*，
#   已随基线对齐移除，见 git 历史

services:
  apeireth:
    build:
      context: .
      dockerfile: Dockerfile
    image: apeireth/apeireth:2.0.0-rc.1
    container_name: apeireth
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP API + WebSocket + /health
    environment:
      # 必填才能真对话（留空走本地 scripted 桩）
      APEIRETH_API_KEY: ${APEIRETH_API_KEY:-}
      # 可选：OpenAI 兼容端点与默认模型
      APEIRETH_API_URL: ${APEIRETH_API_URL:-}
      APEIRETH_MODEL: ${APEIRETH_MODEL:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - apeireth-data:/var/lib/apeireth

volumes:
  apeireth-data:
