; ASI supervisord program — V1075 (借鉴 supervisord2004 program autorestart)
[program:apeireth-asi]
command=/usr/bin/python3 -m apeireth.v1075_asi_real_deployment_run --serve --host 0.0.0.0 --port 18800
directory=/opt/apeireth
user=apeireth
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/apeireth-asi.out.log
stderr_logfile=/var/log/apeireth-asi.err.log
environment=ASI_VERSION="0.1.0",V1075_HOST="0.0.0.0",V1075_PORT="18800"
