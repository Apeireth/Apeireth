# ASI docker-compose v2 — V1075 (借鉴 ComposeV2 services/healthcheck/depends_on)
services:
  asi-api:
    build: .
    image: apeireth-asi:0.1.0
    container_name: apeireth-asi
    restart: unless-stopped
    ports:
      - "18800:18800"
    environment:
      - ASI_VERSION=0.1.0
      - OTEL_SERVICE_NAME=apeireth-asi
      - V1075_HOST=0.0.0.0
      - V1075_PORT=18800
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18800/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
