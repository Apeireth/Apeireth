[package]
name = "apeireth-skills"
version = "2.0.0"
edition = "2021"
description = "Apeireth v2 skills registry"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["sync", "rt", "rt-multi-thread", "macros", "fs", "io-util", "time"] }
async-trait = "0.1"
tracing = "0.1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
