[package]
name = "apeireth-pipeline"
version = "2.0.0"
edition = "2021"
description = "Apeireth v2 5-step chat pipeline (token budget → placeholder → force-translate → protocol → http)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["sync", "rt", "rt-multi-thread", "macros"] }
futures = "0.3"
regex = "1.10"
parking_lot = "0.12"
