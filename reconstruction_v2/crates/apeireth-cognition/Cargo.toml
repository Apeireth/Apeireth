[package]
name = "apeireth-cognition"
version = "2.0.0"
edition = "2021"
description = "Apeireth cognition organ (A10 - internal cognition: scoring + 13-key verdict gate + decision + reflection). v2 style rewrite with v1 pub API surface 100% covered."

[dependencies]
apeireth-core = { path = "../apeireth-core" }
apeireth-asi = { path = "../apeireth-asi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
