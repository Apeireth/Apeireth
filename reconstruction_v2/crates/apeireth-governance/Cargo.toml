[package]
name = "apeireth-governance"
version = "2.0.0"
edition = "2021"

[dependencies]
hex = "0.4"
serde_json = { workspace = true }
rusqlite = { workspace = true }

# v1onion/v1arbitration dependencies (transcribed from apeireth-onion/arbitration v1)
parking_lot = "0.12"
tempfile = "3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.18"
apeireth-core = { path = "../apeireth-core" }

