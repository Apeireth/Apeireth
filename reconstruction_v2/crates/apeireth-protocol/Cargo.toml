[package]
name = "apeireth-protocol"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.34", features = ["full"] }
bytes = "1.5"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }

[dev-dependencies]
tokio-test = "0.4"

