[package]
name = "apeireth-cli"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
apeireth-core = { path = "../apeireth-core" }
apeireth-governance = { path = "../apeireth-governance" }
apeireth-storage = { path = "../apeireth-storage" }
apeireth-protocol = { path = "../apeireth-protocol" }
apeireth-tools = { path = "../apeireth-tools" }
apeireth-runtime = { path = "../apeireth-runtime" }
apeireth-companion = { path = "../apeireth-companion" }
apeireth-gateway = { path = "../apeireth-gateway" }

apeireth-sdk = { path = "../apeireth-sdk" }
async-trait = "0.1"
ratatui = "0.30"
crossterm = "0.28"



