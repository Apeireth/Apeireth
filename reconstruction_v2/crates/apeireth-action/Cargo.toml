[package]
name = "apeireth-action"
version = "2.0.0"
edition = "2021"
description = "Apeireth action organ (A11.1 - R14 stage 4: changing environment + tool execution + expression + silence = not-acting is also acting). v2 style rewrite with v1 pub API surface 100% covered."

[dependencies]
apeireth-core = { path = "../apeireth-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
