[package]
name = "apeireth-gateway"
version = "2.0.0"
edition = "2021"

[dependencies]
apeireth-protocol = { path = "../apeireth-protocol" }
apeireth-core = { path = "../apeireth-core" }
apeireth-companion = { path = "../apeireth-companion" }
apeireth-tools = { path = "../apeireth-tools" }
apeireth-storage = { path = "../apeireth-storage" }
apeireth-runtime = { path = "../apeireth-runtime" }
axum = { version = "0.7", features = ["ws"] }




tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

tracing = "0.1"
futures = "0.3"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }


[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

