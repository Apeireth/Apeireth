[package]
name = "apeireth-voice"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
bytes = "1.5"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
