[package]
name = "apeireth-graph-primitive"
version = "2.0.0"
edition = "2021"
description = "Apeireth v2 relation subsystem (4 relation kinds) + property graph (R154: RelationGraph with adjacency indexes + BFS/DFS iterators + shortest path + predicate query)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
