[package]
name = "apeireth-arbitration"
version = "2.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
# Real persistence + crypto deps (R215 audit-journal + R145 HASH-SQL arbitration):
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"
sha2 = "0.10"
thiserror = "1.0"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
