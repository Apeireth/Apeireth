[package]
name = "apeireth-tools"
version = "2.0.0"
edition = "2021"

[dependencies]
apeireth-core = { path = "../apeireth-core" }
apeireth-governance = { path = "../apeireth-governance" }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }



[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "winnt", "processthreadsapi", "handleapi", "securitybaseapi", "winuser", "wingdi"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"
