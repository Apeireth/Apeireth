[package]
name = "apeireth-companion"
version = "2.0.0"
edition = "2021"

[dependencies]
tracing = "0.1"

# v1blueprint_impl/v1motivation dependencies (transcribed from apeireth-blueprint-impl/motivation v1)
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
apeireth-core = { path = "../apeireth-core" }
apeireth-sdk = { path = "../apeireth-sdk" }

