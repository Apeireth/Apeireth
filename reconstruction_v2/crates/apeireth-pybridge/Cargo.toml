[package]
name = "apeireth-pybridge"
version = "2.0.0"
edition = "2021"

[lib]
# PyO3 module name (Python import name)
name = "apeireth"
crate-type = ["cdylib"]

[dependencies]
apeireth-core = { path = "../apeireth-core" }
apeireth-companion = { path = "../apeireth-companion" }
apeireth-tools = { path = "../apeireth-tools" }
apeireth-storage = { path = "../apeireth-storage" }
apeireth-runtime = { path = "../apeireth-runtime" }
apeireth-protocol = { path = "../apeireth-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.25", features = ["auto-initialize"] }
ureq = { version = "2.12", features = ["json"] }
