[workspace]
resolver = "2"
members = [
    "crates/apeireth-core",
    "crates/apeireth-governance",
    "crates/apeireth-storage",
    "crates/apeireth-protocol",
    "crates/apeireth-tools",
    "crates/apeireth-runtime",
    "crates/apeireth-sovereignty",
    "crates/apeireth-companion",
    "crates/apeireth-gateway",
    "crates/apeireth-cli",
    "crates/apeireth-sdk",
    "crates/apeireth-asi",
    "crates/apeireth-avatar",
    "crates/apeireth-voice",
    "crates/apeireth-bridge",
    "crates/apeireth-provider",
    "crates/apeireth-pybridge",
    "crates/apeireth-perception",
    "crates/apeireth-cognition",
    "crates/apeireth-council",
    "crates/apeireth-action",
    "crates/apeireth-bus",
    "crates/apeireth-guard",
    "crates/apeireth-graph",
    "crates/apeireth-graph-primitive",
    "crates/apeireth-pipeline",
    "crates/apeireth-pipeline-g5",
    "crates/apeireth-context-fold",
    "crates/apeireth-skills",
    "crates/apeireth-experience",
    "crates/apeireth-team-lead",
    "crates/apeireth-naming-v05",
    "crates/apeireth-knowledge",
    "crates/apeireth-library-governance",
    "crates/apeireth-rate-limiter",
    "crates/apeireth-constraint",
    "crates/apeireth-life-force",
    "crates/apeireth-upgrade",
    "crates/apeireth-web",
    "crates/apeireth-mcp",
    "crates/apeireth-eval",
    "crates/apeireth-api",
    "crates/apeireth-tool-runtime",
    "crates/apeireth-http-client",
    "crates/apeireth-tui",
    "crates/apeireth-llm-iface",
    "crates/apeireth-telemetry",
    "crates/apeireth-supervision",
    "crates/apeireth-sandbox-net",
    "crates/apeireth-cron",
    "crates/apeireth-wiki",
    "crates/apeireth-credentials",
    "crates/apeireth-stock",
    "crates/apeireth-cross-diary",
    "crates/apeireth-config",
    "crates/apeireth-environment",
    "crates/apeireth-i18n",
    "crates/apeireth-evolution",
    "crates/apeireth-workflow",
    "crates/apeireth-lark",
    "crates/apeireth-livekit",
    "crates/apeireth-vector",
    "crates/apeireth-value",
    "crates/apeireth-verify",
    "crates/apeireth-test",
    "crates/apeireth-memory",
    "crates/apeireth-tool-registry",
    "crates/apeireth-tool-approval",
    "crates/apeireth-tool-shell",
    "crates/apeireth-tool-fetch",
    "crates/apeireth-tool-codesearch",
    "crates/apeireth-tool-filesystem",
    "crates/apeireth-tool-browser",
    "crates/apeireth-tool-image-gen",
    "crates/apeireth-tool-image-process",
    "crates/apeireth-tool-search",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["Apeireth Team"]
license = "Apache-2.0"
homepage = "https://github.com/apeireth/apeireth"
repository = "https://github.com/apeireth/apeireth"

[workspace.lints.rust]
unused_extern_crates = 'warn'
trivial_numeric_casts = 'warn'
unstable_features = 'warn'
unused_import_braces = 'warn'
missing_docs = 'allow'
unused_imports = 'allow'
dead_code = 'allow'
unused_must_use = 'allow'

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(kani)', 'cfg(fuzzing)']

[workspace.lints.clippy]
all = { level = 'allow', priority = -1 }
unused_async = 'allow'

[workspace.lints.rustdoc]
broken_intra_doc_links = 'allow'
invalid_html_tags = 'allow'
private_intra_doc_links = 'allow'
invalid_rust_codeblocks = 'allow'
bare_urls = 'allow'

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
rusqlite = { version = "0.31", features = ["bundled", "blob", "time", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
rand = "0.8"
shell-words = "1.1"
lru = "0.12"
sqlite-vec = "0.1"

apeireth-core = { path = "crates/apeireth-core" }
apeireth-governance = { path = "crates/apeireth-governance" }
apeireth-storage = { path = "crates/apeireth-storage" }
apeireth-protocol = { path = "crates/apeireth-protocol" }
apeireth-tools = { path = "crates/apeireth-tools" }
apeireth-runtime = { path = "crates/apeireth-runtime" }
apeireth-companion = { path = "crates/apeireth-companion" }
apeireth-gateway = { path = "crates/apeireth-gateway" }
apeireth-sdk = { path = "crates/apeireth-sdk" }
apeireth-bus = { path = "crates/apeireth-bus" }
apeireth-life-force = { path = "crates/apeireth-life-force" }
apeireth-sovereignty = { path = "crates/apeireth-sovereignty" }
apeireth-verify = { path = "crates/apeireth-verify" }