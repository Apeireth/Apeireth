**Source**: https://raw.githubusercontent.com/TelivANT/memoryos-rust/main/Cargo.toml

---

[workspace]
members = [
    "crates/memoryos-core",
    "crates/memoryos-ports",
    "crates/memoryos-adapters",
    "crates/memoryos-gateway",
    "crates/memoryos-worker",
    "crates/memoryos-metrics",
    "crates/memoryos-admin",
    "crates/memoryos-wiki-gen",
    "crates/memoryos-mcp",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc"
edition = "2021"
authors = ["MemoryOS Team"]
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }
# Web Framework
axum = "0.7"
tower = { version = "0.4", features = ["timeout", "limit", "retry"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "timeout"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Config
config = "0.15"
dotenv = "0.15"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Error Handling
thiserror = "1.0"
anyhow = "1.0"
# HTTP Client
reqwest = { version = "0.12", features = ["json", "stream"] }
# Database
redis = { version = "0.32.7", features = ["tokio-comp", "cluster"] }
qdrant-client = "1.7"
# Utils
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde", "std"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
arc-swap = "1.6"
validator = { version = "0.16", features = ["derive"] }
criterion = { version = "0.5", features = ["async_tokio"] }
prometheus = "0.13"
lazy_static = "1.4"