# P5-b 生产对照 harness —— 真浏览器验证宿主（证据用；**不是** workspace 成员）
#
# 作用：把引擎（`apeireth-ui-gpu`）用**生产侧实测抓到的 16 个 uniform 取值**
# 驱动到真实浏览器里，两个后端各画一张画布，供逐像素对照。
#
# 构建（**在 crates-ui/ 之外**执行，避免被主 workspace 扫到）：
#   cargo build --release --target wasm32-unknown-unknown
#   wasm-bindgen --target web --out-dir ../web/public/engine/pkg \
#       target/wasm32-unknown-unknown/release/p5b_harness.wasm
#
# ⚠️ 本 crate 自带 `[workspace]` 段 ⇒ 独立 workspace ⇒ 不进 crates-ui 的
#    依赖图、不进 cargo deny 的图、不进 CI 门禁。
[package]
name = "p5b-harness"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 被验证对象：引擎本体（仓库内路径依赖，0 拷贝 0 改写）。
apeireth-ui-gpu = { path = "../../../apeireth-ui-gpu" }
apeireth-ui-dom = { path = "../../../apeireth-ui-dom" }
#: 响应式核心（Signal/Runtime）—— 内部 crate，**非外部依赖**。
apeireth-ui-core = { path = "../../../apeireth-ui-core" }
#: **产品工程**（宿主薄壳）—— 内部 crate，**非外部依赖**。
apeireth-ui-app = { path = "../../../apeireth-ui-app" }
# 场景层（片头编舞取值链）—— 被验证对象之一。
apeireth-ui-scene = { path = "../../../apeireth-ui-scene" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "Window", "console"] }

[workspace]
