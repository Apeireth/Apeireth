# ============================================================================
# apeireth-ui — 门面（re-export 各层）
# ----------------------------------------------------------------------------
# 职责边界（设计文档 §3.3.6）：**零逻辑**。门面里出现任何一行非 `pub use` 的
# 实现代码即违规 —— 门面只是「让试点应用不必写 5 条 use」。
#
# 依赖方向（ADR-0015 §3.3）：门面位于拓扑秩 4，依赖 core / dom / gpu / kit /
# macro 全部下层。
# ============================================================================
[package]
name = "apeireth-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Apeireth UI 引擎门面：re-export 响应式核心 / DOM 绑定 / GPU 桥 / 组件库"

[lib]
name = "apeireth_ui"
path = "src/lib.rs"

[dependencies]
# 内部依赖走 workspace 继承（path + version 见 crates-ui/Cargo.toml
# [workspace.dependencies]）：crates.io publish 硬要求每个 path 依赖**带 version**
# ⇒ 纯 path 依赖会让 `cargo package` 直接失败。
# 内部依赖：各层（拓扑秩 4 ⇒ 全部下层皆可依赖）。
apeireth-ui-core = { workspace = true }
apeireth-ui-dom = { workspace = true }
apeireth-ui-gpu = { workspace = true }
apeireth-ui-kit = { workspace = true }
apeireth-ui-macro = { workspace = true }
# P0 阶段纪律：0 外部依赖。

[lints]
workspace = true
