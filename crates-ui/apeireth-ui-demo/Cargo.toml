# ============================================================================
# apeireth-ui-demo — 试点应用（审批卡）
# ----------------------------------------------------------------------------
# P3 试点载体兼装配级冒烟（ADR-0015 §4）：组件 = Rust 函数 ⇒ 整条渲染链在
# native `cargo test` 里直接跑（这是 D3 债「38 处源码镜像测试」的根解法）。
#
# 依赖方向（拓扑秩 5）：依赖门面 + 组件库；不依赖任何主仓 crate。
# ============================================================================
[package]
name = "apeireth-ui-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth UI 引擎试点应用：审批卡（装配级冒烟）"

[lib]
name = "apeireth_ui_demo"
path = "src/lib.rs"

[[bin]]
name = "apeireth-ui-demo"
path = "src/main.rs"

[dependencies]
# 内部依赖：门面（各层 re-export）+ 组件库（共享组件）。
apeireth-ui = { path = "../apeireth-ui" }
apeireth-ui-kit = { path = "../apeireth-ui-kit" }
# ⭐ 宿主侧「时刻文本」能力（浏览器 `Intl` ⇒ 与生产逐字同源）。
apeireth-ui-time = { path = "../apeireth-ui-time" }
# 宏展开物引用 `::apeireth_ui_core::…` / `::apeireth_ui_dom::…`（**绝对路径**，
# 见 apeireth-ui-macro 的 crate 文档头「运行时路径约定」）⇒ 这两个 crate 必须是
# 使用方的**直接依赖**。
apeireth-ui-core = { path = "../apeireth-ui-core" }
apeireth-ui-dom = { path = "../apeireth-ui-dom" }
# 过程宏（`#[component]` + `view!`）—— 试点组件由它声明。
apeireth-ui-macro = { path = "../apeireth-ui-macro" }
# P0 阶段纪律：0 外部依赖。

# wasm32 宿主侧依赖（仅 wasm32 目标参与编译；native 侧永远 0 外部依赖）。
# 许可：三者均为 MIT OR Apache-2.0（实测，见 crates-ui/deny.toml 白名单）。
# 版本与 apeireth-ui-dom **精确一致**（wasm-bindgen 对 web-sys 是 1:1 硬钉）。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "Document",       # 取挂载点：get_element_by_id
    "Element",        # 挂载点的元素视图
    "Node",           # 挂载点转成节点句柄
    "Window",         # 取 document
] }

[lints]
workspace = true
