<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>引擎侧 · 能力与治理</title>
    <!--
      设计令牌层：**只读引用**生产前端的同一批 CSS（构建期复制到 public/design/）。
      链接顺序与参考侧**完全一致** ⇒ 两侧的计算样式同源。
    -->
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="/design/base.css" />
    <link rel="stylesheet" href="/design/essence.css" />
    <link rel="stylesheet" href="/design/hud.css" />
    <link rel="stylesheet" href="/design/motion.css" />
    <link rel="stylesheet" href="/design/prose.css" />
    <link rel="stylesheet" href="/design/shell.css" />
    <!--
      子面 scoped CSS：构建期从生产的 `<style>` 块抽取，并按本面**根 class**
      作用域化（做法与组件编译器同构，规则写在抽取脚本里）。
      根 class：`.sp-capability`
    -->
    <link rel="stylesheet" href="/settings-capability.css" />
    <!-- 对照专用样式（两侧**逐字相同**地链入）：舞台宽度。 -->
    <link rel="stylesheet" href="/settings-test.css" />
  </head>
  <body>
    <!--
      本面：**能力与治理**（`capability`）

      - 引擎侧形态：wasm 引擎（`apeireth-ui-demo`）渲染**本面独立挂载**
      - `window.__APP_MODE__` = `settings:capability`
      - 建议的 Rust 模块：`ui_kit::settings::CapabilityPanels`
      - CSS 根 class：`.sp-capability`
      - 裁剪选择器（参考侧 / 引擎侧）：`.setting-block` / `.sp-capability .setting-block`；`.setting-block` / `.sp-capability .setting-block`；`.setting-block` / `.sp-capability .setting-block`
      - 裁剪方式：元素框
      - 固定数据：`fixtures/capabilities.json`（与参考侧**同一份**）
      - 依赖：frame、character（仅 CapabilityCard 组件）
    -->
    <div id="app"></div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
