# ============================================================================
# apeireth-ui-app — 引擎**产品工程**（宿主运行时契约 + wasm 入口）
# ----------------------------------------------------------------------------
# 这是「新前端」的**实现目标工程**（交接包 §0：由引擎线指定路径与工程基线）。
#
# ## 定位（三句话说清）
#
# 1. **它是产品宿主**：屏幕装配 + 运行时契约（挂载 / 重渲染 / 销毁）都在这里；
# 2. **它不是试点**：`apeireth-ui-demo` 是试点载体兼装配级冒烟（ADR-0015 §4），
#    被证据装置与 CI 引用 ⇒ ⇒ 职责不同 ⇒ ⇒ 不合并（避免牵连证据链）；
# 3. **它不是引擎**：`core/dom/gpu/kit` 仍是引擎层（ADR-0015 增补的三层边界），
#    本 crate 只做**装配与宿主** ⇒ ⇒ 不把组件/能力塞进来。
#
# ## 依赖方向（拓扑秩 6，最高）
#
# app → ui（门面）→ core / dom / gpu / kit → …（下层）
#
# ⚠️ 本 crate **不得**被引擎层反向依赖（否则产品细节会污染引擎）。
# ============================================================================
[package]
name = "apeireth-ui-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth UI 引擎产品工程：宿主运行时契约 + wasm 入口"

[lib]
name = "apeireth_ui_app"
path = "src/lib.rs"

[features]
# ⭐⭐⭐⭐⭐ **`wasm-host`：引擎自带的 wasm 薄壳**（`src/wasm_host.rs`）。
#
# ## 为什么需要这个门（2026-11-06 实测撞到）
#
# ⇒ ⇒ 引擎的 `wasm_host` **无条件编译** ⇒ ⇒ 它导出 `boot` / `rerender` /
# ⇒ ⇒ `render_if_dirty` / `render_count` / `async_line_stats` ……
# ⇒ ⇒⇒ 而**私有产品仓自带自己的宿主薄壳** ⇒ ⇒⇒ 若它也导出同名函数
# ⇒ ⇒⇒⇒ ⇒ wasm-bindgen **直接报错**：
# ⇒ ⇒⇒⇒ ⇒ `the name async_line_stats is exported by multiple crates in this build`
# ⇒ ⇒⇒⇒ ⇒ ⇒ 产品侧只能**改名规避**（`render_workspace_if_dirty` / `workspace_async_stats` …）
# ⇒ ⇒⇒⇒ ⇒ ⇒ 那是**绕过**，不是**根治**。
#
# ## 这个门怎么用
#
# ⇒ ⇒ **产品自带宿主** ⇒ ⇒ **关掉**引擎的薄壳：
# ```toml
# apeireth-ui-app = { …, default-features = false, features = ["contract-only"] }
# ```
# ⇒ ⇒ ⇒ 引擎的 `wasm_host` **不参与编译** ⇒ ⇒ ⇒ 导出名**不可能**再撞
# ⇒ ⇒⇒ ⇒ ⇒ 产品**可以**用自己的名字 ⇒ ⇒⇒ ⇒ 不用再被逼着改名。
#
# ## 为什么默认**仍然开着**
#
# ⇒ ⇒ 引擎自己的证据装置与 demo **依赖**它 ⇒ ⇒⇒ ⇒ 默认关掉会**打断现有证据链**
# ⇒ ⇒⇒ ⇒ 所以默认开 ⇒ ⇒⇒ ⇒ **要产品自己带宿主时**再显式关。
default = ["wasm-host"]
#: ⭐ 引擎自带的 wasm 薄壳（`src/wasm_host.rs`）—— **默认开**（引擎自己的证据装置依赖它）。
wasm-host = []
#: 只要**契约**（`Screen` / `HostState` / `RenderPlan` / `async_line` / `snapshot`）
#: ⇒ ⇒ **不要**引擎自带的 wasm 薄壳（产品自带宿主时用这个）。
contract-only = []

[dependencies]
#: 引擎门面（响应式核心 / DOM / GPU / 组件库的具名导出）。
apeireth-ui = { path = "../apeireth-ui" }
#: 响应式核心（Signal / Runtime）—— 屏幕状态用信号表达。
apeireth-ui-core = { path = "../apeireth-ui-core" }
#: DOM 层（VNode / Renderer）—— 屏幕视图树。
apeireth-ui-dom = { path = "../apeireth-ui-dom" }

# ⚠️ **wasm-only 依赖**（native 目标不参与编译 ⇒ native 侧仍是 **0 外部依赖**；
#    与 `apeireth-ui-dom` 同一口径：版本精确硬钉 1:1 —— web-sys 0.3.106 要求
#    wasm-bindgen =0.2.129）。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "Document",       # query_selector / create_element
    "Element",        # 取元素 / 事件派发
    "HtmlElement",    # focus / blur
    "Window",         # document
] }
