# Apeireth ASI R8 真生产 Docker Compose
# 主哲学: 23:44 干到底 + 22:33 ASI 北极星 + 17:43 实事求是 + 00:56 任何人都能接手
# V1008 deployment pattern 借鉴 + v1075_asi_real_deployment_run docker_compose_up() 接口兼容
# 覆盖 R7 集成工程闭环 (V1080-V1088) + R7 真实现 (V1090-V1098)
#
# 用法:
#   docker compose -f docker-compose.r8.yml up -d
#   docker compose -f docker-compose.r8.yml logs
#   docker compose -f docker-compose.r8.yml down
#
# 主入口: apeireth-r8-orchestrator 服务执行 scripts/start_apeireth_r8.sh
# 边车:   v1084-real-llm / v1090-memory-wal / v1091-memory-replay 等长跑服务
# 数据卷: apeireth-data / apeireth-artifacts / apeireth-logs (持久化)
#
# 4 层安全门 (V3 guard):
#   L1: apeireth-r8-v3-guard  (v1081_v3_guards)
#   L2: apeireth-r8-asi-measure (v1074 真测)
#   L3: apeireth-r8-honest-limits (v1081 probe)
#   L4: apeireth-r8-hqb-live-gate (v1085/v1086/v1087 4 维 SC/NR/EV/CDT)

version: "3.8"

x-apeireth-common: &apeireth-common
  image: python:3.11-slim
  working_dir: /opt/apeireth
  environment:
    PYTHONPATH: /opt/apeireth
    PYTHONUNBUFFERED: "1"
    APEIRETH_ENV: "r8_production"
    ASI_NORTH_STAR: "true"
    V3_GUARD_REQUIRED: "true"
  restart: unless-stopped
  networks:
    - apeireth-net
  volumes_from:
    - apeireth-data

services:
  # ============================================================
  # 1. 主编排: 跑 start_apeireth_r8.sh + 周期健康探测
  # ============================================================
  apeireth-r8-orchestrator:
    <<: *apeireth-common
    container_name: apeireth-r8-orchestrator
    command:
      - bash
      - /opt/apeireth/scripts/start_apeireth_r8.sh
    volumes:
      - ./scripts:/opt/apeireth/scripts:ro
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./tests:/opt/apeireth/tests:ro
      - ./logs:/opt/apeireth/logs
      - ./artifacts:/opt/apeireth/artifacts
      - ./data:/opt/apeireth/data
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /opt/apeireth/logs/r8_start_*.log && test $(find /opt/apeireth/logs -name 'r8_start_*.log' -mmin -10 | wc -l) -ge 1"
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      apeireth-r8-v3-guard:
        condition: service_healthy

  # ============================================================
  # 2. L1 安全门: V3 philosophy_guard (常驻守门)
  # ============================================================
  apeireth-r8-v3-guard:
    <<: *apeireth-common
    container_name: apeireth-r8-v3-guard
    command:
      - bash
      - -c
      - |
        while true; do
          python -m apeireth.v1081_asi_honest_limits --probe --report 2>&1 | tee -a /opt/apeireth/logs/v3_guard.log
          sleep 60
        done
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /opt/apeireth/logs/v3_guard.log && test $$(wc -l < /opt/apeireth/logs/v3_guard.log) -gt 0"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ============================================================
  # 3. L2 安全门: V1074 ASI 真测
  # ============================================================
  apeireth-r8-asi-measure:
    <<: *apeireth-common
    container_name: apeireth-r8-asi-measure
    command:
      - bash
      - -c
      - |
        while true; do
          echo "[$$(date -Is)] L2 measure tick" >> /opt/apeireth/logs/l2_measure.log
          sleep 1800
        done
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./logs:/opt/apeireth/logs
      - ./artifacts:/opt/apeireth/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/logs/l2_measure.log"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ============================================================
  # 4. L3 安全门: V1081 honest-limits probe
  # ============================================================
  apeireth-r8-honest-limits:
    <<: *apeireth-common
    container_name: apeireth-r8-honest-limits
    command:
      - bash
      - -c
      - |
        while true; do
          echo "[$$(date -Is)] L3 probe tick" >> /opt/apeireth/logs/l3_probe.log
          sleep 300
        done
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/logs/l3_probe.log"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ============================================================
  # 5. L4 安全门: HQB Live Gate (V1085/86/87 PDP-PEP 链)
  # ============================================================
  apeireth-r8-hqb-live-gate:
    <<: *apeireth-common
    container_name: apeireth-r8-hqb-live-gate
    command:
      - bash
      - -c
      - |
        while true; do
          python -m apeireth.v1087_asi_hqb_live_gate --self-check 2>&1 | tee -a /opt/apeireth/logs/l4_hqb.log
          sleep 120
        done
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./logs:/opt/apeireth/logs
      - ./artifacts:/opt/apeireth/artifacts
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /opt/apeireth/logs/l4_hqb.log && test $$(grep -c 'gate_id' /opt/apeireth/logs/l4_hqb.log 2>/dev/null || echo 0) -gt 0"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10s
    depends_on:
      apeireth-r8-v3-guard:
        condition: service_healthy

  # ============================================================
  # 6. 真生产 runtime: 4 个 R7 真实现模块
  # ============================================================
  v1090-memory-wal:
    <<: *apeireth-common
    container_name: v1090-memory-wal
    command: ["python", "-m", "apeireth.v1090_memory_wal", "--serve"]
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./data:/opt/apeireth/data
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/data/wal.lock"]
      interval: 30s
      timeout: 5s
      retries: 3

  v1091-memory-replay:
    <<: *apeireth-common
    container_name: v1091-memory-replay
    command: ["python", "-m", "apeireth.v1091_memory_replay", "--serve"]
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./data:/opt/apeireth/data
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/data/replay_checkpoint.lock"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      v1090-memory-wal:
        condition: service_healthy

  v1092-memory-dream:
    <<: *apeireth-common
    container_name: v1092-memory-dream
    command: ["python", "-m", "apeireth.v1092_memory_dream", "--serve"]
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./data:/opt/apeireth/data
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/data/dream.lock"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      v1091-memory-replay:
        condition: service_healthy

  # ============================================================
  # 7. R7 集成工程闭环服务 (复现→边界→审计→路由→推理)
  # ============================================================
  v1080-reproducibility:
    <<: *apeireth-common
    container_name: v1080-reproducibility
    command: ["python", "-m", "apeireth.v1080_asi_reproducibility", "--serve"]
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./artifacts:/opt/apeireth/artifacts
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/artifacts/reproducibility.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  v1081-honest-limits:
    <<: *apeireth-common
    container_name: v1081-honest-limits
    command: ["python", "-m", "apeireth.v1081_asi_honest_limits", "--probe-loop"]
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/logs/v1081_probe.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  v1082-codebase-audit:
    <<: *apeireth-common
    container_name: v1082-codebase-audit
    command: ["python", "-m", "apeireth.v1082_asi_codebase_audit", "--audit-loop"]
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./artifacts:/opt/apeireth/artifacts
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/artifacts/audit.heartbeat"]
      interval: 60s
      timeout: 15s
      retries: 3

  v1083-decision-router:
    <<: *apeireth-common
    container_name: v1083-decision-router
    command: ["python", "-m", "apeireth.v1083_asi_decision_router", "--serve"]
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/logs/router.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  v1084-real-llm:
    <<: *apeireth-common
    container_name: v1084-real-llm
    command: ["python", "-m", "apeireth.v1084_asi_real_llm_inference", "--serve"]
    environment:
      PYTHONPATH: /opt/apeireth
      NEWAPI_API_KEY: "${NEWAPI_API_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - ./apeireth:/opt/apeireth/apeireth:ro
      - ./logs:/opt/apeireth/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/apeireth/logs/v1084_llm.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # 8. 数据卷 / 网络
  # ============================================================
networks:
  apeireth-net:
    driver: bridge
    name: apeireth-r8-net

# 顶层声明 volume (向下兼容旧版 Docker Compose; 新版使用 volumes_from 在 service 级定义)
volumes:
  apeireth-data:
    driver: local
  apeireth-logs:
    driver: local
  apeireth-artifacts:
    driver: local
