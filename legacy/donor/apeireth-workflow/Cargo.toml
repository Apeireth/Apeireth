[package]
name = "apeireth-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth R152: Temporal-style workflow engine (Activity trait + WorkflowRunner + EventHistory). Borrows temporalio/temporal (13K stars) design, self-impl 0 引外部 dep."

[lib]
name = "apeireth_workflow"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = "0.12"
chrono = "0.4"
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

[[example]]
name = "workflow_demo"
path = "examples/workflow_demo.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
