<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apeireth 伙伴</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e6e6e6;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 18px; border-bottom: 1px solid #23272f;
    display: flex; align-items: center; gap: 10px; background: #14171d;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .meta { font-size: 12px; color: #8b93a3; }
  header .meta span { color: #3ddc84; }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg.ai { align-self: flex-start; background: #1c2129; border: 1px solid #2a303a; }
  .msg.tools { align-self: flex-start; background: #16211a; border: 1px solid #2c4433; color: #9fe6b8; font-size: 12px; padding: 6px 12px; border-radius: 8px; }
  .msg.err { align-self: flex-start; background: #241a1a; border: 1px solid #4a2c2c; color: #f0a0a0; font-size: 13px; }
  .typing { align-self: flex-start; color: #8b93a3; font-size: 13px; padding: 4px 8px; }
  #inputbar { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid #23272f; background: #14171d; }
  #input { flex: 1; background: #1c2129; border: 1px solid #2a303a; color: #e6e6e6; border-radius: 10px; padding: 12px 14px; font-size: 14px; outline: none; }
  #input:focus { border-color: #3b82f6; }
  button { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #2a303a; }
  button.secondary:hover { background: #374151; }
  footer { padding: 6px 18px; font-size: 11px; color: #5c6472; border-top: 1px solid #1a1e26; display: flex; justify-content: space-between; align-items: center; }
  #grantbtn { background: none; border: 1px solid #3a4250; color: #9fb3c8; border-radius: 6px; padding: 2px 10px; font-size: 11px; cursor: pointer; }
  #grantbtn:hover { border-color: #2563eb; color: #fff; }
  #grantpanel { display: none; background: #1c2129; border: 1px solid #2a303a; border-top: none; padding: 10px 18px; gap: 8px; align-items: center; font-size: 13px; }
  #grantpanel input { background: #14171d; border: 1px solid #2a303a; color: #e6e6e6; border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; width: 150px; }
  #grantpanel input.wide { width: 220px; }
  #grantpanel button { padding: 6px 14px; border-radius: 6px; font-size: 12px; }
  #grantmsg { font-size: 12px; color: #9fe6b8; }
  #reqbar { display: flex; flex-direction: column; gap: 8px; padding: 0 18px 10px; border-top: 1px solid #1a1e26; }
  .reqcard { background: #1a2028; border: 1px solid #2c3542; border-radius: 8px; padding: 8px 12px; font-size: 12px; display: flex; align-items: center; gap: 10px; }
  .reqcard .rtool { color: #ffd166; font-weight: 600; }
  .reqcard .rargs { color: #8b93a3; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reqcard button { padding: 4px 12px; border-radius: 6px; font-size: 12px; }
  .reqcard input { background: #14171d; border: 1px solid #2a303a; color: #e6e6e6; border-radius: 6px; padding: 4px 8px; font-size: 12px; width: 160px; outline: none; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>Apeireth 伙伴</h1>
  <div class="meta">companion_serve · 记忆持久 · 工具桥 · 宪法守护 · 自成长管道 <span id="feat"></span></div>
  <a href="/panel" title="Web 面板 v2: 会话/记忆/图谱/授权/审计" style="margin-left:auto; color:#7fb2ff; text-decoration:none; font-size:12px; border:1px solid #3a4250; border-radius:6px; padding:2px 10px;">Web 面板</a>
</header>
<div id="chat">
  <div id="welcome" style="align-self:center; color:#5c6472; font-size:13px; margin-top:40px; text-align:center;">
    （本座在。主人请讲——）<br>
    <span style="font-size:11px; color:#454c59">他会记得你，但不会每次都提醒你「我记得」。</span>
  </div>
</div>
<div id="grantpanel">
  <span style="color:#9fb3c8">⚙ 授权（权限洋葱：主人直接批准，本座不接触你的 token）</span>
  <input id="gtool" placeholder="工具名 (如 ShellExec)" list="tools">
  <datalist id="tools">
    <option value="ShellExec"><option value="FileOperator"><option value="Git"><option value="Crawl">
  </datalist>
  <input id="ghours" type="number" min="1" max="720" value="1" style="width:70px" title="授权小时数">
  <input id="gtoken" class="wide" type="password" placeholder="master token">
  <button id="gdo">授权</button>
  <span id="grantmsg"></span>
</div>
<div id="reqbar"></div>
<div id="inputbar">
  <input id="input" placeholder="和他聊聊…（Enter 发送）" autocomplete="off">
  <button id="grantbtn" title="授权高危工具（主人批准）">⚙ 授权</button>
  <button id="clear" class="secondary" title="清空本会话">清空</button>
  <button id="send">发送</button>
</div>
<footer>他的记忆是持久的：重启后还记得你 · 工具执行受宪法与你的授权约束 · 原则晋级需你批准</footer>
<script>
const messages = [];
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const MODEL = 'MiniMax-M3';

function addMsg(role, text) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  messages.push({ role: 'user', content: text });
  addMsg('user', text);
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = '他在想…';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, messages: messages, max_tokens: 8192 })
    });
    const j = await r.json();
    typing.remove();
    if (!r.ok) { addMsg('err', '请求失败: ' + (j.error?.message || r.status)); return; }
    const content = j.choices?.[0]?.message?.content || '(空回复)';
    addMsg('ai', content);
    messages.push({ role: 'assistant', content });
    const x = j.x_apeireth;
    if (x && x.tools_executed && x.tools_executed.length) {
      addMsg('tools', '🔧 本轮工具调用: ' + x.tools_executed.join(' · ') + (x.tool_rounds > 1 ? '（' + x.tool_rounds + ' 轮）' : ''));
    }
    if (x && x.continuity) {
      document.querySelector('.meta span') && (document.querySelector('.meta span').textContent = '');
    }
  } catch (e) {
    typing.remove();
    addMsg('err', '网络错误: ' + e.message + '（确认 serve 在运行）');
  }
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('send').addEventListener('click', send);
document.getElementById('clear').addEventListener('click', () => {
  messages.length = 0;
  chat.innerHTML = '';
  const w = document.createElement('div');
  w.id = 'welcome';
  w.style.cssText = 'align-self:center; color:#5c6472; font-size:13px; margin-top:40px; text-align:center;';
  w.innerHTML = '（本座在。主人请讲——）';
  chat.appendChild(w);
});
// 授权面板 (权限洋葱: 主人直接批准; AI 不接触 token)
const grantPanel = document.getElementById('grantpanel');
document.getElementById('grantbtn').addEventListener('click', () => {
  grantPanel.style.display = grantPanel.style.display === 'flex' ? 'none' : 'flex';
});
document.getElementById('gdo').addEventListener('click', async () => {
  const tool = document.getElementById('gtool').value.trim();
  const hours = document.getElementById('ghours').value || '1';
  const token = document.getElementById('gtoken').value.trim();
  const msg = document.getElementById('grantmsg');
  if (!tool) { msg.textContent = '请输入工具名'; return; }
  if (!token) { msg.textContent = '请输入 master token'; return; }
  try {
    const r = await fetch('/v1/apeireth/grant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool, hours: parseInt(hours), master_token: token })
    });
    const j = await r.json();
    if (r.ok) {
      try { localStorage.setItem('apeireth_token', token); } catch {}
      msg.textContent = '✅ 已授权 ' + tool + ' ' + hours + 'h';
    } else {
      msg.textContent = '❌ ' + (j.error || r.status);
    }
    document.getElementById('gtoken').value = '';
  } catch (e) {
    msg.textContent = '网络错误: ' + e.message;
  }
});
// 待批授权请求轮询: AI 被拒时产生请求, 主人在此一键批准 (权限洋葱真实载体)
const TOKEN = (() => { try { return localStorage.getItem('apeireth_token') || ''; } catch { return ''; } })();
async function pollRequests() {
  try {
    const r = await fetch('/v1/apeireth/approval-requests');
    const j = await r.json();
    const bar = document.getElementById('reqbar');
    bar.innerHTML = '';
    if (!j.count) return;
    for (const req of j.requests) {
      const card = document.createElement('div');
      card.className = 'reqcard';
      const tok = document.createElement('input');
      tok.type = 'password';
      tok.placeholder = 'master token';
      tok.value = (() => { try { return localStorage.getItem('apeireth_token') || ''; } catch { return ''; } })();
      const btn = document.createElement('button');
      btn.textContent = '批准 ' + req.tool;
      btn.addEventListener('click', async () => {
        const t = tok.value.trim();
        if (!t) {
          card.innerHTML = '<span style="color:#f0a0a0">❌ 请先在卡片右侧输入 master token（或先用⚙授权面板授权过）</span>';
          return;
        }
        try {
          const g = await fetch('/v1/apeireth/grant', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tool: req.tool, hours: 1, master_token: tok.value.trim() })
          });
          const gj = await g.json();
          if (g.ok) {
            try { localStorage.setItem('apeireth_token', tok.value.trim()); } catch {}
            card.innerHTML = '<span style="color:#9fe6b8">✅ 已授权 ' + req.tool + ' 1h — 对话里让本座重试即可</span>';
            addMsg('tools', '⚙ 主人已批准 ' + req.tool + '（1h）— 可以告诉本座继续了');
          } else {
            card.innerHTML = '<span style="color:#f0a0a0">❌ ' + (gj.error || g.status) + '</span>';
          }
        } catch (e) {
          card.innerHTML = '<span style="color:#f0a0a0">网络错误: ' + e.message + '</span>';
        }
        setTimeout(pollRequests, 1500);
      });
      card.appendChild(span('rtool', req.tool));
      card.appendChild(span('rargs', req.args_preview.length > 60 ? req.args_preview.slice(0, 60) + '…' : req.args_preview));
      card.appendChild(tok);
      card.appendChild(btn);
      bar.appendChild(card);
    }
  } catch (e) { /* serve 未起时静默 */ }
}
function span(cls, text) { const s = document.createElement('span'); s.className = cls; s.textContent = text; return s; }
setInterval(pollRequests, 3000);
pollRequests();
fetch('/health').then(r => r.json()).then(h => {
  if (h.features) document.getElementById('feat').textContent = '· ' + h.features.join(' · ');
}).catch(() => {});
// 主动送达 (模块 4): SSE 推送 — 他主动想说话/做梦反思完成时实时出现
try {
  const es = new EventSource('/v1/apeireth/events');
  es.onmessage = (e) => {
    const text = e.data || '';
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.style.border = '1px solid #3d5a3d';
    div.textContent = '📣 ' + text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  };
  es.onerror = () => { /* 断线自动重连 (EventSource 原生) */ };
} catch (e) { /* SSE 不可用时静默 */ }
</script>
</body>
</html>
