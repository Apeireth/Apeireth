[package]
name = "apeireth-pybridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth PyO3 桥 (Python 3.13.14 <-> Rust) — ADR 0007 compat-components-layer + ADR 0008 feature-gating (default 0 pyo3, --features python-ext 才编). R129-4/5/6/18 ASI Stage 4-7 + R220 async_wrapper + R128 Stage 2/3 集成验证. 32 src 模块 + 593 #[test] + 561 集成"

[dependencies]
apeireth-core = { path = "../../../crates/foundation/core" }
apeireth-memory = { path = "../../../crates/engine/memory" }
apeireth-asi = { path = "../apeireth-asi" }
# DEPRECATED(V2 Day 1 Step 1.1): `apeireth-philosophy` 已删; 来源已物理删除，依赖摘除。
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# ADR 0008: pyo3 是可选依赖 — 默认 build 不需要 Python 运行时,
# 仅在启用 `python-ext` feature 时才编译 PyO3 绑定 + 暴露 `#[pymodule]`。
pyo3 = { workspace = true, optional = true }

[lib]
name = "apeireth_pybridge"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# ADR 0007 + ADR 0008:
# - `default = []`               → 默认 build 不编译 pyo3 (cargo build --workspace 0 依赖 Python)
# - `python-ext = ["dep:pyo3"]`   → 显式启用时才引入 pyo3 + pyo3/extension-module
#   (完整 Python 3.13.14 ABI 绑定, 需要 Python 运行时)
[features]
default = []
python-ext = ["dep:pyo3", "pyo3/extension-module"]

# R19 第 0 阶段: workspace lint 继承 (见 workspace Cargo.toml [workspace.lints])
# 业界来源: wasmtime + qdrant 子 crate 都用 `workspace = true` 统一继承
[lints]
workspace = true
