[package]
name = "apeireth-credentials"
# 显式版本 (跟 apeireth-keyring / apeireth-i18n / apeireth-voice 模板同模式;
# 整合 #2 sub-agent 改 `version.workspace = true` + deps { workspace = true })
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Apeireth Team"]
license = "Apache-2.0"
repository = "https://github.com/apeireth/apeireth-rust"
description = "Apeireth R20 阶段 6 估缺: 多 provider 凭证 skeleton (1:1 翻译 v0.9.21 @anthropic-ai/credentials 商业版, 5 Provider + 5 鉴权 + 4 轮换策略 stub, 0 真接商业版 credentials, 留 R21+ 续)"
keywords = ["credentials", "auth", "token", "rotation", "multi-provider", "stub"]
categories = ["authentication", "api-bindings", "asynchronous"]

[dependencies]
# async runtime (显式版本, 整合 #2 sub-agent 改 `workspace = true`)
tokio = { version = "1.40", features = ["full"] }
# serialization (5 Provider 配置 / Token 序列化)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# error handling (CredentialsError 用 thiserror 派生)
anyhow = "1.0"
thiserror = "1.0"
# tracing (stub 工具返 NotImplemented 时 log)
tracing = "0.1"
# async traits (Provider / TokenManager 异步接口)
async-trait = "0.1"
# 时间戳 (token expires_at / rotation last_rotated_at)
chrono = { version = "0.4", features = ["serde"] }
# UUID (audit_event.event_id 派生)
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full", "test-util"] }
futures = "0.3"

[[example]]
name = "credentials_demo"
path = "examples/credentials_demo.rs"

# R20 阶段 6: 整合 #2 sub-agent 已加 Apeireth-rust members, [workspace] 块删除.
#   1. 删本 [workspace] 块 ✅
#   2. version 改 `version.workspace = true` ⏳ 整合 #2 时
#   3. deps 改 `{ workspace = true }` ⏳ 整合 #2 时
#   4. workspace Cargo.toml members 加 `crates/apeireth-credentials` ✅
# 当前 lints 留空, 不强求跟外层 workspace 同步, 避免 noise
[lints.rust]
unused_imports = "allow"
dead_code = "allow"
missing_docs = "allow"
