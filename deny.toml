# ============================================================================
# deny.toml — Apeireth 后端依赖治理 (R19 第 0 阶段第 2 项)
# ============================================================================
# 抄自: wasmtime/deny.toml (1537B)
# 文档: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# 验收: `cargo deny check` 0 issue
# 已知风险: Cargo.lock 当前有多版本分裂 (thiserror 1+2 / windows-sys / hashbrown /
#   getrandom 3 个 等, 以 cargo deny check bans 实测为准)
#   本文件先按 wasmtime 模式用 [bans.skip] 跳过, 留作 R19+ 任务收敛 (需要
#   各 crate 改用 workspace = true 锁版本, 然后 cargo update)。
# 2026-08-17 台账#40 清理: 删 19 unnecessary-skip (已单版本) + 12 unmatched-skip
#   (不在 [graph] targets 图内) — 过期 skip 会掩盖未来真实多版本问题。

[graph]
# Apeireth 当前 CI 只在 ubuntu-latest 跑, 但目标支持跨平台 (第 1 阶段 OS matrix)
# 抄 wasmtime: 4 个 target 三元组明确声明
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
]

# ----------------------------------------------------------------------------
# Licenses — 允许列表 (抄 wasmtime)
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# 实际用到的 15 种 (用 `cargo deny list` 生成):
#   0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0, ISC, MIT, MIT-0,
#   MPL-2.0, Unicode-3.0, Unlicense, Zlib, CDLA-Permissive-2.0,
#   Artistic-2.0, CC0-1.0 (这两个是 notify v5 的 CC0-1.0 OR Artistic-2.0 组合)
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",            # xxhash-rust v0.8.18
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# 许可搬运线第一批（2026-10-18）：jpeg-encoder 0.6.x 声明 `(MIT OR Apache-2.0) AND IJG`。
# IJG = Independent JPEG Group License（FSF Free/Libre、宽松非 copyleft、Debian main）。
# 走**最小面**例外：只对该 crate 放行 IJG 成分（不进全局 allow，不影响其余依赖图）；
# IJG 的文档致谢义务落在 OSS_NOTICE.md 许可搬运线节 + docs/04-internal/license-port/gate1-license.md。
[[licenses.exceptions]]
name = "jpeg-encoder"
allow = ["IJG"]

# The locked schema dependency uses the permissive no-attribution MIT variant.
# Review is limited to this exact crate release; unrelated licenses stay denied.
[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]

# ----------------------------------------------------------------------------
# Bans — 多版本 / wildcards / 黑名单
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "deny"   # ← 多版本强制 deny, 业界顶尖标准
wildcards = "allow"
deny = []
skip = [
    # ---- 2026-10-18 D5 对账（`cargo deny check bans` 实测）：删 25 个 unnecessary-skip
    # (单版本) + 8 个 unmatched-skip (不在 [graph] 4 target 图内) ----
    # 删除清单（原条目内容见本文件 commit 历史；记录在此供审计）：
    #   unnecessary: bitflags block-buffer cipher compact_str convert_case crossterm
    #   crypto-common digest fallible-iterator foldhash http indexmap inout mio ratatui
    #   rustc-hash serde_spanned sha2 socket2 strum toml toml_datetime tower
    #   unicode-width winnow
    #   unmatched: tungstenite tokio-tungstenite bit-set bit-vec gloo-net fancy-regex
    #   hmac notify
    # 原则（同 2026-08-17 台账#40）：过期/无用的 skip 会掩盖未来真实的多版本问题 ——
    # 依赖树收敛后立刻退役对应条目，等真出现多版本时由 deny 红 + 带理由 skip 重新登记。

    # ---- Windows 系统 crate (业界共识: skip) ----
    # 实测剩余多版本: windows-sys / windows-targets / windows_x86_64_gnu / windows_x86_64_msvc
    # (其余 windows-* 已单版本或不在 [graph] 4 target 图内, 2026-08-17 台账#40 已删)
    "windows-sys", "windows-targets",
    "windows_x86_64_gnu", "windows_x86_64_msvc",

    # ---- 其他业界共识 skip 的多版本 ----
    { name = "hashbrown", reason = "wasmtime 也 skip (waiting on lots of crates to update)" },
    { name = "itertools", reason = "0.10/11/13/14 — 多 crate 各自钉版本" },
    { name = "syn", reason = "1.x/2.x/3.x — proc macro crate 决定" },
    { name = "tower-http", reason = "跟随 tower 版本" },

    # ---- 2026-10-22 重新登记（D5 对账时曾作 unnecessary-skip 删除，今又出现双版本）----
    { name = "convert_case", reason = "0.6 (napi-derive / Tauri 侧) vs 0.10 (derive_more-impl) — 跨生态各自钉版本, 无收敛路径" },
    { name = "winnow", reason = "0.7 (toml 0.9) vs 1.0 (toml_edit / toml_parser) — 等 toml 家族自行统一" },

    # ---- 待 R19 T10 收敛的 crate (有理由收敛) ----
    { name = "thiserror", reason = "thiserror 1.0 vs 2.0 双版本 — 待 R19 T10 全量升 2.0 或 1.0" },
    { name = "thiserror-impl", reason = "跟随 thiserror 版本" },
    { name = "getrandom", reason = "3 个版本 (0.2/0.3/0.4) — 待 R19 T10 收敛" },
    { name = "rand", reason = "0.8 vs 0.10 — 跟随 getrandom 版本" },
    { name = "rand_core", reason = "跟随 rand 版本" },
    { name = "rustix", reason = "0.38 vs 1.x — 等 rustix 自己升" },
    { name = "cpufeatures", reason = "wasmtime 也 skip (requires update to sha2)" },
    { name = "linux-raw-sys", reason = "rustix 决定" },

    # ---- R139-1-retry 2026-08-11 的 16 duplicate 收敛：至 2026-10-18 已全部收敛为单版本,
    #      对应 skip 条目已退役（见上方删除清单），此处仅留沿革注记 ----
    # 2026-08-17 台账#40 已清 19 unnecessary-skip + 12 unmatched-skip；本批再清 33 条。

    # ---- CI fix 2026-08 (依赖升级后新增多版本, 有理由 skip) ----
    { name = "chacha20", reason = "0.9 vs 0.10 — RustCrypto 依赖树决定" },
    { name = "nom", reason = "1.x vs 8.0 — tract 0.23 引入 nom 8, 旧链保留 1.x" },
    # ---- PR #7 / 迁移收敛新增多版本 (有理由 skip) ----
    { name = "drm", reason = "gbm 0.18 (drm 0.14) vs libwayshot-xcap 0.3 (drm 0.15) 依赖树分裂" },
    { name = "miniz_oxide", reason = "png 0.18 (0.8) vs flate2 1.1 (0.9) 依赖树分裂" },
    { name = "shlex", reason = "bindgen 0.72 (shlex 1.3) vs cc 1.4 (shlex 2.0) 跨 major 版本" },
]

# ----------------------------------------------------------------------------
# Sources — 限制 crate 来源
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ----------------------------------------------------------------------------
# Advisories — 安全漏洞 (cargo-deny 自动从 RustSec 拉数据)
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # ========================================================================
    # 2026-10-18 D5 对账批：首破 0-ignore（4 条 unmaintained，全部 transitive、
    # 0 直接业务依赖、0 known vulnerability）。三处同步（deny.toml / audit.toml /
    # .github/workflows/cargo-audit.yml --ignore），复核日 2026-10-18。
    # ========================================================================
    # paste 1.0.15 ← pulp ← exr ← apeireth-image-codecs ← apeireth-image-core
    #   ← apeireth-tools-canonical（许可搬运线 vendored 图像家族的 EXR 支撑链）。
    #   上游已归档, 无安全升级路径。缓解: 我们对外只暴露 png/jpeg/webp/bmp 四格式,
    #   EXR 属核面保留能力; 若将来放弃 EXR 承诺, 去掉 exr 依赖即消。
    "RUSTSEC-2024-0436",
    # zbus_names / zvariant / zvariant_derive 5.x 家族 ← zbus 5.19 ← xcap 0.9.8
    #   ← apeireth-perception（屏幕采集面）。RustSec 2026-10 新判「不再作为独立
    #   crate 维护，迁移到 zbus 6」，而 xcap 0.9.8 钉 zbus 5.x —— 无安全升级路径，
    #   只能等上游 xcap 升 zbus 6。0 直接业务依赖。
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    #
    # 说明: 本清单只收 unmaintained 类（非漏洞）; vulnerability / unsound 仍 0 ignore。
    # 每次依赖树变动后复核: 条目若变成 advisory-not-detected 即删 (同 2026-10-06 批)。
    #
    # R25 Agent D 2026-08-10 — 0 vulnerabilities verified.
    # 上次验证: 2026-08-09 .github/workflows/cargo-audit.yml 跑 cargo audit --json
    #   → "vulnerabilities": {"found": [], "count": 0}
    # 上次验证: 2026-08-05 .github/workflows/cargo-deny.yml 跑 cargo deny check (4 类)
    #   → advisories check ok (CI ubuntu-latest, EmbarkStudios/cargo-deny-action@v2 拉 RustSec db)
    #
    # 留空 = 0 项需 ignore. 未来如出现 known false-positive, 按以下模板加:
    #   "RUSTSEC-YYYY-NNNN",  # <crate> <vuln> - <reason why we ignore>
    #
    # 业界参考 (per docs/Apeireth-v2.1-Industry-Top-Backend-Roadmap.md §A.7):
    #   - tokio deny.toml: 0 ignore (austere)
    #   - wasmtime deny.toml: 0 ignore (跟 tokio 同样)
    #   - memoryos-rust: 列具体 ignored CVE + 理由
    #   - qdrant: 0 ignore (推给 dependabot/RUSTSEC 自动)
    #
    # Apeireth 暂学 tokio/wasmtime/qdrant 的 0-ignore austere 模式. 后续如 cargo deny
    # check advisories 报 known false-positive (典型: getrandom 0.2 / chrono < 0.4.20 /
    # time < 0.3.7 / wasmtime CVE false-positive 等), 再按上面模板加.
    #
    # R139-1-retry 2026-08-11: 11 unmaintained 已知项, 全部由 transitive dep 引入, 0 直接业务依赖:
    # - gtk-rs (RUSTSEC-2024-0413, RUSTSEC-2024-0416): apeireth-r20-stage4 integration test 走 gtk (在 Windows 上 0 编译)
    # - paste (RUSTSEC-2024-0436): proc-macro-error / proc-macro-error2 链
    # - proc-macro-error (RUSTSEC-2024-0370): anyhow / thiserror 间接拉
    # - proc-macro-error2 (RUSTSEC-2026-0173): 同上
    # - unic-* (RUSTSEC-2025-0081/0075/0080/0100/0098): url / idna 间接拉
    # R139-1-retry 2026-08-11: unmaintained 已知项 (gtk-rs 链, 0 直接业务依赖):
    #   10 条 gtk-rs ignore 于 2026-10-06 复核批 (交接工作包 §4.4) 清空 —— 当前
    #   Cargo.lock 无 gtk 链 (该测试只存在于 legacy/archived/apeireth-integration-r20-stage4,
    #   不在工作区), `cargo deny check advisories` 对每条报 advisory-not-detected:
    #   no crate matched。按上方 0-ignore austere 模式回归留空。
    #   同批清空 audit.toml 20 条与 cargo-audit.yml 21 条过期 ignore (三处口径本就
    #   漂移: 20/10/21), 此后三处同步为空; 新增 ignore 须三处同步并写理由。
    #
    # 2026-10-03: 曾首次破 0-ignore (非 false-positive, 是 transitive 未修复面):
    # apeireth-tui (驾驶舱) → ratatui 0.29 → paste / lru 0.12, 三条 ignore 短接。
    # 2026-10-12 零债清偿批: ratatui 0.29 → 0.30 迁移落地 (0.30 去 paste、lru 升
    # 0.18.5 修复线), 依赖树复核 paste 已不存在、lru 单一 0.18.5 —— 三条 transitive
    # 面已消, ignore 随之清空 (advisory-not-detected), 回归 0-ignore austere 模式。
    # 同步清 audit.toml 与 cargo-audit.yml --ignore (三处同步)。
]
