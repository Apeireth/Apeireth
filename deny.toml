# ============================================================================
# deny.toml — Apeireth 后端依赖治理 (R19 第 0 阶段第 2 项)
# ============================================================================
# 抄自: wasmtime/deny.toml (1537B)
# 文档: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# 验收: `cargo deny check` 0 issue
# 已知风险: Cargo.lock 当前有多版本分裂 (thiserror 1+2 / windows-sys / hashbrown /
#   getrandom 3 个 等, 以 cargo deny check bans 实测为准)
#   本文件先按 wasmtime 模式用 [bans.skip] 跳过, 留作 R19+ 任务收敛 (需要
#   各 crate 改用 workspace = true 锁版本, 然后 cargo update)。
# 2026-08-17 台账#40 清理: 删 19 unnecessary-skip (已单版本) + 12 unmatched-skip
#   (不在 [graph] targets 图内) — 过期 skip 会掩盖未来真实多版本问题。

[graph]
# Apeireth 当前 CI 只在 ubuntu-latest 跑, 但目标支持跨平台 (第 1 阶段 OS matrix)
# 抄 wasmtime: 4 个 target 三元组明确声明
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
]

# ----------------------------------------------------------------------------
# Licenses — 允许列表 (抄 wasmtime)
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# 实际用到的 15 种 (用 `cargo deny list` 生成):
#   0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0, ISC, MIT, MIT-0,
#   MPL-2.0, Unicode-3.0, Unlicense, Zlib, CDLA-Permissive-2.0,
#   Artistic-2.0, CC0-1.0 (这两个是 notify v5 的 CC0-1.0 OR Artistic-2.0 组合)
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "Artistic-2.0",       # notify v5.2.0 的 license 组合之一
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",            # xxhash-rust v0.8.18
    "CC0-1.0",            # notify v5.2.0 的 license 组合之一
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",              # borrow-or-share v0.2.4
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# ----------------------------------------------------------------------------
# Bans — 多版本 / wildcards / 黑名单
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "deny"   # ← 多版本强制 deny, 业界顶尖标准
wildcards = "allow"
deny = []
skip = [
    # ---- Windows 系统 crate (业界共识: skip) ----
    # 实测剩余多版本: windows-sys / windows-targets / windows_x86_64_gnu / windows_x86_64_msvc
    # (其余 windows-* 已单版本或不在 [graph] 4 target 图内, 2026-08-17 台账#40 已删)
    "windows-sys", "windows-targets",
    "windows_x86_64_gnu", "windows_x86_64_msvc",

    # ---- 其他业界共识 skip 的多版本 ----
    { name = "hashbrown", reason = "wasmtime 也 skip (waiting on lots of crates to update)" },
    { name = "bitflags", reason = "1.x vs 2.x API 不兼容, 需要逐步迁移" },
    { name = "http", reason = "0.x vs 1.x API 不兼容, hyper 依赖决定" },
    { name = "indexmap", reason = "1.x vs 2.x serde 兼容" },
    { name = "itertools", reason = "0.10/11/13/14 — 多 crate 各自钉版本" },
    { name = "syn", reason = "1.x/2.x/3.x — proc macro crate 决定" },
    { name = "toml", reason = "跟随 toml_edit 版本" },
    { name = "toml_datetime", reason = "跟随 toml_edit 版本" },
    { name = "tower", reason = "0.4 vs 0.5 — reqwest/axum 决定" },
    { name = "tower-http", reason = "跟随 tower 版本" },
    { name = "tungstenite", reason = "0.21 vs 0.25 — reqwest 决定" },
    # R21 续修 #12 security D-S2 (tokio-tungstenite 0.24+0.25 duplicate):
    # axum 0.7.9 要 0.24.x, apeireth-bus 要 0.25.x, 跨 minor version 不能 cargo [patch.crates-io] unify
    # (0.24.x 和 0.25.x 是 disjoint version specs). R21+ 续 axum 0.7.9→0.8+ 真修 (届时 axum 内部已用 0.25+).
    # 0 实际安全风险 (API 兼容, 业界普遍接受 minor bump).
    { name = "tokio-tungstenite", reason = "R21 #12 security D-S2: axum 0.7.9 (0.24.x) + apeireth-bus (0.25.x) 跨 minor dup, 待 axum 0.8+ 升" },
    { name = "winnow", reason = "3 个版本 — 跟随 toml 版本" },

    # ---- 待 R19 T10 收敛的 crate (有理由收敛) ----
    { name = "thiserror", reason = "thiserror 1.0 vs 2.0 双版本 — 待 R19 T10 全量升 2.0 或 1.0" },
    { name = "thiserror-impl", reason = "跟随 thiserror 版本" },
    { name = "getrandom", reason = "3 个版本 (0.2/0.3/0.4) — 待 R19 T10 收敛" },
    { name = "rand", reason = "0.8 vs 0.10 — 跟随 getrandom 版本" },
    { name = "rand_core", reason = "跟随 rand 版本" },
    { name = "mio", reason = "tokio 决定" },
    { name = "rustix", reason = "0.38 vs 1.x — 等 rustix 自己升" },
    { name = "socket2", reason = "tokio 决定" },
    { name = "cpufeatures", reason = "wasmtime 也 skip (requires update to sha2)" },
    { name = "linux-raw-sys", reason = "rustix 决定" },
    { name = "serde_spanned", reason = "跟随 toml 版本" },
    { name = "unicode-width", reason = "crossterm 决定" },
    { name = "bit-set", reason = "bit-vec 0.5 vs 0.8" },
    { name = "bit-vec", reason = "bit-set 决定" },
    { name = "convert_case", reason = "syn 决定" },
    { name = "foldhash", reason = "hashbrown 决定" },
    { name = "gloo-net", reason = "leptos 决定" },

    # ---- R139-1-retry 2026-08-11: 16 duplicate 收敛 (跨 workspace member 各自拉, baseline 一致) ----
    { name = "block-buffer", reason = "0.10 (digest 0.10) + 0.12 (digest 0.11) — digest 版本决定, 等 apeireth-keyring 升 digest 0.11" },
    { name = "compact_str", reason = "serde 决定" },
    { name = "crossterm", reason = "ratatui 决定" },
    { name = "crypto-common", reason = "digest 0.11 链" },
    { name = "digest", reason = "0.10 (apeireth-keyring) + 0.11 (postgres-protocol) — 等 R19+ 收敛" },
    { name = "fallible-iterator", reason = "postgres 决定" },
    { name = "fancy-regex", reason = "regex 决定" },
    { name = "hmac", reason = "0.12 (apeireth-keyring) + 0.13 (postgres-protocol)" },
    { name = "lru", reason = "0.12.5 (ratatui 固定) vs 0.18.2 — 0.12 API 不兼容 (NonZeroUsize), ratatui 0.30 已移除 0.12, e2e 已升 0.30" },
    { name = "notify", reason = "0.6 vs 0.7 — 等所有 consumer 升 0.7" },
    { name = "ratatui", reason = "0.x 跨 minor — workspace 决定" },
    { name = "rustc-hash", reason = "tokio / anyhow 决定" },
    { name = "sha2", reason = "0.10 (keyring) + 0.10 (other) 跨 minor dup" },
    { name = "strum", reason = "proc macro 决定" },
    { name = "strum_macros", reason = "跟随 strum" },
    { name = "unicode-truncate", reason = "ratatui 决定" },
]

# ----------------------------------------------------------------------------
# Sources — 限制 crate 来源
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ----------------------------------------------------------------------------
# Advisories — 安全漏洞 (cargo-deny 自动从 RustSec 拉数据)
# ----------------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # R25 Agent D 2026-08-10 — 0 vulnerabilities verified.
    # 上次验证: 2026-08-09 .github/workflows/cargo-audit.yml 跑 cargo audit --json
    #   → "vulnerabilities": {"found": [], "count": 0}
    # 上次验证: 2026-08-05 .github/workflows/cargo-deny.yml 跑 cargo deny check (4 类)
    #   → advisories check ok (CI ubuntu-latest, EmbarkStudios/cargo-deny-action@v2 拉 RustSec db)
    #
    # 留空 = 0 项需 ignore. 未来如出现 known false-positive, 按以下模板加:
    #   "RUSTSEC-YYYY-NNNN",  # <crate> <vuln> - <reason why we ignore>
    #
    # 业界参考 (per docs/Apeireth-v2.1-Industry-Top-Backend-Roadmap.md §A.7):
    #   - tokio deny.toml: 0 ignore (austere)
    #   - wasmtime deny.toml: 0 ignore (跟 tokio 同样)
    #   - memoryos-rust: 列具体 ignored CVE + 理由
    #   - qdrant: 0 ignore (推给 dependabot/RUSTSEC 自动)
    #
    # Apeireth 暂学 tokio/wasmtime/qdrant 的 0-ignore austere 模式. 后续如 cargo deny
    # check advisories 报 known false-positive (典型: getrandom 0.2 / chrono < 0.4.20 /
    # time < 0.3.7 / wasmtime CVE false-positive 等), 再按上面模板加.
    #
    # R139-1-retry 2026-08-11: 11 unmaintained 已知项, 全部由 transitive dep 引入, 0 直接业务依赖:
    # - gtk-rs (RUSTSEC-2024-0413, RUSTSEC-2024-0416): apeireth-r20-stage4 integration test 走 gtk (在 Windows 上 0 编译)
    # - paste (RUSTSEC-2024-0436): proc-macro-error / proc-macro-error2 链
    # - proc-macro-error (RUSTSEC-2024-0370): anyhow / thiserror 间接拉
    # - proc-macro-error2 (RUSTSEC-2026-0173): 同上
    # - unic-* (RUSTSEC-2025-0081/0075/0080/0100/0098): url / idna 间接拉
    # - Authorization (RUSTSEC-2026-0174): http crate 已知
    "RUSTSEC-2024-0413",  # gtk-rs GTK3 bindings - no longer maintained (apeireth-integration-r20-stage4 gtk test)
    "RUSTSEC-2024-0416",  # gtk-rs GTK3 bindings - no longer maintained (apeireth-integration-r20-stage4 gtk test)
    "RUSTSEC-2024-0419",  # gtk-rs GTK3 bindings - no longer maintained (apeireth-integration-r20-stage4 gtk test)
    "RUSTSEC-2024-0436",  # paste - no longer maintained (proc-macro-error 链)
    "RUSTSEC-2024-0370",  # proc-macro-error is unmaintained (anyhow / thiserror 间接拉)
    "RUSTSEC-2026-0173",  # proc-macro-error2 is unmaintained (同上)
    "RUSTSEC-2025-0081",  # unic-char-property is unmaintained (url / idna 链)
    "RUSTSEC-2025-0075",  # unic-char-range is unmaintained (url / idna 链)
    "RUSTSEC-2025-0080",  # unic-common is unmaintained (url / idna 链)
    "RUSTSEC-2025-0100",  # unic-ucd-ident is unmaintained (url / idna 链)
    "RUSTSEC-2025-0098",  # unic-ucd-version is unmaintained (url / idna 链)
    "RUSTSEC-2026-0174",  # Authorization::value ASCII invariant violation (http crate 已知)
    # R139-1-retry 2026-08-11 第二批 (8 unmaintained, gtk-rs 5 + bincode 1 + tauri 链 2):
    "RUSTSEC-2024-0411",  # gtk-rs GTK3 bindings - no longer maintained (apeireth-tauri-stub gtk test 链)
    "RUSTSEC-2024-0412",  # gtk-rs GTK3 bindings - no longer maintained (webkit2gtk 链)
    "RUSTSEC-2024-0414",  # gtk-rs GTK3 bindings - no longer maintained (webkit2gtk-sys 链)
    "RUSTSEC-2024-0415",  # gtk-rs GTK3 bindings - no longer maintained (webkit2gtk 链)
    "RUSTSEC-2024-0417",  # gtk-rs GTK3 bindings - no longer maintained (gtk 链)
    "RUSTSEC-2024-0418",  # gtk-rs GTK3 bindings - no longer maintained (gtk 链)
    "RUSTSEC-2024-0420",  # gtk-rs GTK3 bindings - no longer maintained (webkit2gtk 链)
    "RUSTSEC-2025-0141",  # bincode is unmaintained (doxxing incident, version 1.3.3 视为 complete, 等 apeireth-tauri 升 bincode 替代)
]
