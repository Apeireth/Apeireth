# Apeireth cargo-rpm metadata
# 用于 `cargo rpm build` 自动生成 apeireth.spec (本目录的 spec 是手写正本)
# cargo-rpm 文档: https://github.com/rust-embedded/cargo-rpm

name: apeireth
version: 2.0.0
release: 0.1.rc1
summary: Apeireth 2.0 - AGI Operating System & Cognitive Microkernel
license: Apache-2.0
url: https://github.com/apeireth/apeireth-rust
description: |
  Apeireth OS 2.0 — Cognitive Microkernel & AGI Operating System.
  本包提供 Apeireth CLI / Gateway 二进制 (apeireth), 默认网关监听 :8080 (HTTP/WS).

build_depends:
  - cargo
  - ca-certificates
  - pkgconfig(dbus-1)
  - systemd

depends:
  - ca-certificates
  - systemd

files:
  - target/release/apeireth
  - /usr/lib/systemd/system/apeireth.service

